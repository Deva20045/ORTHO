dds intramuscular myxomas."},{"id":"ORTHO-U15-11","ch":15,"n":11,"title":"SBC versus ABC","sec":"Bone cyst · p127","qs":["ORTHO-C15-052","ORTHO-C15-053","ORTHO-C15-054","ORTHO-C15-055","ORTHO-C15-056","ORTHO-C15-057","ORTHO-C15-058","ORTHO-C15-059","ORTHO-C15-060"],"guide":"Simple bone cyst: unilocular, symmetrical, centric, straw fluid, proximal humerus — aspirate with steroids/sclerosants or graft. Aneurysmal bone cyst: multiloculated, ballooning, eccentric, blood-filled, around the knee — extended curettage with liquid nitrogen, phenol or cement, the same extended curettage GCT gets."},{"id":"ORTHO-U15-12","ch":15,"n":12,"title":"SBC Signs","sec":"Bone cyst · p127","qs":["ORTHO-C15-061","ORTHO-C15-062","ORTHO-C15-063"],"guide":"A child's metaphysis with an open growth plate hosts the SBC; a cortical chip that breaks and falls free is the fallen leaf sign, one that hinges is the trap door sign."},{"id":"ORTHO-U15-13","ch":15,"n":13,"title":"ABC Features & Cystic D/D","sec":"Bone cyst · p128","qs":["ORTHO-C15-064","ORTHO-C15-065","ORTHO-C15-066","ORTHO-C15-067","ORTHO-C15-068"],"guide":"ABC: child's metaphysis, multiloculated, MRI stacked with fluid-fluid levels — shared with GCT and telangiectatic osteosarcoma. Centric cystic lesions: SBC, enchondroma, Brodie's abscess; eccentric: GCT, ABC, NOF."},{"id":"ORTHO-U16-1","ch":16,"n":1,"title":"Cartilaginous Lesions Intro","sec":"Cartilaginous lesions · p129","qs":["ORTHO-C16-001","ORTHO-C16-002"],"guide":"Cartilage-forming tumors are chondrocyte predominant and announce themselves with popcorn, ring-and-arc (O-ring) calcification - the club of chondroma, osteochondroma and chondrosarcoma."},{"id":"ORTHO-U16-2","ch":16,"n":2,"title":"Osteochondroma: General Features","sec":"Osteochondroma · p129","qs":["ORTHO-C16-003","ORTHO-C16-004","ORTHO-C16-005","ORTHO-C16-006","ORTHO-C16-007","ORTHO-C16-008"],"guide":"Osteochondroma is the m/c benign bone tumor, m/c at the distal femur, a sessile or pedunculated mass that is aberrant growth-plate development. It grows epiphysis-to-metaphysis away from the joint, stops with skeletal maturity, and is not a true tumor."},{"id":"ORTHO-U16-3","ch":16,"n":3,"title":"Osteochondroma: Pain & Malignant Change","sec":"Osteochondroma · p129","qs":["ORTHO-C16-009","ORTHO-C16-010","ORTHO-C16-011","ORTHO-C16-012","ORTHO-C16-013","ORTHO-C16-014"],"guide":"Pain means bursitis first, then nerve compression or fracture. A cap over 2 cm on MRI, heavy cap calcification on X-ray, or growth persisting after skeletal maturity whispers chondrosarcoma."},{"id":"ORTHO-U16-4","ch":16,"n":4,"title":"Osteochondroma: Radiology & Rx","sec":"Osteochondroma · p130","qs":["ORTHO-C16-015","ORTHO-C16-016","ORTHO-C16-017","ORTHO-C16-018"],"guide":"Feel large, see small: the sub-2 cm cartilage cap hides from X-ray, while CT shows bone architecture matching normal. Cure is extraperiosteal excision after skeletal maturity."},{"id":"ORTHO-U16-5","ch":16,"n":5,"title":"Hereditary Multiple Exostosis","sec":"Heredity exostosis · p130","qs":["ORTHO-C16-019","ORTHO-C16-020","ORTHO-C16-021"],"guide":"Diaphyseal aclasis runs autosomal dominant through EXT 1,2 mutations, and 5% of the multiple lesions turn chondrosarcoma."},{"id":"ORTHO-U16-6","ch":16,"n":6,"title":"Enchondroma","sec":"Enchondroma · p130","qs":["ORTHO-C16-022","ORTHO-C16-023","ORTHO-C16-024"],"guide":"Enchondroma rules the small bones of hand and feet, sits metaphyseal, and gets extended curettage with bone graft."},{"id":"ORTHO-U16-7","ch":16,"n":7,"title":"Ollier's & Maffucci's","sec":"Enchondroma syndromes · p130","qs":["ORTHO-C16-025","ORTHO-C16-026","ORTHO-C16-027"],"guide":"Multiple enchondromas make Ollier's syndrome - very rare, 30% premalignant. When cavernous hemangiomas and lymphangiomas join in, it is Maffucci's."},{"id":"ORTHO-U16-8","ch":16,"n":8,"title":"Hand Tumor Note","sec":"Hand tumors · p130","qs":["ORTHO-C16-028","ORTHO-C16-029"],"guide":"The hand's commonest tumor is squamous cell carcinoma, not a bone tumor. Enchondroma's great mimic in fingers is spina ventosa - TB dactylitis."},{"id":"ORTHO-U16-9","ch":16,"n":9,"title":"Chondroblastoma","sec":"Chondroblastoma · p131","qs":["ORTHO-C16-030","ORTHO-C16-031","ORTHO-C16-032","ORTHO-C16-033","ORTHO-C16-034","ORTHO-C16-035"],"guide":"Codman's tumor claims the child's epiphysis at 10-25 years: stippled calcification on film, chicken-wire calcification on biopsy, cured by excision curettage with autologous graft."},{"id":"ORTHO-U16-10","ch":16,"n":10,"title":"Osteoid Osteoma","sec":"Osteoid osteoma · p131","qs":["ORTHO-C16-036","ORTHO-C16-037","ORTHO-C16-038","ORTHO-C16-039","ORTHO-C16-040","ORTHO-C16-041","ORTHO-C16-042","ORTHO-C16-043"],"guide":"The m/c true benign tumor: diaphyseal, cortical, femoral. Prostaglandins from the central nidus kindle night pain that aspirin quenches; a lucent nidus ringed by dense sclerosis seals the diagnosis - NSAIDs, RFA or excision."},{"id":"ORTHO-U16-11","ch":16,"n":11,"title":"Osteoblastoma","sec":"Osteoblastoma · p131","qs":["ORTHO-C16-044","ORTHO-C16-045","ORTHO-C16-046","ORTHO-C16-047","ORTHO-C16-048"],"guide":"Osteoblastoma is osteoid osteoma grown past 2 cm in the spine, may ignore aspirin, carries a whisper of osteosarcoma risk - excise it."},{"id":"ORTHO-U16-12","ch":16,"n":12,"title":"GCT: General Features","sec":"Giant cell tumor · p132","qs":["ORTHO-C16-049","ORTHO-C16-050","ORTHO-C16-051","ORTHO-C16-052","ORTHO-C16-053","ORTHO-C16-054","ORTHO-C16-055"],"guide":"Osteoclastoma: locally aggressive, epiphysio-metaphyseal, female-predominant, 20-40 years after skeletal maturity. Distal femur round the knee is the favourite seat, distal radius the classical one."},{"id":"ORTHO-U16-13","ch":16,"n":13,"title":"GCT: Clinical, Biopsy & Rx","sec":"Giant cell tumor · p132","qs":["ORTHO-C16-056","ORTHO-C16-057","ORTHO-C16-058","ORTHO-C16-059","ORTHO-C16-060","ORTHO-C16-061","ORTHO-C16-062"],"guide":"Eggshell crackling, a soap bubble of leftover trabeculae, giant cells around RANK-spewing mononuclear tumor cells. Extended curettage with liquid nitrogen, phenol or cement, then autograft - remember the six E's."},{"id":"ORTHO-U16-14","ch":16,"n":14,"title":"GCT Variants & Malignant Change","sec":"GCT variants · p132","qs":["ORTHO-C16-063","ORTHO-C16-064","ORTHO-C16-065","ORTHO-C16-066","ORTHO-C16-067","ORTHO-C16-068","ORTHO-C16-069"],"guide":"Giant-cell-rich company: NOF most common, ABC closest in resemblance. Under 5% turn malignant (3% of those fly to the lungs), but 30% come back locally."},{"id":"ORTHO-U16-15","ch":16,"n":15,"title":"Hemangioma","sec":"Hemangioma · p133","qs":["ORTHO-C16-070","ORTHO-C16-071","ORTHO-C16-072","ORTHO-C16-073","ORTHO-C16-074","ORTHO-C16-075","ORTHO-C16-076"],"guide":"The elderly spine's quiet vascular blotch: jail bars (corduroy) on X-ray, polka dots on axial CT, spine > skull > pelvis. Treat conservatively, by radiotherapy or vertebroplasty - bone cement."},{"id":"ORTHO-U16-16","ch":16,"n":16,"title":"Chondrosarcoma","sec":"Chondrosarcoma · p133","qs":["ORTHO-C16-077","ORTHO-C16-078","ORTHO-C16-079","ORTHO-C16-080"],"guide":"Chondrosarcoma: 40-50 years, metaphyseal, in the pelvis and proximal femur as a calcified tumor with hyperglycemia as paraneoplasia. Endosteal scalloping and punctate calcification on film."},{"id":"ORTHO-U16-17","ch":16,"n":17,"title":"Osteosarcoma: General Features","sec":"Osteosarcoma · p134","qs":["ORTHO-C16-081","ORTHO-C16-082","ORTHO-C16-083","ORTHO-C16-084","ORTHO-C16-085","ORTHO-C16-086","ORTHO-C16-087","ORTHO-C16-088","ORTHO-C16-089"],"guide":"Children's commonest bone cancer: bimodal (1st decade 1°, older 2° via Paget/radiation), metaphyseal distal femur, radio-resistant, osteoid-forming. 15% already harbour lung micrometastases that can pop a pneumothorax."},{"id":"ORTHO-U16-18","ch":16,"n":18,"title":"Osteosarcoma: X-ray & Types","sec":"Osteosarcoma X-ray · p134","qs":["ORTHO-C16-090","ORTHO-C16-091","ORTHO-C16-092","ORTHO-C16-093"],"guide":"Elevated periosteum draws Codman's triangle; calcified Sharpey's fibres burst into a sunburst. Classical intramedullary is the commonest of the four types."},{"id":"ORTHO-U16-19","ch":16,"n":19,"title":"Osteosarcoma: Rx & TID Chemo","sec":"Osteosarcoma Rx · p135","qs":["ORTHO-C16-094","ORTHO-C16-095","ORTHO-C16-096"],"guide":"Map: neoadjuvant chemo, surgery/limb ablation, adjuvant chemo. Drugs - the TID protocol: actinomycin, cyclophosphamide, bleomycin, high-dose methotrexate, doxorubicin, vincristine."},{"id":"ORTHO-U16-20","ch":16,"n":20,"title":"Ewing: General & Prognosis","sec":"Ewing sarcoma · p135","qs":["ORTHO-C16-097","ORTHO-C16-098","ORTHO-C16-099","ORTHO-C16-100","ORTHO-C16-101","ORTHO-C16-102","ORTHO-C16-103"],"guide":"Ewing owns the 1st decade, peaks in the 2nd (5-20 yrs) as a high-grade diaphyseal femur mass in boys. Metastasis, male sex, fever, anemia, raised ESR, age over 14, leukocytosis, chemoresistance and relapse all darken the outlook."},{"id":"ORTHO-U16-21","ch":16,"n":21,"title":"Ewing: Clinical, X-ray & Biopsy","sec":"Ewing biopsy · p135","qs":["ORTHO-C16-104","ORTHO-C16-105","ORTHO-C16-106","ORTHO-C16-107","ORTHO-C16-108","ORTHO-C16-109","ORTHO-C16-110"],"guide":"It masquerades as infection with an onion-peel film; biopsy - the best test - shows small round blue cells in pseudo-rosettes, PAS-positive and diastase digestible, MIC-2 (CD99) positive, carrying t(11;22)."},{"id":"ORTHO-U16-22","ch":16,"n":22,"title":"Ewing: Rx & PNET Note","sec":"Ewing Rx · p135","qs":["ORTHO-C16-111","ORTHO-C16-112","ORTHO-C16-113"],"guide":"Radiosensitive yet radiotherapy is shunned for fear of recurrence; today it is chemotherapy with limb salvage and adjuvant radiation. Neuroblastoma, retinoblastoma and medulloblastoma share the small-blue-round-cell club."},{"id":"ORTHO-U16-23","ch":16,"n":23,"title":"Chordoma, Adamantinoma & Synovial","sec":"Misc tumors · p136","qs":["ORTHO-C16-114","ORTHO-C16-115","ORTHO-C16-116","ORTHO-C16-117","ORTHO-C16-118","ORTHO-C16-119","ORTHO-C16-120"],"guide":"Chordoma rises from notochord rests in the elderly sacrum; adamantinoma, a low-grade epithelial malignancy, soap-bubbles the tibial diaphysis; synovial sarcoma ignores synovium, born of capsule, bursae or tendon with t(x;18) SYT:SSX."},{"id":"ORTHO-U16-24","ch":16,"n":24,"title":"Metastasis & Key Summary","sec":"Metastasis · p136","qs":["ORTHO-C16-121","ORTHO-C16-122","ORTHO-C16-123","ORTHO-C16-124","ORTHO-C16-125","ORTHO-C16-126","ORTHO-C16-127","ORTHO-C16-128","ORTHO-C16-129","ORTHO-C16-130"],"guide":"Metastasis is the commonest malignant bone tumor - breast, prostate, lung riding to the lumbar spine. Prostate blastic, kidney and follicular thyroid lytic, breast mixed; the winking owl is a eaten pedicle. Myeloma heads the malignant list, osteochondroma the benign, osteoid osteoma the true-benign."},{"id":"ORTHO-U17-1","ch":17,"n":1,"title":"Infections: Site & Etiology","sec":"Skeletal infections · p137","qs":["ORTHO-C17-001","ORTHO-C17-002","ORTHO-C17-003","ORTHO-C17-004","ORTHO-C17-005","ORTHO-C17-006","ORTHO-C17-007"],"guide":"Bone plus medullary cavity is osteomyelitis (metaphysis of long bone); joint is septic arthritis. Bacteria rule - pyogenes burn with severe periosteal reaction while TB smoulders with a limited one, except in the short bones of hand and foot where even TB flares."},{"id":"ORTHO-U17-2","ch":17,"n":2,"title":"Routes of Infection","sec":"Osteomyelitis routes · p137","qs":["ORTHO-C17-008","ORTHO-C17-009","ORTHO-C17-010","ORTHO-C17-011","ORTHO-C17-012"],"guide":"Children and the elderly fall first - low immunity. The bloodstream seeds bone from a pre-existing focus most often; puncture wounds, surgery and open fractures inoculate directly, and a septic joint can chew its way into bone."},{"id":"ORTHO-U17-3","ch":17,"n":3,"title":"Staph aureus","sec":"Osteomyelitis etiology · p137","qs":["ORTHO-C17-013","ORTHO-C17-014","ORTHO-C17-015"],"guide":"Staphylococcus aureus is king of musculoskeletal infection - the m/c cause of osteomyelitis overall, acute and chronic, in rich and poor countries alike, in HIV, open fractures and post-surgery."},{"id":"ORTHO-U17-4","ch":17,"n":4,"title":"Special-Case Organisms","sec":"Special cases · p138","qs":["ORTHO-C17-016","ORTHO-C17-017","ORTHO-C17-018","ORTHO-C17-019","ORTHO-C17-020","ORTHO-C17-021"],"guide":"Memorise the pairing grid: sickle cell - Salmonella diaphyseal (metaphysis means Staph); IV drugs - Pseudomonas; animal bite - Pasteurella; human bite - Eikenella; long parenteral lines - fungi."},{"id":"ORTHO-U17-5","ch":17,"n":5,"title":"Site & Metaphyseal Preference","sec":"Site · p138","qs":["ORTHO-C17-022","ORTHO-C17-023","ORTHO-C17-024","ORTHO-C17-025"],"guide":"Children break their femur distally then tibia; adults guard their vertebrae. The metaphysis beckons organisms: most vascular soil, hair-pin vessels with sluggish flow, and few patrolling macrophages."},{"id":"ORTHO-U17-6","ch":17,"n":6,"title":"Acute OM: Pathophysiology Timeline","sec":"Pathophysiology · p138","qs":["ORTHO-C17-026","ORTHO-C17-027","ORTHO-C17-028","ORTHO-C17-029","ORTHO-C17-030","ORTHO-C17-031","ORTHO-C17-032","ORTHO-C17-033"],"guide":"The clock: organism lands in metaphysis <24 h with fever and pain; after 24 h an abscess pools; dead bone (sequestrum) drops inside it; periosteum builds the involucrum by about 10 days; a break in involucrum is cloaca, in skin a sinus - pus escapes."},{"id":"ORTHO-U17-7","ch":17,"n":7,"title":"Clinical Features","sec":"Clinical features · p139","qs":["ORTHO-C17-034","ORTHO-C17-035","ORTHO-C17-036","ORTHO-C17-037"],"guide":"A young child with high fever, painful swollen limb that he refuses to move - pseudoparalysis. Think septic arthritis, osteomyelitis, or scurvy's subperiosteal bleed."},{"id":"ORTHO-U17-8","ch":17,"n":8,"title":"Acute vs Chronic Hallmarks","sec":"Hallmarks · p139","qs":["ORTHO-C17-038","ORTHO-C17-039","ORTHO-C17-040","ORTHO-C17-041"],"guide":"Two-by-two: acute has fever-and-pain clinically and an abscess pathologically; chronic announces a sinus and hides a sequestrum."},{"id":"ORTHO-U17-9","ch":17,"n":9,"title":"Blood Investigations","sec":"Investigations · p139","qs":["ORTHO-C17-042","ORTHO-C17-043","ORTHO-C17-044"],"guide":"Blood culture catches the bug half the time; WBC, ESR, CRP rise but accuse no one; serum procalcitonin alone is both sensitive and specific for acute osteomyelitis and septic arthritis."},{"id":"ORTHO-U17-10","ch":17,"n":10,"title":"Radiology Timeline","sec":"Radiology · p139","qs":["ORTHO-C17-045","ORTHO-C17-046","ORTHO-C17-047","ORTHO-C17-048","ORTHO-C17-049"],"guide":"MRI sees marrow edema within 24 h; bone scan glows with Tc99, Ga67, In111-WBC; X-ray waits a day, shows soft tissue shadow by 48 h, and only at 7-10 days lifts the periosteal veil."},{"id":"ORTHO-U17-11","ch":17,"n":11,"title":"Biopsy & Treatment","sec":"Biopsy & treatment · p140","qs":["ORTHO-C17-050","ORTHO-C17-051","ORTHO-C17-052","ORTHO-C17-053","ORTHO-C17-054","ORTHO-C17-055","ORTHO-C17-056"],"guide":"Biopsy from the site is gold standard. Within 24 h antibiotics may suffice, after 24 h add drainage; six weeks of antibiotics (2 IV, 4 oral) because bone drinks drugs poorly - track the fall of CRP, and splint, cool and elevate meanwhile."},{"id":"ORTHO-U17-12","ch":17,"n":12,"title":"Complications of Acute OM","sec":"Complications · p140","qs":["ORTHO-C17-057","ORTHO-C17-058","ORTHO-C17-059","ORTHO-C17-060"],"guide":"Chronicity tops the list; pus may cross to the joint where the growth plate is missing - under 1 year or after fusion - and septicemia and growth disturbance complete the four."},{"id":"ORTHO-U17-13","ch":17,"n":13,"title":"Durations & Chronic OM","sec":"Duration & chronic OM · p140","qs":["ORTHO-C17-061","ORTHO-C17-062","ORTHO-C17-063","ORTHO-C17-064"],"guide":"Cut the timeline at 2 and 4 weeks: acute under two, subacute two-to-four, chronic beyond four - chronic is simply acute osteomyelitis that never died, wearing a sinus as its badge."},{"id":"ORTHO-U17-14","ch":17,"n":14,"title":"Sequestrum","sec":"Sequestrum · p141","qs":["ORTHO-C17-065","ORTHO-C17-066","ORTHO-C17-067"],"guide":"A dead, dense, devascularized island of bone floating in pus, wrapped in granulation tissue and involucrum, its haversian systems destroyed - the pathological signature of chronicity."},{"id":"ORTHO-U17-15","ch":17,"n":15,"title":"Types of Sequestrum","sec":"Types of sequestrum · p141","qs":["ORTHO-C17-068","ORTHO-C17-069","ORTHO-C17-070","ORTHO-C17-071","ORTHO-C17-072","ORTHO-C17-073","ORTHO-C17-074"],"guide":"Shape names the disease: coral for Perthe's, ring for pins and stumps, tubular for pyogenic infection, feathery sandy for TB, fine sandy for viral, button-hole after radiation, ivory for syphilis."},{"id":"ORTHO-U17-16","ch":17,"n":16,"title":"Chronic OM: Workup & Initial Rx","sec":"Chronic OM workup · p141","qs":["ORTHO-C17-075","ORTHO-C17-076","ORTHO-C17-077","ORTHO-C17-078"],"guide":"X-ray unmasks sequestrum, involucrum and cloaca; dye through the sinus maps its track; biopsy remains gold standard - start broad-spectrum antibiotics and support the patient."},{"id":"ORTHO-U17-17","ch":17,"n":17,"title":"Surgery for Chronic OM","sec":"Chronic OM surgery · p142","qs":["ORTHO-C17-079","ORTHO-C17-080","ORTHO-C17-081","ORTHO-C17-082","ORTHO-C17-083","ORTHO-C17-084","ORTHO-C17-085","ORTHO-C17-086","ORTHO-C17-087","ORTHO-C17-088"],"guide":"The operative ladder under antibiotic cover: sequestrectomy, curettage to the Paprika blush, saucerization, dead space filled with graft or cement, skin flapped or VAC'd at -75 to -125 mmHg - never on eschar or tumor."},{"id":"ORTHO-U17-18","ch":17,"n":18,"title":"Chronic OM Complications","sec":"Chronic OM complications · p142","qs":["ORTHO-C17-089","ORTHO-C17-090","ORTHO-C17-091"],"guide":"Pathological fracture comes first, sinuses can turn squamous, and flare-ups and amyloidosis round out the toll of a chronic discharging wound."},{"id":"ORTHO-U17-19","ch":17,"n":19,"title":"Variants & Brodie's Abscess","sec":"Brodie's abscess · p143","qs":["ORTHO-C17-092","ORTHO-C17-093","ORTHO-C17-094","ORTHO-C17-095","ORTHO-C17-096","ORTHO-C17-097","ORTHO-C17-098","ORTHO-C17-099"],"guide":"Strong host, weak bug - infection walled off without sinus or sequestrum. Brodie's: subacute, proximal tibia, pus positive, dull ache with low fever, a lucent eye ringed by sclerotic rim - penumbra on MRI - treat with antibiotics ± debridement."},{"id":"ORTHO-U17-20","ch":17,"n":20,"title":"Garre's Sclerosing OM","sec":"Garre's OM · p143","qs":["ORTHO-C17-100","ORTHO-C17-101","ORTHO-C17-102","ORTHO-C17-103","ORTHO-C17-104"],"guide":"Garré's: the dry chronic twin - mandible more than tibia, no pus, no raised ESR, just bony hard swelling and bone gone rock-dense from excessive periosteal reaction; antibiotics suffice."},{"id":"ORTHO-U17-21","ch":17,"n":21,"title":"Septic Arthritis: Basics","sec":"Septic arthritis · p144","qs":["ORTHO-C17-105","ORTHO-C17-106","ORTHO-C17-107","ORTHO-C17-108","ORTHO-C17-109","ORTHO-C17-110","ORTHO-C17-111","ORTHO-C17-112"],"guide":"Pus in a joint is a surgical emergency - undrained it digests cartilage. Under-five children and the elderly, blood-borne Staph aureus (Pseudomonas in addicts, gonococcus in the sexually active), knee first, hip in infants - Tom Smith."},{"id":"ORTHO-U17-22","ch":17,"n":22,"title":"Septic Arthritis: Clinical","sec":"Septic arthritis clinical · p144","qs":["ORTHO-C17-113","ORTHO-C17-114","ORTHO-C17-115","ORTHO-C17-116","ORTHO-C17-117"],"guide":"Swollen, red, exquisitely painful joint held still; the limb rests where the capsule is slackest - hip in FABER, knee at 5-30 degrees - and the knee offers a positive patellar tap."},{"id":"ORTHO-U17-23","ch":17,"n":23,"title":"Septic Arthritis: Investigations","sec":"Septic arthritis Ix · p144","qs":["ORTHO-C17-118","ORTHO-C17-119","ORTHO-C17-120","ORTHO-C17-121","ORTHO-C17-122"],"guide":"Bloods and culture, an early film that shows little but a widened space, late destruction, MRI synovial thickening - and ultrasound-guided arthrocentesis that both names the culprit and relieves the joint."},{"id":"ORTHO-U17-24","ch":17,"n":24,"title":"Rx & Ankylosis Types","sec":"Septic arthritis Rx · p145","qs":["ORTHO-C17-123","ORTHO-C17-124","ORTHO-C17-125","ORTHO-C17-126","ORTHO-C17-127","ORTHO-C17-128","ORTHO-C17-129","ORTHO-C17-130","ORTHO-C17-131","ORTHO-C17-132"],"guide":"Arthrotomy with irrigation and debridement is TOC; neglect lets collagenases strip cartilage until raw bones fuse - bony ankylosis. Disease fusion is ankylosis (bony from pyogenic/TB spine - stable, painless; fibrous from TB - mobile, painful, unstable), surgery's is arthrodesis."},{"id":"ORTHO-U17-25","ch":17,"n":25,"title":"Tom Smith Arthritis","sec":"Tom Smith arthritis · p145","qs":["ORTHO-C17-133","ORTHO-C17-134","ORTHO-C17-135"],"guide":"Infant's septic hip under one year: pus and enzymes dissolve the cartilaginous capital epiphysis - chondrolysis - leaving a hypermobile, shortened limb with positive telescopy."},{"id":"ORTHO-U17-26","ch":17,"n":26,"title":"Transient Synovitis & Kocher's","sec":"Transient synovitis · p146","qs":["ORTHO-C17-136","ORTHO-C17-137","ORTHO-C17-138","ORTHO-C17-139","ORTHO-C17-140","ORTHO-C17-141","ORTHO-C17-142","ORTHO-C17-143","ORTHO-C17-144","ORTHO-C17-145"],"guide":"A post-viral, self-limiting 'observation hip' of 6-12 year olds: limp, mild fever, position of ease. Joint aspiration is the best divider, Kocher counts four points - weight bearing, >38.5°C, ESR >40, WBC >12,000 - the more, the more septic. Limp in a child: transient synovitis first."},{"id":"ORTHO-U17-27","ch":17,"n":27,"title":"Paronychia","sec":"Hand infections · p146","qs":["ORTHO-C17-146","ORTHO-C17-147","ORTHO-C17-148","ORTHO-C17-149"],"guide":"The commonest hand infection runs around the nail - Staph aureus again; drain it, and if it sneaks under the nail bed, lift a piece of nail."},{"id":"ORTHO-U17-28","ch":17,"n":28,"title":"Felon (Whitlow)","sec":"Felon · p147","qs":["ORTHO-C17-150","ORTHO-C17-151","ORTHO-C17-152","ORTHO-C17-153"],"guide":"Pulp-space abscess of the distal phalanx, thumb first: a tense throbbing digit that can erode into bone or tendon; a vertical incision breaks the septae and lets the pus go."},{"id":"ORTHO-U17-29","ch":17,"n":29,"title":"Tenosynovitis","sec":"Tenosynovitis · p147","qs":["ORTHO-C17-154","ORTHO-C17-155","ORTHO-C17-156","ORTHO-C17-157"],"guide":"Infected tendon sheath: finger held flexed, fusiform swelling, pain on passive extension and Kanavel's tap - antibiotics plus incision and drainage."},{"id":"ORTHO-U18-1","ch":18,"n":1,"title":"TB of Bone: Introduction","sec":"Introduction · p148","qs":["ORTHO-C18-001","ORTHO-C18-002","ORTHO-C18-003","ORTHO-C18-004","ORTHO-C18-005","ORTHO-C18-006","ORTHO-C18-007","ORTHO-C18-008","ORTHO-C18-009","ORTHO-C18-010","ORTHO-C18-011","ORTHO-C18-012"],"guide":"Koch's weak bacillus rides the blood from a primary focus - the lung - to settle in bone, where it rages far less than a pyogenes: less severe, paucibacillary, insidious. It picks the spine first (Pott's), then hip, then knee; within the spine dorso-lumbar beats dorsal beats lumbar, and children favour the cervical spine. The shoulder's dry 'caries sicca' and the fingers' air-filled 'spina ventosa' are the book's two named variants."},{"id":"ORTHO-U18-2","ch":18,"n":2,"title":"TB Spine: Four Types","sec":"TB Spine Types · p148","qs":["ORTHO-C18-013","ORTHO-C18-014","ORTHO-C18-015","ORTHO-C18-016","ORTHO-C18-017"],"guide":"Pott's spine can strike four ways: paradiscally (the most common), centrally in the vertebral body, anteriorly - the wet exudative form of childhood - or posteriorly, the rarest of all. The paradiscal diagram lights up the para-vertebral bone and the disc between."},{"id":"ORTHO-U18-3","ch":18,"n":3,"title":"The Paradiscal Sandwich","sec":"Paradiscal · p149","qs":["ORTHO-C18-018","ORTHO-C18-019","ORTHO-C18-020","ORTHO-C18-021","ORTHO-C18-022"],"guide":"Paradiscal TB eats a three-bone sandwich: lower half of the upper vertebra, the disc, upper half of the lower vertebra - common somite, common sclerotome, common blood supply explain the triple hit. The lesion camps in front of the spinal cord, while the nerve slips out harmlessly through the intervertebral foramen."},{"id":"ORTHO-U18-4","ch":18,"n":4,"title":"Clinical Features","sec":"Clinical features · p149","qs":["ORTHO-C18-023","ORTHO-C18-024","ORTHO-C18-025","ORTHO-C18-026","ORTHO-C18-027","ORTHO-C18-028","ORTHO-C18-029","ORTHO-C18-030","ORTHO-C18-031"],"guide":"The patient announces himself with low-grade fever, malaise, night pains and an evening temperature rise; the spine answers with back pain (earliest symptom) and paraspinal spasm (earliest sign). Spasm straightens the back into the military attitude with a cautious gait; collapse brings the cold abscess and a growing hump - one spinous process is a knuckle, two or three a gibbus, more than three an angular kyphosis."},{"id":"ORTHO-U18-5","ch":18,"n":5,"title":"Investigation & Complications","sec":"Investigation & Complications · p149","qs":["ORTHO-C18-032","ORTHO-C18-033","ORTHO-C18-034","ORTHO-C18-035","ORTHO-C18-036","ORTHO-C18-037","ORTHO-C18-038"],"guide":"The first X-ray whisper is narrowed disc space - disc destruction and dissection - later joined by a paravertebral abscess and vertebral lysis, but never by periosteal reaction, TB's tell-tale absence. MRI is the IOC, showing the disc and paradiscal disease in bone and cartilage; CT-guided biopsy remains the gold standard that names the organism. Left to itself, a neglected TB spine fuses into bony ankylosis - elsewhere in the body it fuses fibrously."},{"id":"ORTHO-U18-6","ch":18,"n":6,"title":"Pott's Paraplegia","sec":"Pott's paraplegia · p150","qs":["ORTHO-C18-039","ORTHO-C18-040","ORTHO-C18-041","ORTHO-C18-042","ORTHO-C18-043"],"guide":"Pott's spine tightens its grip on the cord by three routes: granulation tissue pushing, inflammation swelling the cord, and a spinal artery thrombosis that can kill the cord within hours - rapid onset is the worst of the three. Early UMN signs (ankle clonus, exaggerated reflexes, extensor plantar) sound the alarm; bowel and bladder involvement late is the grave prognostic bell."},{"id":"ORTHO-U18-7","ch":18,"n":7,"title":"Prognostic Factors","sec":"Prognostic factors · p150","qs":["ORTHO-C18-044","ORTHO-C18-045","ORTHO-C18-046","ORTHO-C18-047","ORTHO-C18-048","ORTHO-C18-049","ORTHO-C18-050"],"guide":"Prognosis runs on five dials: younger age, slow onset, early onset, short cord involvement (beyond 1 month is bad), and an active wet spine rather than a healed one. Compression by granulation tissue beats compression by bony deformity; the full recipe of older + rapid + late + longer + healed is the formula for despair."},{"id":"ORTHO-U18-8","ch":18,"n":8,"title":"Pott's: Middle Path & Surgery","sec":"Treatment · p150","qs":["ORTHO-C18-051","ORTHO-C18-052","ORTHO-C18-053","ORTHO-C18-054","ORTHO-C18-055","ORTHO-C18-056"],"guide":"The middle path: ATT for 18-24 months, rest and Taylor's brace. Improvement means continue; no improvement, neurological signs, or bowel-bladder sinking means to theatre - left anterolateral decompression, autologous bone grafting and spine stabilisation, with rib, transverse process, pedicle, vertebral body and affected disc all removed from the path of the cord."},{"id":"ORTHO-U18-9","ch":18,"n":9,"title":"TB Spine vs Metastasis","sec":"TB spine vs metastasis · p151","qs":["ORTHO-C18-057","ORTHO-C18-058","ORTHO-C18-059","ORTHO-C18-060"],"guide":"Two lytic spine lesions, one disc as judge: on MRI a bad disc (involved) declares TB spine with good prognosis, a good disc (spared) declares metastasis with bad prognosis. On the plain film metastasis winks - the winking owl sign of a destroyed, absent pedicle."},{"id":"ORTHO-U18-10","ch":18,"n":10,"title":"TB Hip: Focus & Features","sec":"TB Hip · p151","qs":["ORTHO-C18-061","ORTHO-C18-062","ORTHO-C18-063","ORTHO-C18-064"],"guide":"TB hip opens quietly in the acetabulum and in Babcock's triangle, the immunologically weak patch of the femoral neck where monocytes and macrophages are deficient and the bacillus grows easily. The local story is a painful limb with antalgic gait, shortening and deformity."},{"id":"ORTHO-U18-11","ch":18,"n":11,"title":"TB Hip: Five Stages","sec":"Stages · p152","qs":["ORTHO-C18-065","ORTHO-C18-066","ORTHO-C18-067","ORTHO-C18-068","ORTHO-C18-069","ORTHO-C18-070","ORTHO-C18-071","ORTHO-C18-072","ORTHO-C18-073"],"guide":"Five stages from fluid to stone: I - synovitis, apparent lengthening, hip in flexion-abduction-external rotation as the distended capsule seeks ease; II - early arthritis, apparent shortening under 1 cm, hip swung to flexion-adduction-internal rotation; III - true shortening beyond 1 cm with cartilage loss; IV - small destroyed head against a large wandering acetabulum, the pestle and mortar; V - painful, unstable fibrous ankylosis."},{"id":"ORTHO-U18-12","ch":18,"n":12,"title":"TB Hip: Phemister & Treatment","sec":"Investigation & Treatment · p152","qs":["ORTHO-C18-074","ORTHO-C18-075","ORTHO-C18-076","ORTHO-C18-077","ORTHO-C18-078","ORTHO-C18-079","ORTHO-C18-080","ORTHO-C18-081"],"guide":"Phemister's triad writes the X-ray: juxta-articular osteopenia first, peripheral osseous erosions, then narrowing of the joint space. Early treatment is ATT + rest + traction to save the head, with surgical decompression if it fails; late, deformity is corrected - total hip replacement is best (but wait 10-15 years for recurrence risk), Girdlestone excision when THA is contraindicated, or arthrodesis for the fixed hip."},{"id":"ORTHO-U18-13","ch":18,"n":13,"title":"TB Knee","sec":"TB knee · p153","qs":["ORTHO-C18-082","ORTHO-C18-083","ORTHO-C18-084","ORTHO-C18-085","ORTHO-C18-086","ORTHO-C18-087","ORTHO-C18-088"],"guide":"The TB knee rests in 5-30 degrees of flexion - the position of ease for a joint that starts with synovitis and effusion. Late it locks into the PERF triple deformity: posterior subluxation of the knee, external rotation of the tibia, flexion of the knee. MRI (IOC) shows the synovitis, biopsy is gold standard; early ATT + rest + traction, late arthroplasty after 10-15 years or arthrodesis."},{"id":"ORTHO-U18-14","ch":18,"n":14,"title":"Cross-Chapter Notes","sec":"Note · p153","qs":["ORTHO-C18-089","ORTHO-C18-090","ORTHO-C18-091","ORTHO-C18-092","ORTHO-C18-093","ORTHO-C18-094"],"guide":"Margin notes that cross chapters: a non-healing sinus in chronic osteomyelitis means a sequestrum; no periosteal reaction in tubercular osteomyelitis; the spinous process is the vertebral part TB spares; paraplegia strikes the upper thoracic spine where the cord is thickest and easiest to compress. And Charcot's painless joint belongs to syphilis, DM and syringomyelia."}];

function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r==null?null:JSON.parse(r);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
const S = {
  get xp(){return store('pulse_xp')||0;}, set xp(v){store('pulse_xp',v);},
  get done(){return store('pulse_done')||[];}, set done(v){store('pulse_done',v);},
  get unlock(){return !!store('pulse_unlock');}, set unlock(v){store('pulse_unlock',v);},
  streak(){const t=store('pulse_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();
    if(s.day===today)return s.n;
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s={n:(s.day===y?s.n+1:1),day:today};store('pulse_streak',s);return s.n;}
};

  $('brand').textContent = cur==='home'?'PULSE':'PULSE';
  refreshStats();
  if(cur==='home')renderHome();
  if(cur==='chapters')renderChapters();
  if(cur==='path')renderPath();
}
function refreshStats(){
  $('hXP').textContent=S.xp; $('hStreak').textContent=S.streak().n;
  $('sXP').textContent=S.xp; $('sStreak').textContent=S.streak().n; $('sUnits').textContent=S.done.length;
}
function renderHome(){
  const live=CHAPTERS.filter(c=>c.live).length;
  $('heroSub').textContent=live+' of '+CHAPTERS.length+' chapters built so far — original questions, guides, and unit-by-unit mastery for each.';
}
function unitsOf(ch){return UNITS.filter(u=>u.ch===ch).sort((a,b)=>a.n-b.n);}
function renderChapters(){
  $('chSub').textContent=CHAPTERS.length+' chapters · Full chapter-by-chapter exam pass';
  const box=$('chList'); box.innerHTML='';
  CHAPTERS.forEach(c=>{
    const us=c.live?unitsOf(c.n):[];
    const dn=us.filter(u=>S.done.includes(u.id)).length;
    const d=document.createElement('div');
    d.className='chrow'+(c.live?'':' locked');
    d.innerHTML='<div class="chnum">'+c.n+'</div><div class="t">'+escapeHtml(c.t)+'</div><div class="u">'+(c.live?dn+'/'+us.length+' units':'Soon')+'</div>';
    if(c.live)d.onclick=()=>{curCh=c.n;show('path');};
    box.appendChild(d);
  });
}
let curCh=1, curUnit=null;
function unitState(u,us){
  if(S.done.includes(u.id))return 'done';
  if(S.unlock)return 'current';
  const i=us.findIndex(x=>x.id===u.id);
  if(i===0)return 'current';
  return S.done.includes(us[i-1].id)?'current':'locked';
}
function renderPath(){
  const c=CHAPTERS.find(x=>x.n===curCh), us=unitsOf(curCh);
  $('pathKick').textContent='CHAPTER '+c.n;
  $('pathTitle').textContent=c.t;
  $('pathSub').textContent=us.filter(u=>S.done.includes(u.id)).length+' of '+us.length+' units done · in book order';
  const box=$('nodes'); box.innerHTML='';
  let lastSec='';
  us.forEach(u=>{
    if(u.sec!==lastSec){lastSec=u.sec;
      const s=document.createElement('div');s.className='pathsec';s.textContent=u.sec;box.appendChild(s);}
    const st=unitState(u,us);
    const d=document.createElement('div');d.className='node';
    d.innerHTML='<div class="ball '+st+'">'+(st==='done'?'✓':st==='locked'?'🔒':u.n)+'</div><div class="ntitle">'+escapeHtml(u.title)+'</div><div class="ncount">'+u.qs.length+' questions</div>';
    if(st!=='locked')d.querySelector('.ball').onclick=()=>openGuide(u);
    box.appendChild(d);
  });
}
function openGuide(u){curUnit=u;
  $('gKick').textContent='CHAPTER '+u.ch+' · UNIT '+u.n+' · '+u.sec.toUpperCase();
  $('gTitle').textContent=u.title;
  $('gText').textContent=u.guide;
  $('gCount').textContent=u.qs.length+' questions · follows the book line-by-line';
  show('guide');
}
let order=[],idx=0,xpGain=0,streak=0,correct=0,wrongList=[],locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function beginUnit(){
  // FIXED book order — only options shuffle (anti-bias)
  order=curUnit.qs.map(id=>{const q=QBYID[id];return {q,opts:shuffle(q.opts.map((t,i)=>({t,ok:i===q.ans})))};});
  idx=0;xpGain=0;streak=0;correct=0;wrongList=[];
  show('quiz');renderQ();
}
function renderQ(){
  locked=false;
  const cur=order[idx],q=cur.q;
  $('qbar').style.width=(idx/order.length*100)+'%';
  $('qcount').textContent='QUESTION '+(idx+1)+' OF '+order.length;
  $('qtag').textContent=q.sec+' · Book p'+q.page;
  $('qtext').textContent=q.q;
  const box=$('opts');box.innerHTML='';
  cur.opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>answer(o,b);box.appendChild(b);
  });
  $('fb').className='fb';$('fb').innerHTML='';
  $('nextBtn').classList.add('hidden');
  $('nextBtn').textContent=idx===order.length-1?'Finish ✓':'Continue →';
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function answer(o,btn){
  if(locked)return;locked=true;
  const cur=order[idx],q=cur.q,btns=$('opts').children;
  const rightIdx=cur.opts.findIndex(x=>x.ok);
  [...btns].forEach(b=>b.disabled=true);
  btns[rightIdx].classList.add('correct');
  const fb=$('fb');
  if(o.ok){correct++;streak++;
    const gain=10+Math.min(streak*2,10);xpGain+=gain;S.xp=S.xp+gain;
    floatText(btn,'+'+gain+' XP','#e0607e');
    fb.className='fb show good';
    fb.innerHTML='✅ Correct! '+escapeHtml(q.exp);
  }else{btn.classList.add('wrong');streak=0;
    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
</script>
</body>
</html>
