074","sec":"Types of sequestrum","page":141,"q":"Ivory sequestrum is classically associated with:","opts":["Syphilis","Viral osteomyelitis","Amputation stump","Perthe's"],"ans":0,"exp":"Ivory → syphilis. (Book p141)"},{"id":"ORTHO-C17-075","sec":"Chronic OM workup","page":141,"q":"X-ray in chronic osteomyelitis shows:","opts":["Sequestrum, involucrum, cloaca","Only soft tissue swelling","Widening of joint space","Normal bone always"],"ans":0,"exp":"Radiology - X-ray: sequestrum, involucrum, cloaca. (Book p141)"},{"id":"ORTHO-C17-076","sec":"Chronic OM workup","page":141,"q":"Sinogram in chronic osteomyelitis is done by:","opts":["Dye injected through sinus - anatomy of sinus tract seen - plan Rx","MRI of sinus","CT fistulography with air","Ultrasound of tract"],"ans":0,"exp":"Sinogram: dye injected through sinus → anatomy of sinus tract seen → plan Rx. (Book p141)"},{"id":"ORTHO-C17-077","sec":"Chronic OM workup","page":141,"q":"Gold standard investigation in chronic osteomyelitis:","opts":["Biopsy","Sinogram","ESR","Bone scan"],"ans":0,"exp":"Biopsy: gold standard. (Book p141)"},{"id":"ORTHO-C17-078","sec":"Chronic OM workup","page":141,"q":"Initial treatment of chronic osteomyelitis:","opts":["Broad spectrum antibiotics + supportive treatment","Immediate sequestrectomy without cover","Amputation","Observation only"],"ans":0,"exp":"Initial: broad spectrum antibiotics, supportive treatment. (Book p141)"},{"id":"ORTHO-C17-079","sec":"Chronic OM surgery","page":142,"q":"Definitive treatment of chronic osteomyelitis:","opts":["Surgery","Lifelong antibiotics","Radiotherapy","Analgesics only"],"ans":0,"exp":"Definitive: surgery. (Book p142)"},{"id":"ORTHO-C17-080","sec":"Chronic OM surgery","page":142,"q":"Surgery for chronic osteomyelitis is done under:","opts":["Antibiotic cover","General anesthesia without antibiotics","Tourniquet only","Steroid cover"],"ans":0,"exp":"Sequence: antibiotic cover → sequestrectomy. (Book p142)"},{"id":"ORTHO-C17-081","sec":"Chronic OM surgery","page":142,"q":"Sequestrectomy means:","opts":["Removal of sequestrum","Removal of involucrum","Curettage of pus","Skin grafting"],"ans":0,"exp":"Sequestrectomy: removal of sequestrum. (Book p142)"},{"id":"ORTHO-C17-082","sec":"Chronic OM surgery","page":142,"q":"Curettage in chronic osteomyelitis surgery is done till:","opts":["Fresh bleed seen - Paprika sign","All bone removed","Cortex breached completely","Fat is seen"],"ans":0,"exp":"Curettage: till fresh bleed seen - Paprika sign. (Book p142)"},{"id":"ORTHO-C17-083","sec":"Chronic OM surgery","page":142,"q":"Debridement of chronic osteomyelitis cavity by making a wide mouth cavity is called:","opts":["Saucerization","Paprika sign","Sinogram","Arthrodesis"],"ans":0,"exp":"Debridement: saucerization (wide mouth cavity made). (Book p142)"},{"id":"ORTHO-C17-084","sec":"Chronic OM surgery","page":142,"q":"Dead space after debridement is closed with:","opts":["Bone graft and bone cement","Gauze packing permanently","Muscle only","Nothing - left open always"],"ans":0,"exp":"Closure of dead space with: bone graft, bone cement. (Book p142)"},{"id":"ORTHO-C17-085","sec":"Chronic OM surgery","page":142,"q":"Skin covering after chronic osteomyelitis surgery:","opts":["Skin flap, muscle flap or VAC","Primary closure always","Split skin always heals","Amputation"],"ans":0,"exp":"Skin covering with: skin flap, muscle flap, vacuum assisted covering (VAC). (Book p142)"},{"id":"ORTHO-C17-086","sec":"Chronic OM surgery","page":142,"q":"Pressure used in vacuum assisted closure (VAC)/negative pressure wound therapy:","opts":["-75 to -125 mmHg","+100 mmHg","-10 mmHg","0 mmHg (atmospheric)"],"ans":0,"exp":"VAC: -75 to -125 mmHg; promotes granulation tissue formation. (Book p142)"},{"id":"ORTHO-C17-087","sec":"Chronic OM surgery","page":142,"q":"Vacuum assisted covering promotes:","opts":["Granulation tissue formation","Epithelial atypia","Bone resorption","Necrosis"],"ans":0,"exp":"VAC promotes granulation tissue formation; C/  p143)"},{"id":"ORTHO-C17-094","sec":"Brodie's abscess","page":143,"q":"Most common site of Brodie's abscess:","opts":["Tibia (proximal end)","Mandible","Femoral head","Vertebra"],"ans":0,"exp":"Brodie's: m/c site tibia (proximal end). (Book p143)"},{"id":"ORTHO-C17-095","sec":"Brodie's abscess","page":143,"q":"Presence of pus in Brodie's abscess:","opts":["Present (+)","Absent (-)","Sterile fluid only","Blood filled"],"ans":0,"exp":"Brodie's abscess: pus + (vs Garré's: pus -). (Book p143)"},{"id":"ORTHO-C17-096","sec":"Brodie's abscess","page":143,"q":"Clinical features of Brodie's abscess:","opts":["Acute dull aching pain + low grade fever","Bony swelling without pain","Sinus discharge","Complete asymptomatic"],"ans":0,"exp":"Clinical: acute dull aching pain, low grade fever; elevated ESR & CRP (+). (Book p143)"},{"id":"ORTHO-C17-097","sec":"Brodie's abscess","page":143,"q":"X-ray of Brodie's abscess shows:","opts":["Thick sclerotic rim with central lucency","Thick dense homogeneous bone","Onion peel reaction","Soap bubble lesion"],"ans":0,"exp":"X-ray: thick sclerotic rim + central lucency. (Book p143)"},{"id":"ORTHO-C17-098","sec":"Brodie's abscess","page":143,"q":"Penumbra sign on MRI - central lucency surrounded by dense sclerotic rim - is seen in:","opts":["Brodie's abscess","Garré's sclerosing osteomyelitis","Ewing sarcoma","Osteoid osteoma"],"ans":0,"exp":"MRI: penumbra sign - central lucency surrounded by dense sclerotic rim (Brodie's). (Book p143)"},{"id":"ORTHO-C17-099","sec":"Brodie's abscess","page":143,"q":"Treatment of Brodie's abscess:","opts":["Antibiotics ± debridement","Wide excision with prosthesis","Amputation","Radiotherapy"],"ans":0,"exp":"Rx: antibiotics ± debridement. (Book p143)"},{"id":"ORTHO-C17-100","sec":"Garre's OM","page":143,"q":"Course of Garré's sclerosing osteomyelitis:","opts":["Chronic","Subacute","Acute","Fulminant"],"ans":0,"exp":"Garré's sclerosing osteomyelitis: chronic course. (Book p143)"},{"id":"ORTHO-C17-101","sec":"Garre's OM","page":143,"q":"Most common site of Garré's sclerosing osteomyelitis:","opts":["Mandible > tibia","Tibia > femur","Spine","Calcaneum"],"ans":0,"exp":"Garré's: mandible > tibia. (Book p143)"},{"id":"ORTHO-C17-102","sec":"Garre's OM","page":143,"q":"Pus in Garré's sclerosing osteomyelitis:","opts":["Absent (-)","Present (+)","Copious","Serosanguinous"],"ans":0,"exp":"Garré's: pus -; clinical feature: bony swelling; ESR & CRP not elevated (-). (Book p143)"},{"id":"ORTHO-C17-103","sec":"Garre's OM","page":143,"q":"X-ray in Garré's sclerosing osteomyelitis shows:","opts":["Thick dense bone due to excessive periosteal reaction","Central lucency with sclerotic rim","Sequestrum with cloaca","Normal X-ray"],"ans":0,"exp":"X-ray: thick dense bone (d/t excessive periosteal reaction). (Book p143)"},{"id":"ORTHO-C17-104","sec":"Garre's OM","page":143,"q":"Treatment of Garré's sclerosing osteomyelitis:","opts":["Antibiotics","Debridement and saucerization","Amputation","VAC therapy"],"ans":0,"exp":"Rx: antibiotics. (Book p143)"},{"id":"ORTHO-C17-105","sec":"Septic arthritis","page":144,"q":"Septic arthritis is a surgical emergency because:","opts":["If pus is not removed from joint immediately - destruction of joint","It always causes septicemia within hours","It spreads to brain","Pain is uncontrollable"],"ans":0,"exp":"Surgical emergency: if pus not removed from joint immediately → destruction of joint. (Book p144)"},{"id":"ORTHO-C17-106","sec":"Septic arthritis","page":144,"q":"Septic arthritis is most common in:","opts":["Children (<5 years) > elderly people","Young adults","Teenagers","Middle aged males"],"ans":0,"exp":"Children (<5 years) > elderly people (relatively low immunity). (Book p144)"},{"id":"ORTHO-C17-107","sec":"Septic arthritis","page":144,"q":"Most common route of septic arthritis:","opts":["Hematogenous","Direct inoculation","Post-surgical","Contiguous spread"],"ans":0,"exp":"Route: m/c hematogenous. (Book p144)"},{"id":"ORTHO-C17-108","sec":"Septic  in septic arthritis shows:","opts":["Synovial thickening","Joint mice","Plicae","Meniscal tear"],"ans":0,"exp":"MRI: synovial thickening. (Book p144)"},{"id":"ORTHO-C17-122","sec":"Septic arthritis Ix","page":144,"q":"USG-guided arthrocentesis in septic arthritis is:","opts":["Diagnostic & therapeutic","Only diagnostic","Only therapeutic","Contraindicated"],"ans":0,"exp":"USG guided arthrocentesis: diagnostic & therapeutic. (Book p144)"},{"id":"ORTHO-C17-123","sec":"Septic arthritis Rx","page":145,"q":"Treatment of choice of septic arthritis:","opts":["Arthrotomy - irrigation & debridement of septic joint contents under antibiotic cover","Aspiration alone always","Long splinting for months","Intra-articular steroids"],"ans":0,"exp":"Arthrotomy (TOC): irrigation & debridement of septic joint contents under antibiotic cover. (Book p145)"},{"id":"ORTHO-C17-124","sec":"Septic arthritis Rx","page":145,"q":"End sequelae of neglected septic arthritis:","opts":["Bony ankylosis","Fibrous ankylosis only","Normal joint","Charcot joint"],"ans":0,"exp":"Complication: bony ankylosis - end sequelae of neglected septic arthritis. (Book p145)"},{"id":"ORTHO-C17-125","sec":"Septic arthritis Rx","page":145,"q":"Organisms in septic arthritis release which proteolytic enzymes?","opts":["Collagenases, metalloproteinases, elastases","Lipases and amylase","Urease","Coagulase only"],"ans":0,"exp":"Organisms release proteolytic enzymes: collagenases, metalloproteinases, elastases. (Book p145)"},{"id":"ORTHO-C17-126","sec":"Septic arthritis Rx","page":145,"q":"Sequence leading to bony ankylosis in septic arthritis:","opts":["Enzymes destroy articular cartilage - raw ends of bone exposed - heal with fusion","Cartilage regenerates then calcifies","Synovium ossifies directly","Periosteum wraps the joint"],"ans":0,"exp":"Destroy articular cartilage → raw ends of bone exposed → heal with fusion → bony ankylosis. (Book p145)"},{"id":"ORTHO-C17-127","sec":"Ankylosis","page":145,"q":"Fusion of bone  (Book p146)"},{"id":"ORTHO-C17-139","sec":"Transient synovitis","page":146,"q":"Clinical features of transient synovitis:","opts":["Pain, limp, mild fever, position of ease","High grade fever with rigors","Purulent discharge","Complete inability to move limb always"],"ans":0,"exp":"Clinical: pain, limp, mild fever, position of ease. (Book p146)"},{"id":"ORTHO-C17-140","sec":"Transient synovitis","page":146,"q":"Best investigation to differentiate transient synovitis from septic arthritis:","opts":["Aspiration of joint","X-ray pelvis","MRI hip","Bone scan"],"ans":0,"exp":"Aspiration of joint: best investigation to differentiate from septic arthritis; blood: ESR, CRP, TLC. (Book p146)"},{"id":"ORTHO-C17-141","sec":"Transient synovitis","page":146,"q":"Treatment of transient synovitis:","opts":["Observation - hence also called observation hip","Arthrotomy","Chemotherapy","Steroid injections"],"ans":0,"exp":"Treatment: observation (transient synovitis also called observation hip). (Book p146)"},{"id":"ORTHO-C17-142","sec":"Kocher criteria","page":146,"q":"Kocher's criteria are used to:","opts":["Differentiate between transient synovitis & septic arthritis","Grade DDH","Stage Perthe's disease","Diagnose TB hip"],"ans":0,"exp":"Kocher's criteria: to differentiate between transient synovitis & septic arthritis. (Book p146)"},{"id":"ORTHO-C17-143","sec":"Kocher criteria","page":146,"q":"Kocher's criteria include all except:","opts":["Morning stiffness >30 minutes","Difficulty in weight bearing/unable to walk","Temperature >38.5°C (101.3°F)","ESR >40 mm/hr and WBC >12,000 cells/mm³"],"ans":0,"exp":"Kocher's: difficulty weight bearing/unable to walk, temp >38.5°C (101.3°F), ESR >40 mm/hr, WBC >12,000 cells/mm³ - each has 1 point. (Book p146)"},{"id":"ORTHO-C17-144","sec":"Kocher criteria","page":146,"q":"Interpretation of Kocher's criteria:","opts":["Each criterion has 1 point - more points → more chance of septic arthritis","Each has 2 points - fewer points → septic arthritis","Only total 4 means transient synovitis","Score has no significance"],"ans":0,"exp":"Each criterion has 1 point; increased point → increased chance of septic arthritis. (Book p146)"},{"id":"ORTHO-C17-145","sec":"Limp in child","page":146,"q":"Most common cause of limp in a child:","opts":["Transient synovitis > septic arthritis > Perthe's disease","Perthe's disease > septic arthritis","Septic arthritis only","DDH"],"ans":0,"exp":"Cause of limp in child: transient synovitis (m/c) > septic arthritis > Perthe's disease. (Book p146)"},{"id":"ORTHO-C17-146","sec":"Hand infections","page":146,"q":"Paronychia is also known as:","opts":["Running around the nail","Whitlow","Kanavel infection","Collar stud abscess"],"ans":0,"exp":"Paronychia (running around the nail): m/c infection of hand. (Book p146)"},{"id":"ORTHO-C17-147","sec":"Hand infections","page":146,"q":"Most common infection of the hand:","opts":["Paronychia","Felon","Tenosynovitis","Deep palmar abscess"],"ans":0,"exp":"Paronychia: m/c infection of hand; infection around the nail and nail bed. (Book p146)"},{"id":"ORTHO-C17-148","sec":"Hand infections","page":146,"q":"Most common organism of paronychia:","opts":["Staphylococcus aureus","Candida","Eikenella","Pseudomonas"],"ans":0,"exp":"m/c organism: Staphylococcus aureus. (Book p146)"},{"id":"ORTHO-C17-149","sec":"Hand infections","page":147,"q":"Treatment of paronychia:","opts":["Antibiotics + drainage of abscess + removal of part of nail (if infection reaches nail bed)","Antibiotics alone always","Amputation of digit","Steroid cream"],"ans":0,"exp":"Treatment: antibiotics + drainage of abscess + removal of part of nail (if infection reaches nail bed). (Book p147)"},{"id":"ORTHO-C17-150","sec":"Felon","page":147,"q":"Felon/whitlow is infection of:","opts":["Subcutaneous tissue (pulp) of the finger - distal phalanx","Nail fold","Tendon sheath","Midpalmar space"],"ans":0,"exp":"Felon/whitlow: infection of subcutaneous tissue (pulp) of the finger (distal phalanx). (Book p147)"},{"id":"ORTHO-C17-151","sec":"Felon","page":147,"q":"Most common finger affected in felon:","opts":["Thumb (m/c) > index finger","Little finger","Middle finger","Ring finger"],"ans":0,"exp":"Finger affected: thumb (m/c) > index finger; m/c organism: Staphylococcus aureus. (Book p147)"},{"id":"ORTHO-C17-152","sec":"Felon","page":147,"q":"Complications of felon:","opts":["Osteomyelitis of phalanx and tenosynovitis","Malignant melanoma","Trigger finger","Mallet finger"],"ans":0,"exp":"Complications: osteomyelitis of phalanx, tenosynovitis. (Book p147)"},{"id":"ORTHO-C17-153","sec":"Felon","page":147,"q":"Incision used in felon drainage:","opts":["Vertical incision - to break adhesions/septae that hide infection","Transverse incision across pulp","Lateral incision only","No incision needed"],"ans":0,"exp":"Treatment: antibiotics + incision (vertical incision to break adhesions/septae that hide infection) & drainage. (Book p147)"},{"id":"ORTHO-C17-154","sec":"Tenosynovitis","page":147,"q":"Tenosynovitis is infection of:","opts":["Tendon/tendon sheath","Pulp space","Nail bed","Thenar space"],"ans":0,"exp":"Tenosynovitis: infection of tendon/tendon sheath; m/c organism: Staphylococcus aureus. (Book p147)"},{"id":"ORTHO-C17-155","sec":"Tenosynovitis","page":147,"q":"Symptoms of tenosynovitis include:","opts":["Fever, flexion attitude, fusiform swelling of fingers, pain on passive extension","Hyperextension attitude","Nodular cord in palm","Absent pulses"],"ans":0,"exp":"Symptoms: fever, flexion attitude, fusiform swelling of fingers, pain on passive extension. (Book p147)"},{"id":"ORTHO-C17-156","sec":"Tenosynovitis","page":147,"q":"Kanavel sign is:","opts":["Pain on tapping the affected tendon (+ve in tenosynovitis)","Pain on wrist extension","Tenderness over anatomical snuffbox","Pain on supination"],"ans":0,"exp":"Signs: Kanavel sign +ve - pain on tapping affected tendon. (Book p147)"},{"id":"ORTHO-C17-157","sec":"Tenosynovitis","page":147,"q":"Treatment of tenosynovitis:","opts":["Antibiotics + incision & drainage","Only splinting","Steroid injection","Tendon transfer"],"ans":0,"exp":"Treatment: antibiotics + incision & drainage. (Book p147)"},{"id":"ORTHO-C18-001","sec":"Introduction","page":148,"q":"Tuberculosis of bone and joints is also known as:","opts":["Caries / Koch's disease","Gouty arthropathy","Pyemic infection","Charcot's joint"],"ans":0,"exp":"TB of bone and joints is also known as caries / Koch's disease. (Book p148)"},{"id":"ORTHO-C18-002","sec":"Introduction","page":148,"q":"Compared with pyogenic bone infections, TB of bone and joints has:","opts":["More severe local manifestation","Less severe local manifestation","Identical local inflammation","No systemic features"],"ans":1,"exp":"TB of bone and joints has less severe local manifestation compared to pyogenic bacteria. (Book p148)"},{"id":"ORTHO-C18-003","sec":"Introduction","page":148,"q":"TB of bone is characteristically a:","opts":["Multibacillary infection","Paucibacillary infection by Koch's weak bacillus","Gram-negative infection","Viral infection"],"ans":1,"exp":"It is a paucibacillary infection by Koch's weak bacillus (Mycobacterium tuberculosis). (Book p148)"},{"id":"ORTHO-C18-004","sec":"Introduction","page":148,"q":"The usual route of spread of TB to bone and joints is:","opts":["Direct extension","Lymphatic only","Hematogenous (from a primary source)","Inoculation"],"ans":2,"exp":"Route: hematogenous (from a primary source). (Book p148)"},{"id":"ORTHO-C18-005","sec":"Introduction","page":148,"q":"The most common site of TB in the body is the:","opts":["Lung","Bone","Joint","Kidney"],"ans":0,"exp":"Most common site in the body: lung. (Book p148)"},{"id":"ORTHO-C18-006","sec":"Introduction","page":148,"q":"In the musculoskeletal system, the order of most common sites of TB is:","opts":["Knee > hip > spine","Spine (TB spondylitis) > hip > knee","Hip > spine > knee","Shoulder > hip > knee"],"ans":1,"exp":"In musculoskeletal system: spine (TB spondylitis) > hip > knee. (Book p148)"},{"id":"ORTHO-C18-007","sec":"Introduction","page":148,"q":"In TB of the spine, the regional order of involvement is:","opts":["Lumbar > dorsal > dorso-lumbar","Dorso-lumbar > dorsal > lumbar","Dorsal > lumbar > cervical","Cervical > dorsal > lumbar"],"ans":1,"exp":"In spine: dorso-lumbar > dorsal > lumbar. (Book p148)"},{"id":"ORTHO-C18-008","sec":"Introduction","page":148,"q":"In children, the commonest spinal region for TB is the:","opts":["Lumbar spine","Dorso-lumbar spine","Cervical spine","Sacrum"],"ans":2,"exp":"In children: cervical spine. (Book p148)"},{"id":"ORTHO-C18-009","sec":"Introduction","page":148,"q":"Caries sicca refers to:","opts":["TB shoulder","TB fingers","TB knee","TB hip"],"ans":0,"exp":"Variant: caries sicca = TB shoulder. (Book p148)"},{"id":"ORTHO-C18-010","sec":"Introduction","page":148,"q":"Caries sicca (TB shoulder) is a:","opts":["Wet exudative TB","Dry / non-exudative TB","Pyogenic TB","Acute suppurative TB"],"ans":1,"exp":"Caries sicca is a dry / non-exudative TB. (Book p148)"},{"id":"ORTHO-C18-011","sec":"Introduction","page":148,"q":"Spina ventosa is TB of the:","opts":["Shoulder","Fingers","Knee","Spine"],"ans":1,"exp":"Variant: spina ventosa = TB fingers. (Book p148)"},{"id":"ORTHO-C18-012","sec":"Introduction","page":148,"q":"The 'filling up of air' like appearance of the fingers on X-ray is the variant known as:","opts":["Caries sicca","Spina ventosa","Brodie's abscess","Gibbus"],"ans":1,"exp":"Spina ventosa (TB fingers) shows a 'filling up of air' like appearance. (Book p148)"},{"id":"ORTHO-C18-013","sec":"TB Spine Types","page":148,"q":"The most common type of TB spine (TB spondylitis / Pott's spine) is:","opts":["Paradiscal","Central","Anterior","Posterior"],"ans":0,"exp":"Types: paradiscal (m/c), central, anterior / wet / exudative (in children), posterior (rarest). (Book p148)"},{"id":"ORTHO-C18-014","sec":"TB Spine Types","page":148,"q":"The rarest type of TB spine is:","opts":["Paradiscal","Central","Anterior","Posterior"],"ans":3,"exp":"Posterior is the rarest type of TB spine. (Book p148)"},{"id":"ORTHO-C18-015","sec":"TB Spine Types","page":148,"q":"The 'anterior / wet / exudative' type of TB spine is seen in:","opts":["Adults","Children","Elderly only","Immunosuppressed only"],"ans":1,"exp":"Anterior / wet / exudative type occurs in children. (Book p148)"},{"id":"ORTHO-C18-016","sec":"TB Spine Types","page":148,"q":"In the central type of TB spine, the primary lesion is in the:","opts":["Spinous process","Central vertebral body","Anterior longitudinal ligament","Posterior spinal arch"],"ans":1,"exp":"The central type involves the central vertebral body. (Book p148)"},{"id":"ORTHO-C18-017","sec":"TB Spine Types","page":148,"q":"The paradiscal type of TB spine involves:","opts":["The spinous process only","The para-vertebral area (bone) and the intervertebral disc","The posterior spinal elements","The laminae"],"ans":1,"exp":"Paradiscal: para-vertebral area (bone) and intervertebral disc are involved. (Book p148)"},{"id":"ORTHO-C18-018","sec":"Paradiscal","page":149,"q":"In paradiscal TB spine, how many vertebrae are typically involved?","opts":["One","Two","Three","Four"],"ans":2,"exp":"Paradiscal: 3 vertebrae involved. (Book p149)"},{"id":"ORTHO-C18-019","sec":"Paradiscal","page":149,"q":"Paradiscal TB spine characteristically involves:","opts":["Upper half of upper vertebra + disc + lower half of lower vertebra","Lower half of upper vertebra + disc + upper half of lower vertebra","Two adjacent vertebral bodies only","The whole vertebrae"],"ans":1,"exp":"Lower half of upper vertebra + disc + upper half of lower vertebra. (Book p149)"},{"id":"ORTHO-C18-020","sec":"Paradiscal","page":149,"q":"Three vertebrae are involved in paradiscal TB because they:","opts":["Are innervated by a single nerve","Develop from a common somite / sclerotome, giving a common blood supply","Have no blood supply","Are the largest bones of the spine"],"ans":1,"exp":"d/t development from common somite / sclerotome -> common blood supply. (Book p149)"},{"id":"ORTHO-C18-021","sec":"Paradiscal","page":149,"q":"In TB spine, the lesion lies in relation to the spinal cord:","opts":["Posterior to it","Anterior to it","Within the cord","Lateral to the conus"],"ans":1,"exp":"The paradiscal lesion is anterior to the spinal cord. (Book p149)"},{"id":"ORTHO-C18-022","sec":"Paradiscal","page":149,"q":"As per the vertebral anatomy diagram, the spinal nerve exits through the:","opts":["Spinous process","Intervertebral foramen","Lamina","Pedicle only"],"ans":1,"exp":"The spinal nerve exits through the intervertebral foramen. (Book p149)"},{"id":"ORTHO-C18-023","sec":"Clinical features","page":149,"q":"Which of the following is NOT a constitutional feature of TB spine?","opts":["Low grade fever","Malaise","Night pains","High spiking fever"],"ans":3,"exp":"Constitutional features: low grade fever, malaise, night pains, evening rise of temperature. (Book p149)"},{"id":"ORTHO-C18-024","sec":"Clinical features","page":149,"q":"The earliest SYMPTOM of TB spine is:","opts":["Back pain","Paraspinal spasm","Cold abscess","Gibbus deformity"],"ans":0,"exp":"Back pain is the earliest symptom; paraspinal spasm / tenderness is the earliest sign. (Book p149)"},{"id":"ORTHO-C18-025","sec":"Clinical features","page":149,"q":"The earliest SIGN of TB spine is:","opts":["Back pain","Paraspinal spasm / tenderness","Deformity","Neurological deficit"],"ans":1,"exp":"Paraspinal spasm / tenderness is the earliest sign. (Book p149)"},{"id":"ORTHO-C18-026","sec":"Clinical features","page":149,"q":"Paraspinal spasm in TB spine produces the characteristic:","opts":["Sway back","Military attitude and cautious gait","Scissoring gait","Antalgic lurch"],"ans":1,"exp":"Paraspinal spasm / tenderness -> military attitude with cautious gait. (Book p149)"},{"id":"ORTHO-C18-027","sec":"Clinical features","page":149,"q":"The 'knuckle' sign in TB spine is:","opts":["Prominence of 1 spinous process","Prominence of 2-3 spinous processes","Prominence of >3 spinous processes","Tenderness over the ribs"],"ans":0,"exp":"Knuckle: prominence of 1 spinous process. (Book p149)"},{"id":"ORTHO-C18-028","sec":"Clinical features","page":149,"q":"'Gibbus' in TB spine denotes prominence of:","opts":["1 spinous process","2-3 spinous processes",">3 spinous processes","The pelvis"],"ans":1,"exp":"Gibbus: prominence of 2-3 spinous processes. (Book p149)"},{"id":"ORTHO-C18-029","sec":"Clinical features","page":149,"q":"Angular kyphosis in TB spine is defined as prominence of:","opts":["1 spinous process","2 spinous processes","3 spinous processes",">3 spinous processes"],"ans":3,"exp":"Angular kyphosis: prominence of >3 spinous processes. (Book p149)"},{"id":"ORTHO-C18-030","sec":"Clinical features","page":149,"q":"The abscess characteristically seen in TB spine is a:","opts":["Hot abscess","Cold abscess","Pyogenic abscess","Pseudo abscess"],"ans":1,"exp":"Cold abscess is a local finding in TB spine. (Book p149)"},{"id":"ORTHO-C18-031","sec":"Clinical features","page":149,"q":"Deformity in TB spine results from:","opts":["Joint dislocation","Vertebral collapse","Muscle atrophy","Ligamentous laxity"],"ans":1,"exp":"Deformity d/t vertebral collapse. (Book p149)"},{"id":"ORTHO-C18-032","sec":"Investigation","page":149,"q":"The earliest X-ray finding in TB spine is:","opts":["Vertebral lysis","Disc space narrowing (d/t destruction / dissection of disc)","Paravertebral abscess","Bony ankylosis"],"ans":1,"exp":"Disc space narrowing (d/t destruction / dissection of disc): earliest on X-ray. (Book p149)"},{"id":"ORTHO-C18-033","sec":"Investigation","page":149,"q":"Which of the following is NOT seen on X-ray in TB spine?","opts":["Disc space narrowing","Paravertebral abscess","Vertebral lysis","Periosteal reaction"],"ans":3,"exp":"X-ray: disc space narrowing, para-vertebral abscess, vertebral lysis. Periosteal reaction is not seen in tubercular osteomyelitis. (Book p149)"},{"id":"ORTHO-C18-034","sec":"Investigation","page":149,"q":"The investigation of choice (IOC) for TB spine is:","opts":["X-ray","MRI","CT guided biopsy","Bone scan"],"ans":1,"exp":"MRI: IOC - shows disc involvement and paradiscal disease involving bone and cartilage. (Book p149)"},{"id":"ORTHO-C18-035","sec":"Investigation","page":149,"q":"MRI in TB spine demonstrates:","opts":["Disc involvement and paradiscal disease involving bone and cartilage","Pedicle destruction only","Joint effusion only","Soft tissue calcification"],"ans":0,"exp":"MRI: disc involved + paradiscal disease involving bone and cartilage. (Book p149)"},{"id":"ORTHO-C18-036","sec":"Investigation","page":149,"q":"The gold standard for diagnosis of TB spine is:","opts":["MRI","X-ray","CT guided biopsy","Blood culture"],"ans":2,"exp":"CT guided biopsy: gold standard - organism identified from tissue. (Book p149)"},{"id":"ORTHO-C18-037","sec":"Complications","page":149,"q":"Neglected TB spine leads to:","opts":["Fibrous ankylosis","Bony ankylosis","Arthrogryposis","Pseudoarthrosis"],"ans":1,"exp":"Neglected TB spine -> bony ankylosis. (Book p149)"},{"id":"ORTHO-C18-038","sec":"Complications","page":149,"q":"When TB is anywhere else (other sites), the resulting ankylosis is typically:","opts":["Bony","Fibrous","Cartilaginous","Synovial"],"ans":1,"exp":"Note: TB anywhere else -> fibrous ankylosis. (Book p149)"},{"id":"ORTHO-C18-039","sec":"Pott's paraplegia","page":150,"q":"Pott's paraplegia results when:","opts":["TB hip extends to the cord","TB spine (Pott's spine) compresses the spinal cord, causing neurological manifestations","A spinal artery embolus occurs","An epidural hematoma forms"],"ans":1,"exp":"TB spine (Pott's spine) -> compresses on spinal cord -> neurological manifestations. (Book p150)"},{"id":"ORTHO-C18-040","sec":"Pott's paraplegia","page":150,"q":"All of the following are causes of Pott's paraplegia EXCEPT:","opts":["Mechanical compression by granulation tissue","Cord edema d/t inflammation","Thrombosis of spinal artery with ischaemia","A direct pyogenic abscess"],"ans":3,"exp":"Causes: 1. mechanical (d/t granulation tissue), 2. cord edema (d/t inflammation), 3. thrombosis of spinal artery -> ischaemia. (Book p150)"},{"id":"ORTHO-C18-041","sec":"Pott's paraplegia","page":150,"q":"Rapid-onset paraplegia with poor prognosis in Pott's disease is due to:","opts":["Granulation tissue","Cord edema","Thrombosis of the spinal artery causing ischaemia of the spinal cord","Disc herniation"],"ans":2,"exp":"Thrombosis of spinal artery -> ischaemia of spinal cord -> rapid onset paraplegia (poor prognosis). (Book p150)"},{"id":"ORTHO-C18-042","sec":"Pott's paraplegia","page":150,"q":"The early neurological manifestations of Pott's paraplegia are UMN findings, e.g.:","opts":["Ankle clonus, exaggerated deep tendon reflexes, extensor plantar","Areflexia with flaccidity","Peripheral nerve palsy","Muscle fasciculations"],"ans":0,"exp":"Early neurological manifestations (UMN findings): ankle clonus / exaggerated deep tendon reflexes, extensor plantar. (Book p150)"},{"id":"ORTHO-C18-043","sec":"Pott's paraplegia","page":150,"q":"The LATE feature of Pott's paraplegia that marks a poor prognosis is:","opts":["Ankle clonus","Bowel and bladder involvement","Back pain","Gibbus deformity"],"ans":1,"exp":"Late: bowel and bladder involvement -> poor prognosis. (Book p150)"},{"id":"ORTHO-C18-044","sec":"Prognostic factors","page":150,"q":"Which age carries a BETTER prognosis in Pott's paraplegia?","opts":["Older","Younger","No age difference","Elderly only"],"ans":1,"exp":"Prognostic factors: younger age -> better prognosis; older -> bad. (Book p150)"},{"id":"ORTHO-C18-045","sec":"Prognostic factors","page":150,"q":"The speed of onset predicting a BETTER prognosis in Pott's paraplegia is:","opts":["Rapid","Slow","Irrelevant","Always sudden"],"ans":1,"exp":"Speed of onset: slow -> better prognosis; rapid -> bad. (Book p150)"},{"id":"ORTHO-C18-046","sec":"Prognostic factors","page":150,"q":"A BETTER prognosis in Pott's paraplegia is associated with an onset that is:","opts":["Early","Late","At any time","Only after 1 month"],"ans":0,"exp":"Onset: early -> better prognosis; late -> bad. (Book p150)"},{"id":"ORTHO-C18-047","sec":"Prognostic factors","page":150,"q":"Duration of cord involvement predicting a BAD prognosis in Pott's paraplegia is:","opts":["Shorter history","Longer (>1 month)","1 week","Irrelevant to prognosis"],"ans":1,"exp":"Duration of cord involvement: shorter history -> better; longer (>1 month) -> bad. (Book p150)"},{"id":"ORTHO-C18-048","sec":"Prognostic factors","page":150,"q":"Which vertebral disease pattern indicates a BETTER prognosis in Pott's paraplegia?","opts":["Healed","Active / exudative / wet","Calcified","Irrelevant to prognosis"],"ans":1,"exp":"Vertebral disease: active / exudative / wet -> better prognosis; healed -> bad. (Book p150)"},{"id":"ORTHO-C18-049","sec":"Prognostic factors","page":150,"q":"In Pott's paraplegia, a BETTER prognosis is seen when compression is due to:","opts":["Bony deformity","Granulation tissue","Healed bone","Any cause equally"],"ans":1,"exp":"Compression d/t granulation tissue -> better prognosis; compression d/t bony deformity -> bad. (Book p150)"},{"id":"ORTHO-C18-050","sec":"Prognostic factors","page":150,"q":"Which combination is MOST likely to give a POOR prognosis in Pott's paraplegia?","opts":["Young, slow onset, early onset, active wet disease","Older, rapid onset, late onset, healed disease","Young, rapid onset, active disease","Older, slow onset, short history of cord involvement"],"ans":1,"exp":"Older age + rapid + late onset + long cord involvement + healed vertebral disease = bad prognosis. (Book p150)"},{"id":"ORTHO-C18-051","sec":"Treatment","page":150,"q":"The 'middle path' regimen for Pott's paraplegia is:","opts":["Immediate surgery","ATT for 18-24 months + rest + brace (Taylor's brace)","Traction alone","Radiotherapy"],"ans":1,"exp":"Middle path regimen: ATT for 18-24 months + rest + brace (Taylor's brace). (Book p150)"},{"id":"ORTHO-C18-052","sec":"Treatment","page":150,"q":"The brace used in the middle-path regimen of Pott's paraplegia is:","opts":["Minerva jacket","Taylor's brace","Boston brace","Cervical collar"],"ans":1,"exp":"Brace: Taylor's brace. (Book p150)"},{"id":"ORTHO-C18-053","sec":"Treatment","page":150,"q":"If the patient improves on the middle-path regimen, management is to:","opts":["Stop ATT","Continue treatment","Refer for immediate decompression","Switch to radiotherapy"],"ans":1,"exp":"Improvement -> continue treatment. (Book p150)"},{"id":"ORTHO-C18-054","sec":"Treatment","page":150,"q":"Surgical decompression in Pott's paraplegia is indicated when there is:","opts":["Improvement on ATT","No improvement / neurological manifestation, or worsening / bowel and bladder involvement","Full recovery","Transient ankle clonus only"],"ans":1,"exp":"No improvement / neurological manifestation, or worsening / bowel and bladder involvement -> surgical decompression. (Book p150)"},{"id":"ORTHO-C18-055","sec":"Treatment","page":150,"q":"The surgical decompression for Pott's paraplegia consists of:","opts":["Laminectomy alone","Left anterolateral decompression + autologous bone grafting + spine stabilisation","Fusion without decompression","Arthrodesis of the hip"],"ans":1,"exp":"Surgical decompression: left anterolateral decompression + autologous bone grafting + spine stabilisation. (Book p150)"},{"id":"ORTHO-C18-056","sec":"Treatment","page":150,"q":"During Pott's paraplegia decompression, all of the following parts are removed EXCEPT:","opts":["Rib","Transverse process","Pedicle","Lamina"],"ans":3,"exp":"Parts removed: rib, transverse process, pedicle, vertebral body, affected disc. (Book p150)"},{"id":"ORTHO-C18-057","sec":"TB spine vs metastasis","page":151,"q":"On MRI, a involved disc ('bad disc') in a lytic spine lesion suggests:","opts":["Metastasis","TB spine (good prognosis)","Osteomyelitis","Hemangioma"],"ans":1,"exp":"Disc involved (bad disc) -> TB spine (good prognosis). (Book p151)"},{"id":"ORTHO-C18-058","sec":"TB spine vs metastasis","page":151,"q":"On MRI, a spared disc ('good disc') in a lytic spine lesion suggests:","opts":["TB spine","Metastasis (bad prognosis)","Schmorl's node","Osteochondritis"],"ans":1,"exp":"Disc spared (good disc) -> metastasis (bad prognosis). (Book p151)"},{"id":"ORTHO-C18-059","sec":"TB spine vs metastasis","page":151,"q":"The 'winking owl sign' on spinal X-ray indicates:","opts":["TB spine","Metastasis","Scoliosis","Osteoporosis"],"ans":1,"exp":"X-ray: metastasis -> winking owl sign. (Book p151)"},{"id":"ORTHO-C18-060","sec":"TB spine vs metastasis","page":151,"q":"The winking owl sign is produced by:","opts":["Destruction of the pedicle (absent pedicle)","Disc space narrowing","Sclerotic ribs","Widening of the spinal canal"],"ans":0,"exp":"Winking owl sign is d/t destruction of pedicle (absent pedicle). (Book p151)"},{"id":"ORTHO-C18-061","sec":"TB Hip","page":151,"q":"The site / first focus of appearance in TB hip is the:","opts":["Greater trochanter","Acetabulum and Babcock's triangle","Femoral head only","Pubic symphysis"],"ans":1,"exp":"Site / first focus of appearance: acetabulum and Babcock's triangle. (Book p151)"},{"id":"ORTHO-C18-062","sec":"TB Hip","page":151,"q":"Babcock's triangle is located in the:","opts":["Acetabular roof","Neck of femur","Trochanteric region","Ischium"],"ans":1,"exp":"Babcock's triangle: area in neck of femur. (Book p151)"},{"id":"ORTHO-C18-063","sec":"TB Hip","page":151,"q":"The organism grows easily in Babcock's triangle because it is:","opts":["Rich in monocytes","Deficient in monocyte and macrophage","Highly vascular","Avascular with many nerves"],"ans":1,"exp":"Deficient in monocyte and macrophage -> organism grows easily. (Book p151)"},{"id":"ORTHO-C18-064","sec":"TB Hip","page":151,"q":"Local symptoms of TB hip include all of the following EXCEPT:","opts":["Painful limb / antalgic gait","Shortening","Deformity","Hyperextension attitude"],"ans":3,"exp":"Local symptoms: painful limb / antalgic gait, shortening, deformity. (Book p151)"},{"id":"ORTHO-C18-065","sec":"Stages","page":152,"q":"Stage I of TB hip is:","opts":["Synovitis / stage of apparent lengthening","Early arthritis / stage of apparent shortening","Late arthritis / stage of true shortening","Fibrous ankylosis"],"ans":0,"exp":"Stage I: synovitis / stage of apparent lengthening. (Book p152)"},{"id":"ORTHO-C18-066","sec":"Stages","page":152,"q":"In stage I TB hip, the inflamed synovium causes:","opts":["Increased synovial fluid secretion -> distension of capsule -> pain","Joint fibrosis","Bony ankylosis","Tendon rupture"],"ans":0,"exp":"Inflamed synovium -> increased synovial fluid secretion -> distension of capsule -> pain. (Book p152)"},{"id":"ORTHO-C18-067","sec":"Stages","page":152,"q":"The position of ease in early (stage I) TB hip is:","opts":["Flexion, abduction, external rotation","Flexion, adduction, internal rotation","Extension, adduction, internal rotation","Full extension"],"ans":0,"exp":"Position of ease: flexion, abduction, external rotation. (Book p152)"},{"id":"ORTHO-C18-068","sec":"Stages","page":152,"q":"Stage II of TB hip is:","opts":["Synovitis with apparent lengthening","Early arthritis / stage of apparent shortening","Late arthritis with true shortening","Wandering acetabulum"],"ans":1,"exp":"Stage II: early arthritis / stage of apparent shortening. (Book p152)"},{"id":"ORTHO-C18-069","sec":"Stages","page":152,"q":"The apparent shortening in stage II TB hip is:","opts":["<1 cm",">1 cm",">3 cm","Fixed at 5 cm"],"ans":0,"exp":"Stage II: apparent shortening <1 cm, with flexion, adduction, internal rotation. (Book p152)"},{"id":"ORTHO-C18-070","sec":"Stages","page":152,"q":"Stage III of TB hip is:","opts":["Synovitis","Early arthritis","Late arthritis / stage of true shortening","Fibrous ankylosis"],"ans":2,"exp":"Stage III: late arthritis / stage of true shortening. (Book p152)"},{"id":"ORTHO-C18-071","sec":"Stages","page":152,"q":"True shortening in stage III TB hip is:","opts":["<1 cm",">1 cm","Zero",">5 cm only"],"ans":1,"exp":"Stage III: true shortening >1 cm, with significant destruction of articular cartilage. (Book p152)"},{"id":"ORTHO-C18-072","sec":"Stages","page":152,"q":"In stage IV ('wandering acetabulum') TB hip, the destroyed femoral head appears as a small head against a large acetabulum - this is called:","opts":["Pestle and mortar deformity","Coxa vara","Coxa brevis","Slipped capital femoral epiphysis"],"ans":0,"exp":"Stage IV: destruction of head of femur (small head against large acetabulum) -> pestle and mortar deformity. (Book p152)"},{"id":"ORTHO-C18-073","sec":"Stages","page":152,"q":"Stage V of TB hip is:","opts":["Bony ankylosis","Fibrous ankylosis - painful, unstable hip with limited mobility","Wandering acetabulum","Synovitis"],"ans":1,"exp":"Stage V: fibrous ankylosis - painful, unstable hip with limited mobility. (Book p152)"},{"id":"ORTHO-C18-074","sec":"Investigation","page":152,"q":"Phemister's triad in TB hip consists of all of the following EXCEPT:","opts":["Juxta-articular osteopenia","Peripheral osseous erosions","Narrowing of joint space","Central pedicle erosion"],"ans":3,"exp":"Phemister triad: 1. juxta-articular osteopenia / osteoporosis, 2. peripheral osseous erosions, 3. narrowing of joint space. (Book p152)"},{"id":"ORTHO-C18-075","sec":"Investigation","page":152,"q":"The earliest sign of TB hip on X-ray is:","opts":["Narrowing of joint space","Juxta-articular osteopenia / osteoporosis","Peripheral osseous erosions","Pestle and mortar deformity"],"ans":1,"exp":"Juxta-articular osteopenia / osteoporosis: earliest sign in X-ray (Phemister triad). (Book p152)"},{"id":"ORTHO-C18-076","sec":"Treatment","page":152,"q":"Early treatment of TB hip is:","opts":["Immediate total hip replacement","ATT + rest + traction (prevent destruction of head)","Arthrodesis","Excision arthroplasty"],"ans":1,"exp":"Early: ATT + rest + traction (prevent destruction of head); no improvement -> surgical decompression. (Book p152)"},{"id":"ORTHO-C18-077","sec":"Treatment","page":152,"q":"Late treatment of TB hip consists of:","opts":["Traction only","ATT + correction of deformity in fibrous ankylosis","Immediate THA in childhood","Radiotherapy"],"ans":1,"exp":"Late: ATT + correction of deformity: in fibrous ankylosis. (Book p152)"},{"id":"ORTHO-C18-078","sec":"Treatment","page":152,"q":"For correction of late TB hip with a MOBILE hip, the BEST option is:","opts":["Girdlestone excision arthroplasty","Arthroplasty: total hip replacement","Arthrodesis","Osteotomy"],"ans":1,"exp":"Correction with mobile hip: arthroplasty - total hip replacement (best). (Book p152)"},{"id":"ORTHO-C18-079","sec":"Treatment","page":152,"q":"Total hip replacement in late TB hip is usually performed after:","opts":["2-3 months","10-15 years (d/t risk of recurrence)","6 weeks","1 month"],"ans":1,"exp":"THA performed after 10-15 years d/t risk of recurrence. (Book p152)"},{"id":"ORTHO-C18-080","sec":"Treatment","page":152,"q":"In Girdlestone excision arthroplasty:","opts":["Fibrosed head of femur is removed and muscle interposed between neck and acetabulum; done when THA is contraindicated","The joint is fused","A prosthesis is implanted","Only the capsule is excised"],"ans":0,"exp":"Girdlestone: fibrosed head of femur removed, muscle interposed between neck and acetabulum; done when THA is contraindicated. (Book p152)"},{"id":"ORTHO-C18-081","sec":"Treatment","page":152,"q":"Correction of late TB hip with a FIXED hip (fibrous ankylosis) is by:","opts":["Arthroplasty","Arthrodesis","Traction","Excision only"],"ans":1,"exp":"Correction with fixed hip: arthrodesis. (Book p152)"},{"id":"ORTHO-C18-082","sec":"TB knee","page":153,"q":"The attitude of the knee in TB knee is:","opts":["Full extension","5-30 degree flexion","Hyperextension","90 degree flexion with external rotation"],"ans":1,"exp":"Attitude of knee: 5-30 degree flexion (position of ease d/t initial synovitis leading to effusion). (Book p153)"},{"id":"ORTHO-C18-083","sec":"TB knee","page":153,"q":"The knee rests in 5-30 degree flexion in early TB knee because of:","opts":["Meniscal tear","Initial synovitis leading to effusion","Osteoarthritis","Ligament rupture"],"ans":1,"exp":"Position of ease d/t initial synovitis leading to effusion. (Book p153)"},{"id":"ORTHO-C18-084","sec":"TB knee","page":153,"q":"The triple deformity of late TB knee (PERF) consists of all of the following EXCEPT:","opts":["Posterior subluxation of knee","External rotation of tibia","Flexion of knee","Internal rotation of tibia"],"ans":3,"exp":"Triple deformity in late stage (PERF): 1. posterior subluxation of knee, 2. external rotation of tibia, 3. flexion of knee. (Book p153)"},{"id":"ORTHO-C18-085","sec":"TB knee","page":153,"q":"The IOC for TB knee is:","opts":["X-ray","MRI (synovitis seen)","CT","Arthroscopy"],"ans":1,"exp":"MRI (IOC): synovitis seen. (Book p153)"},{"id":"ORTHO-C18-086","sec":"TB knee","page":153,"q":"The gold standard for diagnosis of TB knee is:","opts":["MRI","Biopsy","X-ray","Joint aspiration"],"ans":1,"exp":"Biopsy: gold standard. (Book p153)"},{"id":"ORTHO-C18-087","sec":"TB knee","page":153,"q":"Early treatment of TB knee is:","opts":["ATT + rest + traction (prevent destruction of head); no improvement -> surgical decompression","Immediate arthrodesis","Total hip replacement","Arthroplasty after 10-15 years"],"ans":0,"exp":"Early: ATT + rest + traction (prevent destruction of head); no improvement -> surgical decompression. (Book p153)"},{"id":"ORTHO-C18-088","sec":"TB knee","page":153,"q":"Late treatment of TB knee includes correction of deformity by:","opts":["Arthroplasty (after 10-15 years) or arthrodesis","Immediate total joint replacement","Traction","Bracing alone"],"ans":0,"exp":"Late: ATT + correction of deformity -> arthroplasty (after 10-15 years) or arthrodesis. (Book p153)"},{"id":"ORTHO-C18-089","sec":"Note","page":153,"q":"A non-healing sinus in chronic osteomyelitis is due to:","opts":["Presence of sequestrum","Excess pus","Poor nutrition","Drug resistance"],"ans":0,"exp":"Non-healing sinus in chronic osteomyelitis: d/t presence of sequestrum. (Book p153)"},{"id":"ORTHO-C18-090","sec":"Note","page":153,"q":"Periosteal reaction in tubercular osteomyelitis is:","opts":["Prominent","Not seen","Always present","The earliest radiological sign"],"ans":1,"exp":"Periosteal reaction not seen in tubercular osteomyelitis. (Book p153)"},{"id":"ORTHO-C18-091","sec":"Note","page":153,"q":"The part of the vertebra LEAST involved in TB spine is the:","opts":["Vertebral body","Intervertebral disc","Spinous process","Pedicle"],"ans":2,"exp":"Part of vertebra least involved in TB spine: spinous process. (Book p153)"},{"id":"ORTHO-C18-092","sec":"Note","page":153,"q":"Paraplegia in TB spine is commonest in the:","opts":["Lumbar region","Upper thoracic region","Cervical region","Sacral region"],"ans":1,"exp":"Paraplegia in TB spine commonest in upper thoracic region. (Book p153)"},{"id":"ORTHO-C18-093","sec":"Note","page":153,"q":"Paraplegia is commonest in the upper thoracic region in TB spine because there the spinal cord is:","opts":["Thinner","Thicker, so easier to compress","Completely absent","Part of the cauda equina"],"ans":1,"exp":"Upper thoracic region: spinal cord thicker -> easier to compress. (Book p153)"},{"id":"ORTHO-C18-094","sec":"Note","page":153,"q":"Charcot's joint is seen in all of the following EXCEPT:","opts":["Syphilis","DM","Syringomyelia","TB"],"ans":3,"exp":"Charcot's joint seen in: syphilis, DM, syringomyelia. (Book p153)"}];
const UNITS = [{"id":"ORTHO-U01","ch":1,"n":1,"title":"Bone Composition & Matrix Proteins","sec":"Bone Composition · p1","qs":["ORTHO-C1-001","ORTHO-C1-002","ORTHO-C1-003","ORTHO-C1-004","ORTHO-C1-005","ORTHO-C1-006","ORTHO-C1-007","ORTHO-C1-008","ORTHO-C1-009"],"guide":"Bone as an osteon has three parts: organic osteoid, water, and inorganic mineral. Children carry more water, so their bones are softer. The mineral is calcium hydroxyapatite; the chief protein is Type I collagen, joined by osteocalcin and osteonectin."},{"id":"ORTHO-U02","ch":1,"n":2,"title":"Osteoblast & Osteoclast","sec":"Bone Composition · p1","qs":["ORTHO-C1-010","ORTHO-C1-011","ORTHO-C1-012","ORTHO-C1-013","ORTHO-C1-014","ORTHO-C1-015","ORTHO-C1-016","ORTHO-C1-017","ORTHO-C1-018"],"guide":"Osteoblasts are mononuclear builders — they lay down osteoid matrix and are rich in ALP. Osteoclasts are multinucleated giants from monocyte aggregates — phagocytic resorbers rich in TRAP and carbonic anhydrase, with ruffled borders."},{"id":"ORTHO-U03","ch":1,"n":3,"title":"Osteocyte & Collagen Types","sec":"Bone Composition · p1","qs":["ORTHO-C1-019","ORTHO-C1-020","ORTHO-C1-021","ORTHO-C1-022","ORTHO-C1-023","ORTHO-C1-024","ORTHO-C1-025","ORTHO-C1-026","ORTHO-C1-027","ORTHO-C1-028"],"guide":"Osteocytes are mature, resting osteoblasts — the most numerous bone cells with the longest life. Bone strength rests on the blast–clast balance. Type 1 collagen: bone, meniscus, annulus fibrosis. Type 2: articular hyaline cartilage, nucleus pulposus."},{"id":"ORTHO-U04","ch":1,"n":4,"title":"Bone Formation & Resorption Markers","sec":"Bone Markers · p2","qs":["ORTHO-C1-029","ORTHO-C1-030","ORTHO-C1-031","ORTHO-C1-032","ORTHO-C1-033","ORTHO-C1-034","ORTHO-C1-035","ORTHO-C1-036","ORTHO-C1-037","ORTHO-C1-038","ORTHO-C1-039","ORTHO-C1-040"],"guide":"Formation markers: ALP, Procollagen I, Osteocalcin, Osteonectin. Resorption markers: Hydroxyproline and Hydroxylysine (collagen breakdown bits), NRC telopeptide, TRAP. Notice ALP, TRAP, osteocalcin and osteonectin pull double duty."},{"id":"ORTHO-U05","ch":1,"n":5,"title":"Parts of a Long Bone","sec":"Anatomy of Bone · p2","qs":["ORTHO-C1-041","ORTHO-C1-042","ORTHO-C1-043","ORTHO-C1-044","ORTHO-C1-045","ORTHO-C1-046","ORTHO-C1-047","ORTHO-C1-048","ORTHO-C1-049","ORTHO-C1-050"],"guide":"Proximal to distal: epiphysis, metaphysis, diaphysis, metaphysis, epiphysis. Children have a physeal plate; adults keep only an epiphyseal line. The medullary cavity holds marrow in children, fat in adults, and is lined by endosteum."},{"id":"ORTHO-U06","ch":1,"n":6,"title":"Periosteum & Sharpey's Fibres","sec":"Anatomy of Bone · p2","qs":["ORTHO-C1-051","ORTHO-C1-052","ORTHO-C1-053","ORTHO-C1-054","ORTHO-C1-055","ORTHO-C1-056","ORTHO-C1-057","ORTHO-C1-058"],"guide":"Sharpey's perforating fibres pin the periosteum to bone. Periosteum covers all long bones except articular surfaces and sesamoids like the patella. Its outer fibrous layer provides nutrition; the inner cellular layer drives growth."},{"id":"ORTHO-U07","ch":1,"n":7,"title":"Blood Supply of Bone","sec":"Blood Supply & Architecture · p3","qs":["ORTHO-C1-059","ORTHO-C1-060","ORTHO-C1-061","ORTHO-C1-062","ORTHO-C1-063","ORTHO-C1-064","ORTHO-C1-065","ORTHO-C1-066"],"guide":"The nutrient artery enters via the nutrient foramen with medullary vessels alongside. Metaphyseal vessels loop like hair-pins, slowing flow. Rich supply heals fast — but also spreads infection and tumours, helped by scarce macrophages."},{"id":"ORTHO-U08","ch":1,"n":8,"title":"Woven Bone, Sites & Consistency","sec":"Blood Supply & Architecture · p3","qs":["ORTHO-C1-067","ORTHO-C1-068","ORTHO-C1-069","ORTHO-C1-070","ORTHO-C1-071","ORTHO-C1-072","ORTHO-C1-073","ORTHO-C1-074"],"guide":"Woven bone has jumbled collagen — weak, seen in children and fracture callus. Mature bone splits two ways: soft, cell-poor cancellous bone at the metaphysis; hard, cell-rich cortical bone at the diaphysis."},{"id":"ORTHO-U09","ch":1,"n":9,"title":"Healing, Infection & Complications","sec":"Blood Supply & Architecture · p3","qs":["ORTHO-C1-075","ORTHO-C1-076","ORTHO-C1-077","ORTHO-C1-078","ORTHO-C1-079","ORTHO-C1-080","ORTHO-C1-081"],"guide":"Cancellous bone is vascular: heals fast but risks infection and malunion. Cortical bone heals slowly and risks non-union. Remember the sting in the tail — intra-articular epiphyseal fractures end in osteoarthritis and a stiff joint."},{"id":"ORTHO-U10","ch":1,"n":10,"title":"Bone Growth & the Growth Plate","sec":"Bone Growth · p4","qs":["ORTHO-C1-082","ORTHO-C1-083","ORTHO-C1-084","ORTHO-C1-085","ORTHO-C1-086","ORTHO-C1-087","ORTHO-C1-088","ORTHO-C1-089","ORTHO-C1-090","ORTHO-C1-091","ORTHO-C1-092"],"guide":"The physis exists only in children and lengthens bone. Layers, epiphysis to metaphysis: germinal (most important) → proliferative → hypertrophic (weakest) → calcification → ossification. Complete germinal injury shortens the limb; partial injury bends it into varus/valgus. Thickness grows by apposition via endosteum and periosteum."},{"id":"ORTHO-U2-01","ch":2,"n":1,"title":"Fracture Definition & General Features","sec":"Fracture Basics · p5","guide":"A fracture is a break in the bone cortex. Tenderness is the most consistent sign, but abnormal mobility with crepitus is pathognomonic. On X-ray, look for discontinuity of bone.","qs":["ORTHO-C2-001","ORTHO-C2-002","ORTHO-C2-003","ORTHO-C2-004","ORTHO-C2-005","ORTHO-C2-006","ORTHO-C2-007","ORTHO-C2-008"]},{"id":"ORTHO-U2-02","ch":2,"n":2,"title":"Fracture Types & Mechanism of Injury","sec":"Fracture Basics · p5","guide":"Five patterns with significant trauma: transverse, oblique, spiral, comminuted, segmental. Force decides pattern — pull snaps transverse, bend snaps butterfly, squash slants oblique, twist spirals.","qs":["ORTHO-C2-009","ORTHO-C2-010","ORTHO-C2-011","ORTHO-C2-012","ORTHO-C2-013","ORTHO-C2-014","ORTHO-C2-015","ORTHO-C2-016"]},{"id":"ORTHO-U2-03","ch":2,"n":3,"title":"Avulsion & Pathological Causes","sec":"Avulsion & Pathological · p6","guide":"Violent tendon pulls avulse the patella or olecranon. Without trauma, think pathological: local causes like cysts and radiation, or generalized disease led by osteoporosis — spine, then hip, then wrist.","qs":["ORTHO-C2-017","ORTHO-C2-018","ORTHO-C2-019","ORTHO-C2-020","ORTHO-C2-021","ORTHO-C2-022","ORTHO-C2-023","ORTHO-C2-024","ORTHO-C2-025","ORTHO-C2-026","ORTHO-C2-027","ORTHO-C2-028","ORTHO-C2-029","ORTHO-C2-030"]},{"id":"ORTHO-U2-04","ch":2,"n":4,"title":"Pathological X-rays, Pain & Mirel's","sec":"Avulsion & Pathological · p6","guide":"Metastases love the proximal femur — hunt them with FDG-PET. Banana bones mean Paget's. Pain before the break means micro-fractures; Mirel's 8 or more means fix it before it snaps.","qs":["ORTHO-C2-031","ORTHO-C2-032","ORTHO-C2-033","ORTHO-C2-034","ORTHO-C2-035","ORTHO-C2-036","ORTHO-C2-037","ORTHO-C2-038"]},{"id":"ORTHO-U2-05","ch":2,"n":5,"title":"Stress Fracture Sites","sec":"Stress & Shin · p7","guide":"Sudden jumps in repetitive loading crack weight-bearing bones — tibia, fibula, metatarsal. The march fracture hits the 2nd metatarsal neck more than the shaft.","qs":["ORTHO-C2-039","ORTHO-C2-040","ORTHO-C2-041","ORTHO-C2-042","ORTHO-C2-043","ORTHO-C2-044","ORTHO-C2-045","ORTHO-C2-046"]},{"id":"ORTHO-U2-06","ch":2,"n":6,"title":"Stress Pain, Imaging & Treatment","sec":"Stress & Shin · p7","guide":"Stress pain comes before the break and rises with activity. X-ray lags 2–3 weeks; MRI is the investigation of choice, catching edema and occult lines. Stop the stressor, rest the limb.","qs":["ORTHO-C2-047","ORTHO-C2-048","ORTHO-C2-049","ORTHO-C2-050","ORTHO-C2-051","ORTHO-C2-052","ORTHO-C2-053","ORTHO-C2-054"]},{"id":"ORTHO-U2-07","ch":2,"n":7,"title":"Shin Splints & the Jones Fracture","sec":"Stress & Shin · p7","guide":"Shin splints are medial tibial periostitis in runners — anteromedial pain, normal X-ray. At the 5th metatarsal base, Jones zones run 3-2-1: stress, true Jones, pseudo Jones.","qs":["ORTHO-C2-055","ORTHO-C2-056","ORTHO-C2-057","ORTHO-C2-058","ORTHO-C2-059","ORTHO-C2-060","ORTHO-C2-061","ORTHO-C2-062","ORTHO-C2-063","ORTHO-C2-064","ORTHO-C2-065"]},{"id":"ORTHO-U2-08","ch":2,"n":8,"title":"Types & Timeline of Healing","sec":"Fracture Healing · p8","guide":"Rigid fixation heals directly with no callus (primary). Micromovement heals indirectly through cartilage callus — stronger and more common (secondary). Timelines double by stage: days, weeks, months, years.","qs":["ORTHO-C2-066","ORTHO-C2-067","ORTHO-C2-068","ORTHO-C2-069","ORTHO-C2-070","ORTHO-C2-071","ORTHO-C2-072","ORTHO-C2-073","ORTHO-C2-074","ORTHO-C2-075","ORTHO-C2-076"]},{"id":"ORTHO-U2-09","ch":2,"n":9,"title":"Stages I–V Mechanism","sec":"Fracture Healing · p8","guide":"Stage by stage: blood collects, fibroblasts weave mesh, osteoblasts lay callus, callus hardens, osteoclasts sculpt native bone. A ruptured nutrient artery starts it all.","qs":["ORTHO-C2-077","ORTHO-C2-078","ORTHO-C2-079","ORTHO-C2-080","ORTHO-C2-081","ORTHO-C2-082","ORTHO-C2-083","ORTHO-C2-084","ORTHO-C2-085"]},{"id":"ORTHO-U2-10","ch":2,"n":10,"title":"Callus & Healing Inhibitors","sec":"Callus & Non-union · p9","guide":"Callus is disorganised immature bone, visible at 2–3 weeks — squeeze it and it unites faster. Healing hates old age, smoking, open wounds, ischemia, and above all improper mobilisation.","qs":["ORTHO-C2-086","ORTHO-C2-087","ORTHO-C2-088","ORTHO-C2-089","ORTHO-C2-090","ORTHO-C2-091","ORTHO-C2-092","ORTHO-C2-093","ORTHO-C2-094"]},{"id":"ORTHO-U2-11","ch":2,"n":11,"title":"Non-union Types & Table","sec":"Callus & Non-union · p9","guide":"No callus past 9 months is non-union — classically the lower tibial shaft. Hypertrophic ends are sclerosed with exuberant callus and just need stillness; atrophic ends are dead quiet and need graft.","qs":["ORTHO-C2-095","ORTHO-C2-096","ORTHO-C2-097","ORTHO-C2-098","ORTHO-C2-099","ORTHO-C2-100","ORTHO-C2-101","ORTHO-C2-102","ORTHO-C2-103","ORTHO-C2-104","ORTHO-C2-105","ORTHO-C2-106"]},{"id":"ORTHO-U2-12","ch":2,"n":12,"title":"Bone Grafts & Substitutes","sec":"Grafts & Malunion · p10","guide":"Iliac crest is the graft goldmine. Ideal grafts make bone (genesis), scaffold bone (conduction), and recruit bone (induction). Calcium salts and PMMA conduct; BMP induces and speeds union.","qs":["ORTHO-C2-107","ORTHO-C2-108","ORTHO-C2-109","ORTHO-C2-110","ORTHO-C2-111","ORTHO-C2-112","ORTHO-C2-113","ORTHO-C2-114","ORTHO-C2-115","ORTHO-C2-116"]},{"id":"ORTHO-U2-13","ch":2,"n":13,"title":"Malunion Bones","sec":"Grafts & Malunion · p10","guide":"Malunion heals crooked — clavicle most of all — and earns an osteotomy only if function suffers. Supracondylar humerus, Colles, intertrochanteric and femur follow the clavicle.","qs":["ORTHO-C2-117","ORTHO-C2-118","ORTHO-C2-119","ORTHO-C2-120","ORTHO-C2-121","ORTHO-C2-122","ORTHO-C2-123"]},{"id":"ORTHO-U2-14","ch":2,"n":14,"title":"Non-union Bones & the Rule","sec":"Grafts & Malunion · p10","guide":"Non-union bones: tibial shaft, scaphoid, lateral humeral condyle, intracapsular femoral neck, talar neck. Malunion bones almost never non-unite — pick a side, as the note says.","qs":["ORTHO-C2-124","ORTHO-C2-125","ORTHO-C2-126","ORTHO-C2-127","ORTHO-C2-128","ORTHO-C2-129","ORTHO-C2-130","ORTHO-C2-131"]},{"id":"ORTHO-U2-15","ch":2,"n":15,"title":"Management Terms & Manual Reduction","sec":"Reduction & Traction · p11","guide":"Muscles displace the distal fragment; reduction restores anatomy against counter-force. Manual closed reduction uses hands alone, then plaster, then a check X-ray. Skin pulls 5–6 kg, skeleton 15–16.","qs":["ORTHO-C2-132","ORTHO-C2-133","ORTHO-C2-134","ORTHO-C2-135","ORTHO-C2-136","ORTHO-C2-137","ORTHO-C2-138","ORTHO-C2-139","ORTHO-C2-140","ORTHO-C2-141","ORTHO-C2-142","ORTHO-C2-143"]},{"id":"ORTHO-U2-16","ch":2,"n":16,"title":"Skin–Skeletal Traction & Instruments","sec":"Reduction & Traction · p11","guide":"Skin traction drags bandage to skin to soft tissue. Skeletal pins bite bone — upper tibia most often — using lignocaine, pins, an 11-blade, forceps, drill and Bohler's stirrup.","qs":["ORTHO-C2-144","ORTHO-C2-145","ORTHO-C2-146","ORTHO-C2-147","ORTHO-C2-148","ORTHO-C2-149","ORTHO-C2-150","ORTHO-C2-151"]},{"id":"ORTHO-U2-17","ch":2,"n":17,"title":"Traction Pins & Procedure Start","sec":"Pins & Procedure · p12","guide":"Threaded Denham pins grip osteoporotic calcaneum; smooth Steinmann pins suit normal tibia and femur. The upper tibial ritual: drape, deep local both sides, stab 2.5 cm below-behind the tubercle, dilate, drill through.","qs":["ORTHO-C2-152","ORTHO-C2-153","ORTHO-C2-154","ORTHO-C2-155","ORTHO-C2-156","ORTHO-C2-157","ORTHO-C2-158","ORTHO-C2-159","ORTHO-C2-160","ORTHO-C2-161","ORTHO-C2-162","ORTHO-C2-163"]},{"id":"ORTHO-U2-18","ch":2,"n":18,"title":"Procedure Finish & Complications","sec":"Pins & Procedure · p12","guide":"Finish the ritual: dress, lock the stirrup, hang rope weights, mount the splint. Watch for staph at the pin and ring sequestra at entry and exit. This traction serves IT and distal femur fractures.","qs":["ORTHO-C2-164","ORTHO-C2-165","ORTHO-C2-166","ORTHO-C2-167","ORTHO-C2-168","ORTHO-C2-169","ORTHO-C2-170","ORTHO-C2-171","ORTHO-C2-172"]},{"id":"ORTHO-U2-19","ch":2,"n":19,"title":"Thomas Splint","sec":"Splints · p12–13","guide":"Splints buy time. Thomas's fixed-traction splint — born for TB knees — rings the perineum for counter-traction, frees the patient to move, and loves femur fractures.","qs":["ORTHO-C2-173","ORTHO-C2-174","ORTHO-C2-175","ORTHO-C2-176","ORTHO-C2-177","ORTHO-C2-178","ORTHO-C2-179"]},{"id":"ORTHO-U2-20","ch":2,"n":20,"title":"Bohler-Braun & Russell's Traction","sec":"Splints · p12–13","guide":"Bohler-Braun slides in the ward, gravity pulls back from a raised footend. Pulleys: A tibia, B femur, C saves the foot from dropping. Russell's variant serves the intertrochanteric femur.","qs":["ORTHO-C2-180","ORTHO-C2-181","ORTHO-C2-182","ORTHO-C2-183","ORTHO-C2-184","ORTHO-C2-185","ORTHO-C2-186"]},{"id":"ORTHO-U2-21","ch":2,"n":21,"title":"Definitive Treatment Algorithm","sec":"Definitive Care · p13–14","guide":"Definitive rule one: is the joint surface involved? Intra-articular means open up and plate it. Extra-articular: close it and plaster — or plate the upper limb, nail the lower.","qs":["ORTHO-C2-187","ORTHO-C2-188","ORTHO-C2-189","ORTHO-C2-190","ORTHO-C2-191","ORTHO-C2-192","ORTHO-C2-193","ORTHO-C2-194"]},{"id":"ORTHO-U2-22","ch":2,"n":22,"title":"Open vs Closed & POP","sec":"Definitive Care · p13–14","guide":"Open reduction sees the fracture and wins on accuracy — mandatory inside joints to dodge arthritis. POP is cheap and kind but clumsy, freezing joints above and below into atrophy and stiffness.","qs":["ORTHO-C2-195","ORTHO-C2-196","ORTHO-C2-197","ORTHO-C2-198","ORTHO-C2-199","ORTHO-C2-200","ORTHO-C2-201","ORTHO-C2-202"]},{"id":"ORTHO-U2-23","ch":2,"n":23,"title":"CRIF & Tension Band Wiring","sec":"Definitive Care · p13–14","guide":"CRIF threads rods down the medulla under C-arm eyes, and locking screws stop spin. Quadriceps rips patellae, triceps rips olecranons — both get opened, fixed, and tension-band wired.","qs":["ORTHO-C2-203","ORTHO-C2-204","ORTHO-C2-205","ORTHO-C2-206","ORTHO-C2-207","ORTHO-C2-208","ORTHO-C2-209","ORTHO-C2-210","ORTHO-C2-211"]},{"id":"ORTHO-U3-01","ch":3,"n":1,"title":"Open Fracture & Gustilo I–II","sec":"Open Fracture · p15","guide":"Open means the skin is breached — tibia and fingers suffer most, staph walks in, and the escaping hematoma spoils healing. Gustilo I is a sub-centimetre inside-out poke; II spans 1–10 cm.","qs":["ORTHO-C3-001","ORTHO-C3-002","ORTHO-C3-003","ORTHO-C3-004","ORTHO-C3-005","ORTHO-C3-006","ORTHO-C3-007","ORTHO-C3-008","ORTHO-C3-009"]},{"id":"ORTHO-U3-02","ch":3,"n":2,"title":"Gustilo Grade III","sec":"Open Fracture · p15","guide":"Grade III is the danger zone: IIIa is filthy (sewage, farms, firearms, usually over 10 cm), IIIb is stripped of periosteum, IIIc has torn vessels.","qs":["ORTHO-C3-010","ORTHO-C3-011","ORTHO-C3-012","ORTHO-C3-013","ORTHO-C3-014","ORTHO-C3-015","ORTHO-C3-016"]},{"id":"ORTHO-U3-03","ch":3,"n":3,"title":"Wound Toilette & Closure","sec":"Wound & Fracture Care · p16","guide":"Wound first, bone second. Wash with povidone and saline, cut away dead tissue. Close at once only if clean and edge-to-edge; delay if late, mangled, or neurovascularly hurt.","qs":["ORTHO-C3-017","ORTHO-C3-018","ORTHO-C3-019","ORTHO-C3-020","ORTHO-C3-021","ORTHO-C3-022","ORTHO-C3-023","ORTHO-C3-024","ORTHO-C3-025"]},{"id":"ORTHO-U3-04","ch":3,"n":4,"title":"Fracture Grades & the IF Ban","sec":"Wound & Fracture Care · p16","guide":"Grade I behaves like a closed fracture. Grades II–IIIa earn that privilege only if clean within 6–12 hours — otherwise they wear external frames, like all IIIb/IIIc. Never plate an open fracture: biofilm will feast.","qs":["ORTHO-C3-026","ORTHO-C3-027","ORTHO-C3-028","ORTHO-C3-029","ORTHO-C3-030","ORTHO-C3-031"]},{"id":"ORTHO-U3-05","ch":3,"n":5,"title":"External Fixation Assembly","sec":"Wound & Fracture Care · p16","guide":"External fixation holds bone from outside: Schanz pins bite above and below the wound, rods lock the pins, clamps and connecting bars complete the scaffold.","qs":["ORTHO-C3-032","ORTHO-C3-033","ORTHO-C3-034","ORTHO-C3-035","ORTHO-C3-036"]},{"id":"ORTHO-U3-06","ch":3,"n":6,"title":"Stability & Rail Fixator","sec":"Fixators · p17","guide":"Stability grows with more pins, more rods, more planes — biplanar beats uniplanar. The Rail (limb reconstruction) system slides adjustable rods that squeeze and hold.","qs":["ORTHO-C3-037","ORTHO-C3-038","ORTHO-C3-039","ORTHO-C3-040","ORTHO-C3-041","ORTHO-C3-042"]},{"id":"ORTHO-U3-07","ch":3,"n":7,"title":"Ilizarov & Distraction","sec":"Fixators · p17","guide":"Ilizarov's rings are multiplanar and mightiest — squeeze or stretch at will, pins in any direction. Stretching bone across a gap (distraction osteogenesis) fills losses, straightens deformity, lengthens limbs.","qs":["ORTHO-C3-043","ORTHO-C3-044","ORTHO-C3-045","ORTHO-C3-046","ORTHO-C3-047","ORTHO-C3-048"]},{"id":"ORTHO-U3-08","ch":3,"n":8,"title":"Callotasis & Spanning Fixator","sec":"Distraction & Definitions · p18","guide":"Cut the cortex, then stretch 1 mm a day: callus stretches into new bone (callotasis). Around shattered joints, spanning frames bridge femur to tibia — think side-swipe and baby-car injuries.","qs":["ORTHO-C3-049","ORTHO-C3-050","ORTHO-C3-051","ORTHO-C3-052","ORTHO-C3-053","ORTHO-C3-054","ORTHO-C3-055","ORTHO-C3-056"]},{"id":"ORTHO-U3-09","ch":3,"n":9,"title":"Pin Sequelae & Amputation Defined","sec":"Distraction & Definitions · p18","guide":"Pins can cook bone into ring sequestra. Compartments can choke in high- or low-energy breaks, even open ones — distrust every drowsy patient. Amputation cuts through bone; disarticulation through joint.","qs":["ORTHO-C3-057","ORTHO-C3-058","ORTHO-C3-059","ORTHO-C3-060","ORTHO-C3-061","ORTHO-C3-062","ORTHO-C3-063"]},{"id":"ORTHO-U3-10","ch":3,"n":10,"title":"Indications & MESS","sec":"Amputation Basics · p19","guide":"Dead, dangerous or dumb limbs go: crush, PVD, frostbite, gas, tumour, missing limbs, polio. MESS 7+ amputates — velocity, ischemia time (king), shock, age — with limb-salvage and Ganga scores as backup.","qs":["ORTHO-C3-064","ORTHO-C3-065","ORTHO-C3-066","ORTHO-C3-067","ORTHO-C3-068","ORTHO-C3-069","ORTHO-C3-070","ORTHO-C3-071","ORTHO-C3-072","ORTHO-C3-073"]},{"id":"ORTHO-U3-11","ch":3,"n":11,"title":"Amputation Types & Principles","sec":"Amputation Basics · p19","guide":"Clean stumps close at once; infected or ischemic ones stay open (guillotine) for a second sitting. Bleed less with a tourniquet — unless ischemia caused it all. Cut bone 5 cm short, tie every vessel twice.","qs":["ORTHO-C3-074","ORTHO-C3-075","ORTHO-C3-076","ORTHO-C3-077","ORTHO-C3-078","ORTHO-C3-079","ORTHO-C3-080","ORTHO-C3-081"]},{"id":"ORTHO-U3-12","ch":3,"n":12,"title":"Closure & Skin Flaps","sec":"Closure & Levels · p20–21","guide":"Sew muscle to bone (myodesis) for a sturdy stump — except in PVD, where muscle-to-muscle (myoplasty) survives better. Skew the flaps: posterior long, scar forward, prosthesis happy.","qs":["ORTHO-C3-082","ORTHO-C3-083","ORTHO-C3-084","ORTHO-C3-085","ORTHO-C3-086","ORTHO-C3-087","ORTHO-C3-088","ORTHO-C3-089","ORTHO-C3-090","ORTHO-C3-091","ORTHO-C3-092","ORTHO-C3-093"]},{"id":"ORTHO-U3-13","ch":3,"n":13,"title":"Upper Limb Levels & Krukenberg","sec":"Closure & Levels · p20–21","guide":"Arm levels run shoulder, midarm (transhumeral), elbow, midforearm (transradial), wrist, rays — forequarter takes the girdle. The blind gain pincers when radius and ulna split: Krukenberg.","qs":["ORTHO-C3-094","ORTHO-C3-095","ORTHO-C3-096","ORTHO-C3-097","ORTHO-C3-098","ORTHO-C3-099","ORTHO-C3-100"]},{"id":"ORTHO-U3-14","ch":3,"n":14,"title":"Lower Limb & Foot Amputations","sec":"Closure & Levels · p20–21","guide":"Leg levels: hemipelvectomy, hip, above-knee (transfemoral), knee, below-knee (commonest), transmetatarsal, ray, toe. Gritti-Stokes caps femur with patella. In the foot: Syme's, Chopart (intertarsal), Lisfranc (tarsometatarsal).","qs":["ORTHO-C3-101","ORTHO-C3-102","ORTHO-C3-103","ORTHO-C3-104","ORTHO-C3-105","ORTHO-C3-106","ORTHO-C3-107","ORTHO-C3-108","ORTHO-C3-109","ORTHO-C3-110"]},{"id":"ORTHO-U3-15","ch":3,"n":15,"title":"Neuroma, Phantom & Stump Woes","sec":"Stump Trouble · p21","guide":"Cut nerves loose and they ball into painful neuromas — excise them, or buzz with TENS. Phantoms haunt half to most amputees, melting distal-to-proximal. Stitch tight and flaps die.","qs":["ORTHO-C3-111","ORTHO-C3-112","ORTHO-C3-113","ORTHO-C3-114","ORTHO-C3-115","ORTHO-C3-116","ORTHO-C3-117","ORTHO-C3-118","ORTHO-C3-119"]},{"id":"ORTHO-U3-16","ch":3,"n":16,"title":"Prosthesis, Orthosis & Parts","sec":"Prosthetics · p22","guide":"Prostheses replace anatomy (a new leg); orthoses support it (a cock-up splint). Every limb has a socket for the stump, rods, a knee where rod meets device, and the terminal device itself.","qs":["ORTHO-C3-120","ORTHO-C3-121","ORTHO-C3-122","ORTHO-C3-123","ORTHO-C3-124","ORTHO-C3-125"]},{"id":"ORTHO-U3-17","ch":3,"n":17,"title":"Jaipur vs SACH","sec":"Prosthetics · p22","guide":"Jaipur feet look real, bend, squat, walk barefoot on rough ground, and cost little — SACH feet are rigid, restricted, and dear. Wood, rubber core, vulcanized skin versus a solid block.","qs":["ORTHO-C3-126","ORTHO-C3-127","ORTHO-C3-128","ORTHO-C3-129","ORTHO-C3-130","ORTHO-C3-131","ORTHO-C3-132","ORTHO-C3-133","ORTHO-C3-134","ORTHO-C3-135","ORTHO-C3-136","ORTHO-C3-137"]},{"id":"ORTHO-U3-18","ch":3,"n":18,"title":"Amputations in Children","sec":"Prosthetics · p22","guide":"In children, hoard every millimetre of bone and disarticulate rather than cut — the growth plate stays safe. Stumps need redoing as they grow, but kids master prostheses fast.","qs":["ORTHO-C3-138","ORTHO-C3-139","ORTHO-C3-140","ORTHO-C3-141"]},{"id":"ORTHO-U3-19","ch":3,"n":19,"title":"Reimplant Transport","sec":"Reimplant & ATLS · p23","guide":"Replant only clean, low-MESS parts. Rinse in saline, swaddle in wet gauze, seal in plastic, nest in ice (buys 12–24 hours), box it.","qs":["ORTHO-C3-142","ORTHO-C3-143","ORTHO-C3-144","ORTHO-C3-145","ORTHO-C3-146","ORTHO-C3-147","ORTHO-C3-148"]},{"id":"ORTHO-U3-20","ch":3,"n":20,"title":"BB FAN Order","sec":"Reimplant & ATLS · p23","guide":"BB FAN of Virender Sehwag: Bone, Back (extensor) tendons, Front (flexor) tendons, Artery, Nerve, Vein, Skin. Bone first, skin last.","qs":["ORTHO-C3-149","ORTHO-C3-150","ORTHO-C3-151","ORTHO-C3-152","ORTHO-C3-153","ORTHO-C3-154","ORTHO-C3-155"]},{"id":"ORTHO-U3-21","ch":3,"n":21,"title":"ATLS","sec":"Reimplant & ATLS · p23","guide":"ATLS hunts life-then-limb threats in the golden hour: Airway (jaw thrust, spine still), Breathing, Circulation (stop the bleed), Disability (brain), Exposure (strip and warm).","qs":["ORTHO-C3-156","ORTHO-C3-157","ORTHO-C3-158","ORTHO-C3-159","ORTHO-C3-160","ORTHO-C3-161","ORTHO-C3-162"]},{"id":"ORTHO-U3-22","ch":3,"n":22,"title":"Collar & Pelvic Bleeding","sec":"Reimplant & ATLS · p23","guide":"Philadelphia collars freeze the neck. Pelvises can hide two litres of blood — squeeze with binders, hands or sheets, pour RL over NS, then frame the pelvis.","qs":["ORTHO-C3-163","ORTHO-C3-164","ORTHO-C3-165","ORTHO-C3-166","ORTHO-C3-167"]},{"id":"ORTHO-U3-23","ch":3,"n":23,"title":"Damage Control Orthopaedics","sec":"DCO & Crush · p24","guide":"Damage control: do little, save life. Unstable, cold, acidotic, coagulopathic, fat-embolized patients get a quick frame, an ICU tune-up, and definitive surgery later.","qs":["ORTHO-C3-168","ORTHO-C3-169","ORTHO-C3-170","ORTHO-C3-171","ORTHO-C3-172","ORTHO-C3-173","ORTHO-C3-174","ORTHO-C3-175"]},{"id":"ORTHO-U3-24","ch":3,"n":24,"title":"Crush Syndrome","sec":"DCO & Crush · p24","guide":"Crush: squeeze long, starve muscle, then release a flood of toxins — kidneys clog with myoglobin, acids and potassium rise, calcium falls. Flood with fluids, alkalinize the urine.","qs":["ORTHO-C3-176","ORTHO-C3-177","ORTHO-C3-178","ORTHO-C3-179","ORTHO-C3-180","ORTHO-C3-181","ORTHO-C3-182","ORTHO-C3-183","ORTHO-C3-184"]},{"id":"ORTHO-U4-01","ch":4,"n":1,"title":"Intro & Homeostasis Engine","sec":"Calcium Command · p25","guide":"Metabolic bone disease weakens bone into painful micro-fractures and pathological breaks. Calcium is ruled by PTH and vitamin D: low calcium fires PTH, kidneys activate vitamin D, gut drinks up calcium and phosphate.","qs":["ORTHO-C4-001","ORTHO-C4-002","ORTHO-C4-003","ORTHO-C4-004","ORTHO-C4-005","ORTHO-C4-006","ORTHO-C4-007","ORTHO-C4-008","ORTHO-C4-009","ORTHO-C4-010","ORTHO-C4-011"]},{"id":"ORTHO-U4-02","ch":4,"n":2,"title":"PTH Action, Labs & Denosumab","sec":"Calcium Command · p25","guide":"PTH makes kidneys keep calcium and spill phosphate, and orders osteoblasts to flash RANKL — osteoclasts resorb, ALP climbs. Denosumab silences RANKL. Primary HPT is an adenoma that ignores all feedback.","qs":["ORTHO-C4-012","ORTHO-C4-013","ORTHO-C4-014","ORTHO-C4-015","ORTHO-C4-016","ORTHO-C4-017","ORTHO-C4-018","ORTHO-C4-019","ORTHO-C4-020","ORTHO-C4-021","ORTHO-C4-022"]},{"id":"ORTHO-U4-03","ch":4,"n":3,"title":"Renal Failure & the Lab Table","sec":"Kidneys & Maps · p26","guide":"Dead kidneys can't activate vitamin D: calcium crashes, PTH soars, bones sprout mixed lesions — renal osteodystrophy. Labs tell the tale: renal keeps phosphate high, vitamin-D lack drops it.","qs":["ORTHO-C4-023","ORTHO-C4-024","ORTHO-C4-025","ORTHO-C4-026","ORTHO-C4-027","ORTHO-C4-028","ORTHO-C4-029","ORTHO-C4-030","ORTHO-C4-031"]},{"id":"ORTHO-U4-04","ch":4,"n":4,"title":"Overview Map of Bone Disease","sec":"Kidneys & Maps · p26","guide":"The grand map: mineral faults (HPT, rickets, osteomalacia) scramble calcium labs; collagen faults breed brittle bones and scurvy; cell faults swing Paget's and petrosis with lonely high ALP; osteoporosis hides with normal labs.","qs":["ORTHO-C4-032","ORTHO-C4-033","ORTHO-C4-034","ORTHO-C4-035","ORTHO-C4-036","ORTHO-C4-037","ORTHO-C4-038"]},{"id":"ORTHO-U4-05","ch":4,"n":5,"title":"Rickets Causes & Labs","sec":"Rickets Clinic · p27","guide":"Rickets is vitamin-D starvation — usually just poor diet — plus gut, sun, liver, kidney, drug and mineral causes. Labs: calcium lowish, phosphate low, PTH and ALP high.","qs":["ORTHO-C4-039","ORTHO-C4-040","ORTHO-C4-041","ORTHO-C4-042","ORTHO-C4-043","ORTHO-C4-044"]},{"id":"ORTHO-U4-06","ch":4,"n":6,"title":"Skull, Rosary & Chest","sec":"Rickets Clinic · p27","guide":"Skull softens first (craniotabes), forehead bosses, fontanelles linger, sutures gape. Ribs bead bluntly at the cartilage (rachitic rosary), sternum juts (pigeon), diaphragm dents soft ribs (Harrison).","qs":["ORTHO-C4-045","ORTHO-C4-046","ORTHO-C4-047","ORTHO-C4-048","ORTHO-C4-049","ORTHO-C4-050","ORTHO-C4-051","ORTHO-C4-052"]},{"id":"ORTHO-U4-07","ch":4,"n":7,"title":"Limbs, Photos & Scorbutic Note","sec":"Rickets Clinic · p27","guide":"Legs bend only after standing — never in infants. Bow legs lead, knock knees follow, windswept mixes both. Scorbutic beads differ: they bleed and hurt.","qs":["ORTHO-C4-053","ORTHO-C4-054","ORTHO-C4-055","ORTHO-C4-056","ORTHO-C4-057","ORTHO-C4-058","ORTHO-C4-059"]},{"id":"ORTHO-U4-08","ch":4,"n":8,"title":"Varus vs Valgus","sec":"Bends & X-rays · p28","guide":"Varus hugs the midline, valgus flees it — at elbow (cubitus), hip (coxa), knee (genu). Bow legs versus knock knees: name every bend by joint and direction.","qs":["ORTHO-C4-060","ORTHO-C4-061","ORTHO-C4-062","ORTHO-C4-063","ORTHO-C4-064","ORTHO-C4-065","ORTHO-C4-066"]},{"id":"ORTHO-U4-09","ch":4,"n":9,"title":"Deformity Table, Age & Hips","sec":"Bends & X-rays · p28","guide":"Children: rickets bows, idiopathy knocks, rickets windsweeps. Adults: arthritis rules both, RA windsweeps. Bow legs past age two mean rickets. Hips: vara under 130, valga over 135.","qs":["ORTHO-C4-067","ORTHO-C4-068","ORTHO-C4-069","ORTHO-C4-070","ORTHO-C4-071","ORTHO-C4-072","ORTHO-C4-073","ORTHO-C4-074","ORTHO-C4-075"]},{"id":"ORTHO-U4-10","ch":4,"n":10,"title":"Rickets X-ray & Healing","sec":"Bends & X-rays · p28","guide":"Rickets X-rays cup, splay, widen and fray at the growth plate. Healing is watched by film plus ALP: calcium steadies, PTH and ALP fall, phosphate climbs, Frenkel's white line seals the plate.","qs":["ORTHO-C4-076","ORTHO-C4-077","ORTHO-C4-078","ORTHO-C4-079","ORTHO-C4-080","ORTHO-C4-081","ORTHO-C4-082"]},{"id":"ORTHO-U4-11","ch":4,"n":11,"title":"Rickets Rx & Osteomalacia Face","sec":"Soft Adult Bones · p29","guide":"Young bones straighten with treatment; older ones need osteotomy once active. Adult twin osteomalacia loves young women: aching joints, sore bones, weak thighs — and milkman cracks.","qs":["ORTHO-C4-083","ORTHO-C4-084","ORTHO-C4-085","ORTHO-C4-086","ORTHO-C4-087","ORTHO-C4-088","ORTHO-C4-089","ORTHO-C4-090"]},{"id":"ORTHO-U4-12","ch":4,"n":12,"title":"Protrusio, Pelvis & Looser DD","sec":"Soft Adult Bones · p29","guide":"Osteomalacia cracks into Looser's zones — femoral neck, clavicle, ribs, scapula, pubic rami — transverse pale bands. Hips protrude, femora bottle, pelvises turn triradiate and trefoil. Biopsy proves.","qs":["ORTHO-C4-091","ORTHO-C4-092","ORTHO-C4-093","ORTHO-C4-094","ORTHO-C4-095","ORTHO-C4-096"]},{"id":"ORTHO-U4-13","ch":4,"n":13,"title":"Doses, Tumours & Scanogram","sec":"Doses & Scurvy · p30","guide":"Blast vitamin D (Stoss lakhs at once), drip it daily, or pulse it weekly. Tumours can mimic it all; scanograms map leg deformity full-length.","qs":["ORTHO-C4-097","ORTHO-C4-098","ORTHO-C4-099","ORTHO-C4-100","ORTHO-C4-101","ORTHO-C4-102"]},{"id":"ORTHO-U4-14","ch":4,"n":14,"title":"Scurvy Bones & Bleeds","sec":"Doses & Scurvy · p30","guide":"No vitamin C, no mature collagen: cortices pencil-thin over ground glass, metaphyses line (Frenkel), zone (scorbutic) and spur (Pelkan), epiphyses ring (Wimberger). Gums bleed, knees ache bilaterally.","qs":["ORTHO-C4-103","ORTHO-C4-104","ORTHO-C4-105","ORTHO-C4-106","ORTHO-C4-107","ORTHO-C4-108"]},{"id":"ORTHO-U4-15","ch":4,"n":15,"title":"Scurvy Rx, Barton & HPT Types","sec":"Parathyroid Power · p31","guide":"Vitamin C cures scurvy; Barton blends C and D lack. Primary HPT fires PTH regardless — usually an adenoma to excise. Secondary answers hypocalcemia, D lack, renal or liver failure.","qs":["ORTHO-C4-109","ORTHO-C4-110","ORTHO-C4-111","ORTHO-C4-112","ORTHO-C4-113","ORTHO-C4-114"]},{"id":"ORTHO-U4-16","ch":4,"n":16,"title":"HPT Bones: Skull to Brown Tumour","sec":"Parathyroid Power · p31","guide":"PTH dissolves bone: skull peppers, teeth lose lamina dura, fingers resorb radially, brown tumours (osteitis fibrosa cystica) fill with blood-born hemosiderin.","qs":["ORTHO-C4-115","ORTHO-C4-116","ORTHO-C4-117","ORTHO-C4-118","ORTHO-C4-119"]},{"id":"ORTHO-U4-17","ch":4,"n":17,"title":"Hypercalcemia & Rugger Jersey","sec":"Parathyroid Power · p31","guide":"High calcium: painful bones, kidney stones, belly groans, mad mind (lazy, foggy, blue, mad). Renal bones stripe into Rugger Jersey spines.","qs":["ORTHO-C4-120","ORTHO-C4-121","ORTHO-C4-122","ORTHO-C4-123","ORTHO-C4-124"]},{"id":"ORTHO-U4-18","ch":4,"n":18,"title":"Osteoporosis Roots & Risks","sec":"Thin Bones · p32–33","guide":"Osteoporosis: good bone, too little of it. Menopause risks most, age causes most; steroids, heparin, Cushing's, stillness, space and RA join in. Bones peak at thirty, estrogen guards them.","qs":["ORTHO-C4-125","ORTHO-C4-126","ORTHO-C4-127","ORTHO-C4-128","ORTHO-C4-129","ORTHO-C4-130","ORTHO-C4-131","ORTHO-C4-132"]},{"id":"ORTHO-U4-19","ch":4,"n":19,"title":"Pathogenesis, Pain & Kyphosis","sec":"Thin Bones · p32–33","guide":"Ageing tips formation below resorption: strength sinks, micro-cracks spread. Back aches first, fragility fractures (spine, hip, wrist) complicate most, spines bow into kyphosis.","qs":["ORTHO-C4-133","ORTHO-C4-134","ORTHO-C4-135","ORTHO-C4-136","ORTHO-C4-137","ORTHO-C4-138","ORTHO-C4-139","ORTHO-C4-140"]},{"id":"ORTHO-U4-20","ch":4,"n":20,"title":"Labs, X-rays & Screening","sec":"Thin Bones · p32–33","guide":"Labs stay normal; films betray only after 30% vanishes — wedged, cod-fished, hip-snapped, wrist-cracked. Screen women past 65, men past 70, fractures past 50.","qs":["ORTHO-C4-141","ORTHO-C4-142","ORTHO-C4-143","ORTHO-C4-144","ORTHO-C4-145","ORTHO-C4-146","ORTHO-C4-147","ORTHO-C4-148"]},{"id":"ORTHO-U4-21","ch":4,"n":21,"title":"DEXA & T-scores","sec":"Measuring & Mending · p34–35","guide":"DEXA rules diagnosis — spine first, then hip and heel. T-scores grade against thirty-year-old peaks: −1 normal, −2.5 thin (osteopenia), beyond −2.5 porous, plus fracture severe.","qs":["ORTHO-C4-149","ORTHO-C4-150","ORTHO-C4-151","ORTHO-C4-152","ORTHO-C4-153","ORTHO-C4-154","ORTHO-C4-155"]},{"id":"ORTHO-U4-22","ch":4,"n":22,"title":"Anti-resorptives & Holidays","sec":"Measuring & Mending · p34–35","guide":"Bisphosphonates (rise-, iban-, zoledronate) gag osteoclasts — first-line, but years of silence snap hi
