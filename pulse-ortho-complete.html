<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE · Orthopaedics — Marrow Edition 8 Companion</title>
<style>
  :root{
    --bg:#120d1a; --card:#221a30; --card2:#2b2139; --line:#3a2d52;
    --txt:#f4eefb; --mut:#a89bbd; --pink:#e0607e; --gold:#c99a4b;
    --teal:#5fd0b5; --good:#3ddc84; --bad:#ff5d6c; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 60px;}
  header.top{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    padding:14px 16px; background:#120d1af2; border-bottom:1px solid var(--line); max-width:560px; margin:0 auto;}
  header.top .brand{font-weight:800; font-size:20px; letter-spacing:.3px; flex:1;}
  header.top .back{font-size:22px; cursor:pointer; color:var(--mut); padding:2px 8px 2px 0;}
  .hstat{font-weight:800; font-size:15px; white-space:nowrap;}
  .hidden{display:none !important;}
  .hero{background:linear-gradient(160deg,#3a2547,#221a30 70%); border:1px solid var(--line);
    border-radius:22px; padding:26px 22px; margin:16px 0;}
  .hero .kick{font-size:12px; letter-spacing:2.5px; color:var(--mut);}
  .hero h1{font-family:var(--serif); font-size:42px; margin:8px 0 10px; line-height:1.05;}
  .hero p{color:#cbbfe0; font-size:15px; line-height:1.55; margin:0 0 12px;}
  .hero a{color:var(--pink); font-weight:700; text-decoration:none; font-size:15px; cursor:pointer;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px; text-align:center;}
  .stat b{font-size:22px; display:block;} .stat span{font-size:12px; color:var(--mut);}
  .btn{display:block; width:100%; margin-top:12px; padding:15px; font-size:16px; font-weight:700;
    color:#1a0f14; background:linear-gradient(135deg,#f0788f,var(--pink)); border:0; border-radius:14px; cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--txt); border:1.5px solid var(--line);}
  .btn.gold{background:linear-gradient(135deg,#e0b45f,var(--gold)); color:#1d1405;}
  h2.page{font-family:var(--serif); font-size:30px; margin:18px 0 2px;}
  p.sub{color:var(--mut); margin:0 0 14px; font-size:14px;}
  .chrow{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px; margin:10px 0; cursor:pointer;}
  .chrow.locked{opacity:.45; cursor:default;}
  .chnum{min-width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    font-weight:800; font-size:17px; background:linear-gradient(135deg,#d96a84,#b34a62); color:#fff;}
  .chrow.locked .chnum{background:#3a2f4d; color:var(--mut);}
  .chrow .t{flex:1; font-weight:700; font-size:15.5px; line-height:1.35;}
  .chrow .u{font-size:12.5px; color:var(--teal); white-space:nowrap; font-weight:700;}
  .chrow.locked .u{color:var(--mut);}
  .pathsec{text-align:center; color:var(--mut); font-size:12px; letter-spacing:2.5px; margin:26px 0 6px;
    display:flex; align-items:center; gap:10px;}
  .pathsec::before,.pathsec::after{content:""; flex:1; height:1px; background:var(--line);}
  .node{display:flex; flex-direction:column; align-items:center; position:relative; padding:10px 0 4px;}
  .node:not(:last-child)::after{content:""; width:3px; height:26px; margin-top:10px; border-radius:2px;
    background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px);}
  .ball{width:86px; height:86px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; font-weight:800; cursor:pointer; border:4px solid transparent;}
  .ball.done{background:#1d3a2a; border-color:var(--good); color:var(--good); font-size:32px;}
  .ball.current{background:radial-gradient(circle at 35% 30%,#e0b45f,var(--gold) 70%);
    color:#fff; box-shadow:0 0 0 6px #c99a4b33, 0 8px 24px #c99a4b55; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 6px #c99a4b33;}50%{box-shadow:0 0 0 11px #c99a4b22;}}
  .ball.locked{background:#241c33; border-color:#171224; color:#6f6386; cursor:default; font-size:30px;}
  .ntitle{margin-top:8px; font-weight:700; font-size:14.5px; text-align:center; max-width:230px; line-height:1.35;}
  .ncount{font-size:12px; color:var(--mut); margin-top:2px;}
  .guide{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-top:16px;}
  .guide .kick{font-size:12px; letter-spacing:2px; color:var(--gold); font-weight:800;}
  .guide h2{font-family:var(--serif); font-size:26px; margin:8px 0 10px; line-height:1.25;}
  .guide p{color:#d8cde9; line-height:1.65; font-size:15.5px;}
  .qbar{height:10px; background:var(--card2); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:16px 0 14px;}
  .qbar i{display:block; height:100%; width:0; background:var(--pink); transition:width .3s;}
  .qcount{font-size:12px; letter-spacing:2px; color:var(--mut); font-weight:700;}
  .qtag{display:inline-block; font-size:11.5px; color:var(--teal); border:1px solid #5fd0b555;
    border-radius:999px; padding:3px 10px; margin-top:8px;}
  .qtext{font-family:var(--serif); font-size:25px; line-height:1.35; margin:10px 0 16px;}
  .opt{display:block; width:100%; text-align:left; margin:10px 0; padding:16px; font-size:16px;
    color:var(--txt); background:var(--card); border:1.5px solid var(--line); border-radius:16px; cursor:pointer; line-height:1.4;}
  .opt:not(:disabled):active{border-color:var(--pink);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good); background:#3ddc841c;}
  .opt.wrong{border-color:var(--bad); background:#ff5d6c1c;}
  .fb{margin-top:12px; padding:14px 15px; border-radius:14px; font-size:14.5px; line-height:1.6; display:none;}
  .fb.show{display:block;}
  .fb.good{background:#3ddc8412; border:1px solid #3ddc8466;}
  .fb.bad{background:#ff5d6c12; border:1px solid #ff5d6c66;}
  .donebox{text-align:center; padding:30px 10px;}
  .donebox .big{font-size:64px;}
  .donebox h2{font-family:var(--serif); font-size:30px; margin:10px 0 4px;}
  .rev{margin:8px 0; padding:11px 13px; border:1px solid var(--line); border-radius:12px;
    font-size:13.5px; background:var(--card); line-height:1.5; text-align:left;}
  .rev b{color:var(--good);}
  footer{text-align:center; color:var(--mut); font-size:12px; margin-top:22px; line-height:1.7;}
  .float{position:fixed; font-weight:800; pointer-events:none; animation:rise 1s ease-out forwards; z-index:50;}
  @keyframes rise{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-46px);}}
</style>
</head>
<body>
<header class="top">
  <span class="back hidden" id="backBtn" onclick="goBack()">‹</span>
  <span class="brand" id="brand">PULSE</span>
  <span class="hstat">🔥 <span id="hStreak">0</span></span>
  <span class="hstat">✦ <span id="hXP">0</span></span>
</header>
<div class="wrap">

  <!-- HOME -->
  <div id="home">
    <div class="hero">
      <div class="kick">MARROW EDITION 8 · COMPANION</div>
      <h1>Orthopaedics</h1>
      <p id="heroSub"></p>
      <a onclick="show('chapters')">Browse chapters →</a>
    </div>
    <div class="stats">
      <div class="stat"><b id="sXP">0</b><span>Total XP</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
      <div class="stat"><b id="sUnits">0</b><span>Units done</span></div>
    </div>
    <button class="btn ghost" onclick="unlockAll()">🔓 Unlock all units (testing)</button>
    <button class="btn" onclick="continueLearning()">▶ Continue learning</button>
  </div>

  <!-- CHAPTERS -->
  <div id="chapters" class="hidden">
    <h2 class="page">Chapters</h2>
    <p class="sub" id="chSub"></p>
    <div id="chList"></div>
  </div>

  <!-- PATH -->
  <div id="path" class="hidden">
    <p class="sub" id="pathKick" style="margin-top:16px;"></p>
    <h2 class="page" id="pathTitle" style="margin-top:0;"></h2>
    <p class="sub" id="pathSub"></p>
    <div id="nodes"></div>
  </div>

  <!-- GUIDE -->
  <div id="guide" class="hidden">
    <div class="guide">
      <div class="kick" id="gKick"></div>
      <h2 id="gTitle"></h2>
      <p id="gText"></p>
      <p class="sub" id="gCount"></p>
      <button class="btn gold" onclick="beginUnit()">Start unit →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="qbar"><i id="qbar"></i></div>
    <div class="qcount" id="qcount"></div>
    <div><span class="qtag" id="qtag"></span></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hidden" id="nextBtn" onclick="nextQ()">Continue →</button>
  </div>

  <!-- UNIT DONE -->
  <div id="unitdone" class="hidden">
    <div class="donebox">
      <div class="big">🎉</div>
      <h2>Unit complete!</h2>
      <p class="sub" id="dSub"></p>
      <div class="stats">
        <div class="stat"><b id="dScore">–</b><span>Score</span></div>
        <div class="stat"><b id="dXP">–</b><span>XP earned</span></div>
        <div class="stat"><b id="dAcc">–</b><span>Accuracy</span></div>
      </div>
      <div id="dRev"></div>
      <button class="btn" onclick="afterUnit()">Continue →</button>
      <button class="btn ghost" onclick="openGuide(curUnit)">↻ Redo unit</button>
    </div>
  </div>

  <footer>PULSE · Orthopaedics · question order follows the book line-by-line<br>options shuffled every run · progress saved on this device</footer>
</div>

<script>
const QUESTIONS = [{"id":"ORTHO-C1-001","sec":"Bone composition","page":1,"q":"As an osteon, bone is built from which three components?","opts":["Organic matrix (osteoid), water and inorganic mineral","Collagen, elastin and reticulin","Calcium, phosphorus and magnesium","Cells, vessels and nerves"],"ans":0,"exp":"Bone (osteon) = organic component/osteoid + water + inorganic component. (Book p1)"},{"id":"ORTHO-C1-002","sec":"Bone composition","page":1,"q":"The organic component of bone is also known as:","opts":["Callus","Nidus","Hydroxyapatite","Osteoid"],"ans":3,"exp":"Organic component = osteoid. (Book p1)"},{"id":"ORTHO-C1-003","sec":"Bone composition","page":1,"q":"Compared with adults, the water content of bone in children is:","opts":["Same at all ages","Absent","Decreased, making bones brittle","Increased, making bones softer"],"ans":3,"exp":"Water is increased in children, so their bones are softer. (Book p1)"},{"id":"ORTHO-C1-004","sec":"Bone composition","page":1,"q":"A child's bone bends instead of snapping cleanly. As per the composition flowchart, this softness is due to:","opts":["Less collagen","Excess mineral","Thicker periosteum","Increased water content"],"ans":3,"exp":"Increased water in children → softer bones. (Book p1)"},{"id":"ORTHO-C1-005","sec":"Bone composition","page":1,"q":"The principal mineral of the inorganic component of bone is:","opts":["Calcium hydroxyapatite","Calcium oxalate","Calcium carbonate","Magnesium phosphate"],"ans":0,"exp":"Inorganic component = calcium hydroxyapatite, the principal mineral. (Book p1)"},{"id":"ORTHO-C1-006","sec":"Bone composition","page":1,"q":"The organic (osteoid) component of bone is made up of:","opts":["Cartilage and fat","Minerals and water","Cells and proteins","Vessels and nerves"],"ans":2,"exp":"Osteoid branches into cells and proteins. (Book p1)"},{"id":"ORTHO-C1-007","sec":"Bone proteins","page":1,"q":"The principal protein of bone is:","opts":["Osteocalcin","Osteonectin","Type I collagen","Type II collagen"],"ans":2,"exp":"Collagen Type I is the principal protein of bone. (Book p1)"},{"id":"ORTHO-C1-008","sec":"Bone proteins","page":1,"q":"Which trio correctly lists the proteins of the bone matrix?","opts":["Actin, myosin, tropomyosin","Collagen type I, osteocalcin, osteonectin","Collagen type II, elastin, fibrillin","Osteopontin, sialoprotein, ALP"],"ans":1,"exp":"Bone proteins = collagen Type I, osteocalcin, osteonectin. (Book p1)"},{"id":"ORTHO-C1-009","sec":"Bone proteins","page":1,"q":"Osteocalcin is best classified as:","opts":["A marrow fat","A resorption marker","A bone matrix protein","A mineral crystal"],"ans":2,"exp":"Osteocalcin is a protein of the organic matrix (also a formation marker). (Book p1)"},{"id":"ORTHO-C1-010","sec":"Bone cells","page":1,"q":"Osteoblasts are what type of cells?","opts":["Resting osteocytes","Multinucleated giant cells","Monocyte aggregates","Mononuclear cells"],"ans":3,"exp":"Osteoblast = mononuclear cells. (Book p1)"},{"id":"ORTHO-C1-011","sec":"Bone cells","page":1,"q":"The matrix laid down by osteoblasts is:","opts":["Calcified cartilage","Osteoid (collagen) matrix","Woven mineral","Hyaline matrix"],"ans":1,"exp":"Osteoblasts lay down osteoid (collagen) matrix. (Book p1)"},{"id":"ORTHO-C1-012","sec":"Bone cells","page":1,"q":"Mineral deposition on the osteoid laid by osteoblasts results in:","opts":["Periosteum","Physis","Bone / osteon","Marrow"],"ans":2,"exp":"Osteoid + mineral deposition → bone/osteon. (Book p1)"},{"id":"ORTHO-C1-013","sec":"Bone cells","page":1,"q":"Osteoblasts are rich in:","opts":["Acid phosphatase","Alkaline phosphatase (ALP)","TRAP","Carbonic anhydrase"],"ans":1,"exp":"Osteoblasts are rich in alkaline phosphatase. (Book p1)"},{"id":"ORTHO-C1-014","sec":"Bone cells","page":1,"q":"Osteoclasts develop from:","opts":["Fibroblast cords","Monocyte aggregates","Osteocyte clusters","Endothelial buds"],"ans":1,"exp":"Osteoclast = monocyte aggregates. (Book p1)"},{"id":"ORTHO-C1-015","sec":"Bone cells","page":1,"q":"Histologically, osteoclasts appear as:","opts":["Flat lining cells","Tall columnar cells","Small spindle cells","Multinucleated giant cells"],"ans":3,"exp":"Osteoclasts are multinucleated giant cells. (Book p1)"},{"id":"ORTHO-C1-016","sec":"Bone cells","page":1,"q":"Which function pair belongs to the osteoclast?","opts":["Lays osteoid; mineralises matrix","Secretes collagen; stores fat","Lines lacunae; senses load","Phagocytic; bone resorption and remodelling"],"ans":3,"exp":"Osteoclasts are phagocytic and carry out resorption and remodelling. (Book p1)"},{"id":"ORTHO-C1-017","sec":"Bone cells","page":1,"q":"Osteoclasts are rich in:","opts":["TRAP and carbonic anhydrase","ALP and procollagen","Osteocalcin and osteonectin","Hydroxyproline and hydroxylysine"],"ans":0,"exp":"Osteoclasts are rich in TRAP and carbonic anhydrase. (Book p1)"},{"id":"ORTHO-C1-018","sec":"Bone cells","page":1,"q":"In the bone-cell diagram, the cell with ruffled borders is the:","opts":["Osteoclast","Osteoblast","Osteocyte","Lining cell"],"ans":0,"exp":"The ruffled-border cell illustrated is the osteoclast. (Book p1)"},{"id":"ORTHO-C1-019","sec":"Bone cells","page":1,"q":"An osteocyte is best described as a:","opts":["Calcified fibroblast","Mature / resting osteoblast","Fused monocyte","Marrow stromal cell"],"ans":1,"exp":"Osteocyte = mature/resting osteoblast. (Book p1)"},{"id":"ORTHO-C1-020","sec":"Bone cells","page":1,"q":"The most abundant cell in bone is the:","opts":["Osteocyte","Osteoclast","Chondrocyte","Osteoblast"],"ans":0,"exp":"Osteocytes are the most abundant bone cells. (Book p1)"},{"id":"ORTHO-C1-021","sec":"Bone cells","page":1,"q":"Which bone cell has the longest life span?","opts":["Osteocyte","Osteoprogenitor","Osteoblast","Osteoclast"],"ans":0,"exp":"Osteocytes have the longest life span. (Book p1)"},{"id":"ORTHO-C1-022","sec":"Bone cells","page":1,"q":"As per the note on book page 1, the strength of bone depends on:","opts":["Osteoblasts and osteoclasts","Periosteum and marrow","Vessels and nerves","Water and fat content"],"ans":0,"exp":"Strength of bone depends on osteoblasts and osteoclasts. (Book p1)"},{"id":"ORTHO-C1-023","sec":"Collagen types","page":1,"q":"Bone (osteon) contains which collagen type?","opts":["Type 2","Type 3","Type 4","Type 1"],"ans":3,"exp":"Bones contain Type 1 collagen. (Book p1)"},{"id":"ORTHO-C1-024","sec":"Collagen types","page":1,"q":"The meniscus contains which collagen type?","opts":["Type 11","Type 2","Type 1","Type 9"],"ans":2,"exp":"Meniscus = Type 1 collagen. (Book p1)"},{"id":"ORTHO-C1-025","sec":"Collagen types","page":1,"q":"The annulus fibrosis contains which collagen type?","opts":["Type 5","Type 2","Type 3","Type 1"],"ans":3,"exp":"Annulus fibrosis = Type 1 collagen. (Book p1)"},{"id":"ORTHO-C1-026","sec":"Collagen types","page":1,"q":"Articular hyaline cartilage contains which collagen type?","opts":["Type 3","Type 4","Type 2","Type 1"],"ans":2,"exp":"Articular hyaline cartilage = Type 2 collagen. (Book p1)"},{"id":"ORTHO-C1-027","sec":"Collagen types","page":1,"q":"The nucleus pulposus contains which collagen type?","opts":["Type 1","Type 2","Type 5","Type 7"],"ans":1,"exp":"Nucleus pulposus = Type 2 collagen. (Book p1)"},{"id":"ORTHO-C1-028","sec":"Collagen types","page":1,"q":"Which of the following is a Type 2 collagen site?","opts":["Nucleus pulposus","Bone","Meniscus","Annulus fibrosis"],"ans":0,"exp":"Type 2 sites = articular hyaline cartilage and nucleus pulposus. (Book p1)"},{"id":"ORTHO-C1-029","sec":"Bone markers","page":2,"q":"Which of the following is a bone FORMATION marker?","opts":["Alkaline phosphatase (ALP)","Hydroxyproline","TRAP","NRC telopeptide"],"ans":0,"exp":"ALP is a formation marker; the rest are resorption markers. (Book p2)"},{"id":"ORTHO-C1-030","sec":"Bone markers","page":2,"q":"Procollagen I in serum reflects:","opts":["Bone resorption","Marrow fat","Cartilage wear","Bone formation"],"ans":3,"exp":"Procollagen I is a bone formation marker. (Book p2)"},{"id":"ORTHO-C1-031","sec":"Bone markers","page":2,"q":"Which pair are BOTH bone formation markers?","opts":["Hydroxyproline and hydroxylysine","Osteocalcin and osteonectin","TRAP and NRC telopeptide","Hydroxylysine and TRAP"],"ans":1,"exp":"Formation markers = ALP, procollagen I, osteocalcin, osteonectin. (Book p2)"},{"id":"ORTHO-C1-032","sec":"Bone markers","page":2,"q":"Hydroxyproline is a marker of:","opts":["Periosteal growth","Bone formation","Marrow activity","Bone resorption"],"ans":3,"exp":"Hydroxyproline is a resorption marker. (Book p2)"},{"id":"ORTHO-C1-033","sec":"Bone markers","page":2,"q":"Hydroxyproline and hydroxylysine together represent:","opts":["Marrow turnover products","Mineral deposition products","Collagen breakdown products","Osteoid synthesis products"],"ans":2,"exp":"Both are collagen breakdown products of resorption. (Book p2)"},{"id":"ORTHO-C1-034","sec":"Bone markers","page":2,"q":"Which of the following is a bone RESORPTION marker?","opts":["Osteocalcin","Osteonectin","TRAP","Procollagen I"],"ans":2,"exp":"TRAP is a resorption marker. (Book p2)"},{"id":"ORTHO-C1-035","sec":"Bone markers","page":2,"q":"NRC telopeptide is a marker of:","opts":["Muscle injury","Bone formation","Bone resorption","Cartilage repair"],"ans":2,"exp":"NRC telopeptide is listed under bone resorption. (Book p2)"},{"id":"ORTHO-C1-036","sec":"Bone markers","page":2,"q":"TRAP appears in the notes in two contexts. Which pair is correct?","opts":["Matrix protein and mineral","Cartilage and marrow marker","Osteoclast-rich enzyme and resorption marker","Osteoblast-rich enzyme and formation marker"],"ans":2,"exp":"Osteoclasts are rich in TRAP, and TRAP is a resorption marker. (Book p1, p2)"},{"id":"ORTHO-C1-037","sec":"Bone markers","page":2,"q":"Which marker links osteoblast richness with the formation list?","opts":["Alkaline phosphatase (ALP)","TRAP","Hydroxylysine","NRC telopeptide"],"ans":0,"exp":"Osteoblasts are rich in ALP and ALP marks formation. (Book p1, p2)"},{"id":"ORTHO-C1-038","sec":"Bone markers","page":2,"q":"Osteocalcin appears in the notes as:","opts":["A matrix protein and a formation marker","A mineral and a resorption marker","An enzyme and a hormone","A fat and a vessel marker"],"ans":0,"exp":"Osteocalcin is a matrix protein and a formation marker. (Book p1, p2)"},{"id":"ORTHO-C1-039","sec":"Bone markers","page":2,"q":"Which one is the odd one out?","opts":["Hydroxyproline","Hydroxylysine","Procollagen I","TRAP"],"ans":2,"exp":"Procollagen I marks formation; the rest mark resorption. (Book p2)"},{"id":"ORTHO-C1-040","sec":"Bone markers","page":2,"q":"Which one is the odd one out?","opts":["Osteocalcin","Osteonectin","NRC telopeptide","ALP"],"ans":2,"exp":"NRC telopeptide marks resorption; the rest mark formation. (Book p2)"},{"id":"ORTHO-C1-041","sec":"Long bone anatomy","page":2,"q":"The correct proximal-to-distal order of long-bone regions is:","opts":["Metaphysis, epiphysis, diaphysis, epiphysis, metaphysis","Diaphysis, metaphysis, epiphysis, metaphysis, epiphysis","Epiphysis, metaphysis, diaphysis, metaphysis, epiphysis","Epiphysis, diaphysis, metaphysis, diaphysis, epiphysis"],"ans":2,"exp":"Proximal epiphysis → metaphysis → diaphysis → metaphysis → distal epiphysis. (Book p2)"},{"id":"ORTHO-C1-042","sec":"Long bone anatomy","page":2,"q":"The growth (physeal) plate is seen in:","opts":["The elderly only","Sesamoid bones","Adults only","Children"],"ans":3,"exp":"Growth/physeal plate is present in children. (Book p2)"},{"id":"ORTHO-C1-043","sec":"Long bone anatomy","page":2,"q":"In the adult bone diagram, the childhood physeal plate is represented by the:","opts":["Epiphyseal line","Articular cartilage","Nutrient foramen","Medullary vein"],"ans":0,"exp":"The diagram labels the epiphyseal line in place of the childhood plate. (Book p2)"},{"id":"ORTHO-C1-044","sec":"Long bone anatomy","page":2,"q":"Spongy (cancellous) bone in the long-bone diagram occupies the:","opts":["Nutrient foramen","Articular surface","Mid-diaphysis","Metaphyseal region"],"ans":3,"exp":"Spongy bone is shown at the metaphysis. (Book p2)"},{"id":"ORTHO-C1-045","sec":"Long bone anatomy","page":2,"q":"Red bone marrow is located in the:","opts":["Periosteal sheath","Diaphyseal medullary cavity","Metaphyseal cancellous region","Articular cartilage"],"ans":2,"exp":"Red bone marrow is labelled in the metaphyseal region. (Book p2)"},{"id":"ORTHO-C1-046","sec":"Long bone anatomy","page":2,"q":"Yellow bone marrow fills the:","opts":["Epiphyseal plate","Medullary cavity","Periosteal space","Joint cavity"],"ans":1,"exp":"Yellow bone marrow fills the medullary cavity. (Book p2)"},{"id":"ORTHO-C1-047","sec":"Long bone anatomy","page":2,"q":"Medullary cavity contents in children versus adults are:","opts":["Fat in both","Marrow in both","Marrow in children, fat in adults","Fat in children, marrow in adults"],"ans":2,"exp":"Medullary cavity: children = marrow, adults = fat. (Book p2)"},{"id":"ORTHO-C1-048","sec":"Long bone anatomy","page":2,"q":"The medullary cavity is lined by:","opts":["Epiphyseal plate","Periosteum","Endosteum","Articular cartilage"],"ans":2,"exp":"Endosteum / endosteal lining lines the cavity. (Book p2)"},{"id":"ORTHO-C1-049","sec":"Long bone anatomy","page":2,"q":"Articular cartilage covers the:","opts":["Metaphyseal flare","Epiphyseal articular surface","Nutrient foramen rim","Diaphyseal shaft"],"ans":1,"exp":"Articular cartilage caps the epiphyseal ends. (Book p2)"},{"id":"ORTHO-C1-050","sec":"Long bone anatomy","page":2,"q":"The shaft of a long bone is called the:","opts":["Physis","Epiphysis","Metaphysis","Diaphysis"],"ans":3,"exp":"The shaft between the metaphyses is the diaphysis. (Book p2)"},{"id":"ORTHO-C1-051","sec":"Periosteum","page":2,"q":"Sharpey's fibres are:","opts":["Muscle fibres inserting on diaphysis","Elastic fibres of marrow","Perforating fibres anchoring periosteum to bone","Collagen of articular cartilage"],"ans":2,"exp":"Perforating (Sharpey's) fibres anchor periosteum to bone. (Book p2)"},{"id":"ORTHO-C1-052","sec":"Periosteum","page":2,"q":"The function of the perforating fibres shown in the compact-bone diagram is to:","opts":["Anchor periosteum to bone","Drain the medullary vein","Cushion the joint","Carry the nutrient artery"],"ans":0,"exp":"They anchor periosteum to bone. (Book p2)"},{"id":"ORTHO-C1-053","sec":"Periosteum","page":2,"q":"Periosteum is present in:","opts":["Only the skull","All long bones","Only flat bones","Only sesamoid bones"],"ans":1,"exp":"Periosteum is present in all long bones. (Book p2)"},{"id":"ORTHO-C1-054","sec":"Periosteum","page":2,"q":"Periosteum is absent in:","opts":["Diaphysis and metaphysis","Articular surface of long bones and sesamoid bones","Epiphysis and physis","Cortical and cancellous bone"],"ans":1,"exp":"Absent in articular surfaces and sesamoid bones. (Book p2)"},{"id":"ORTHO-C1-055","sec":"Periosteum","page":2,"q":"The patella lacks periosteum because it is a:","opts":["Sesamoid bone","Pneumatic bone","Long bone","Flat bone"],"ans":0,"exp":"Sesamoid bones (e.g. patella) lack periosteum. (Book p2)"},{"id":"ORTHO-C1-056","sec":"Periosteum","page":2,"q":"The fibrous (outer) layer of periosteum:","opts":["Provides nutrition","Forms articular cartilage","Stores marrow fat","Helps in growth"],"ans":0,"exp":"Fibrous layer provides nutrition. (Book p2)"},{"id":"ORTHO-C1-057","sec":"Periosteum","page":2,"q":"The cellular (inner) layer of periosteum:","opts":["Anchors tendons","Helps in growth","Lines the joint","Provides nutrition"],"ans":1,"exp":"Cellular layer helps in growth. (Book p2)"},{"id":"ORTHO-C1-058","sec":"Periosteum","page":2,"q":"In the compact-bone diagram, osteocytes are shown residing in:","opts":["Lacunae","Marrow spaces","Volkmann canals","Haversian canals"],"ans":0,"exp":"The diagram labels 'osteocyte in lacuna'. (Book p2)"},{"id":"ORTHO-C1-059","sec":"Blood supply","page":3,"q":"The nutrient artery enters bone through the:","opts":["Periosteal sheath","Articular cartilage","Nutrient foramen","Epiphyseal plate"],"ans":2,"exp":"Nutrient artery enters via the nutrient foramen. (Book p3)"},{"id":"ORTHO-C1-060","sec":"Blood supply","page":3,"q":"The medullary vessels shown alongside the nutrient artery are the:","opts":["Periosteal artery and vein","Articular artery and vein","Epiphyseal artery and vein","Medullary artery and medullary vein"],"ans":3,"exp":"Medullary artery and medullary vein are labelled. (Book p3)"},{"id":"ORTHO-C1-061","sec":"Blood supply","page":3,"q":"Metaphyseal blood vessels show which arrangement?","opts":["Hair-pin loop arrangement","Spiral collaterals","Plexiform tufts","Straight end-arteries"],"ans":0,"exp":"Metaphyseal vessels form hair-pin loops. (Book p3)"},{"id":"ORTHO-C1-062","sec":"Blood supply","page":3,"q":"The hair-pin loop arrangement of metaphyseal vessels causes:","opts":["Complete stasis and necrosis","Pulsatile high-pressure flow","Sluggish blood flow","Arteriovenous shunting"],"ans":2,"exp":"Hair-pin loops → sluggish blood flow. (Book p3)"},{"id":"ORTHO-C1-063","sec":"Blood supply","page":3,"q":"Vascularity of the metaphysis is:","opts":["Decreased","Increased","Same as diaphysis","Absent"],"ans":1,"exp":"There is increased vascularity in the metaphysis. (Book p3)"},{"id":"ORTHO-C1-064","sec":"Blood supply","page":3,"q":"The advantage of increased metaphyseal vascularity is:","opts":["Faster growth arrest","Tumour resistance","Increased healing potential","Less blood loss"],"ans":2,"exp":"Advantage = increased healing potential. (Book p3)"},{"id":"ORTHO-C1-065","sec":"Blood supply","page":3,"q":"The disadvantage of increased metaphyseal vascularity is:","opts":["Joint stiffness","Delayed healing","Propagation of infection and tumours","Bone overgrowth"],"ans":2,"exp":"Disadvantage = propagation of infection and tumours. (Book p3)"},{"id":"ORTHO-C1-066","sec":"Blood supply","page":3,"q":"As per the note, the metaphysis contains:","opts":["Abundant macrophages","Very few macrophages / monocytes","No blood vessels","Dense fibrous tissue"],"ans":1,"exp":"Metaphysis has very few macrophages/monocytes — aiding infection spread. (Book p3)"},{"id":"ORTHO-C1-067","sec":"Bone architecture","page":3,"q":"Collagen in immature (woven) bone is:","opts":["Improperly arranged","Absent","Calcified","Lamellar and parallel"],"ans":0,"exp":"Woven bone has improperly arranged collagen. (Book p3)"},{"id":"ORTHO-C1-068","sec":"Bone architecture","page":3,"q":"Mechanically, immature woven bone is:","opts":["Brittle but hard","Strong","Elastic","Weak"],"ans":3,"exp":"Woven bone is weak. (Book p3)"},{"id":"ORTHO-C1-069","sec":"Bone architecture","page":3,"q":"Immature woven bone is seen in:","opts":["Articular cartilage","Tendons","Healthy adult diaphysis","Children and healing fracture (callus)"],"ans":3,"exp":"Seen in children and in bones healing from fracture (callus). (Book p3)"},{"id":"ORTHO-C1-070","sec":"Bone architecture","page":3,"q":"Fracture callus is an example of:","opts":["Articular cartilage","Mature lamellar bone","Immature woven bone","Cortical bone"],"ans":2,"exp":"Callus = healing bone = woven bone. (Book p3)"},{"id":"ORTHO-C1-071","sec":"Bone architecture","page":3,"q":"As per the lamellar-bone table, cancellous (spongy) bone is sited at the:","opts":["Metaphysis","Epiphyseal plate","Nutrient foramen","Diaphysis"],"ans":0,"exp":"Cancellous site = metaphysis. (Book p3)"},{"id":"ORTHO-C1-072","sec":"Bone architecture","page":3,"q":"As per the lamellar-bone table, cortical (compact) bone is sited at the:","opts":["Epiphysis","Diaphysis","Physis","Metaphysis"],"ans":1,"exp":"Cortical site = diaphysis. (Book p3)"},{"id":"ORTHO-C1-073","sec":"Bone architecture","page":3,"q":"Consistency of cancellous versus cortical bone is:","opts":["Soft in both","Hard in both","Hard versus soft","Soft versus hard"],"ans":3,"exp":"Cancellous = soft, cortical = hard. (Book p3)"},{"id":"ORTHO-C1-074","sec":"Bone architecture","page":3,"q":"Bone-cell density in cancellous versus cortical bone is:","opts":["More versus fewer","Fewer versus more","Equal in both","Absent in both"],"ans":1,"exp":"Table: cancellous ↓, cortical ↑ bone cells. (Book p3)"},{"id":"ORTHO-C1-075","sec":"Bone architecture","page":3,"q":"Vascularity of cancellous versus cortical bone is:","opts":["Less versus more","More versus less","Equal","Absent in cancellous"],"ans":1,"exp":"Table: cancellous ↑, cortical ↓ vascularity. (Book p3)"},{"id":"ORTHO-C1-076","sec":"Bone architecture","page":3,"q":"Fracture healing in cancellous versus cortical bone is:","opts":["Non-healing versus fast","Equal","Slow versus fast","Fast versus slow"],"ans":3,"exp":"Table: cancellous = fast, cortical = slow. (Book p3)"},{"id":"ORTHO-C1-077","sec":"Bone architecture","page":3,"q":"Risk of infection in cancellous versus cortical bone is:","opts":["Nil in both","Equal","Lower versus higher","Higher versus lower"],"ans":3,"exp":"Table: cancellous ↑, cortical ↓ infection risk. (Book p3)"},{"id":"ORTHO-C1-078","sec":"Bone architecture","page":3,"q":"The typical fracture complication of cancellous versus cortical bone is:","opts":["Non-union versus malunion","Malunion versus non-union","Non-union in both","Malunion in both"],"ans":1,"exp":"Table: cancellous → malunion; cortical → non-union. (Book p3)"},{"id":"ORTHO-C1-079","sec":"Bone architecture","page":3,"q":"A fracture that heals slowly and risks non-union involves mainly which bone?","opts":["Cortical / compact bone of diaphysis","Woven bone of callus","Epiphyseal cartilage","Cancellous / spongy bone of metaphysis"],"ans":0,"exp":"Slow healing + non-union = cortical (diaphysis). (Book p3)"},{"id":"ORTHO-C1-080","sec":"Bone architecture","page":3,"q":"A fracture that heals fast but risks malunion involves mainly which bone?","opts":["Epiphyseal plate","Cancellous / spongy bone of metaphysis","Cortical / compact bone of diaphysis","Woven bone of adults"],"ans":1,"exp":"Fast healing + malunion = cancellous (metaphysis). (Book p3)"},{"id":"ORTHO-C1-081","sec":"Bone architecture","page":3,"q":"Epiphyseal (intra-articular) fractures lead to:","opts":["Infection then tumour","Healing then overgrowth","Non-union then malunion","Osteoarthritis then decreased range of motion"],"ans":3,"exp":"Epiphyseal intra-articular fracture → osteoarthritis → ↓ ROM. (Book p3)"},{"id":"ORTHO-C1-082","sec":"Bone growth","page":4,"q":"The X-ray shown on the bone-growth page is:","opts":["Right foot of an adult, oblique view","Left hand of a child, lateral and AP views","Left knee of a child, skyline view","Right wrist of an adult, clenched-fist view"],"ans":1,"exp":"X-ray: left hand (child), lateral + anteroposterior views. (Book p4)"},{"id":"ORTHO-C1-083","sec":"Bone growth","page":4,"q":"The physis is seen:","opts":["Only in sesamoid bones","At all ages","Only in children","Only in adults"],"ans":2,"exp":"Physis is present only in children. (Book p4)"},{"id":"ORTHO-C1-084","sec":"Bone growth","page":4,"q":"The physis increases which dimension of bone?","opts":["Length","Curvature","Thickness","Density"],"ans":0,"exp":"Physis increases length of bone. (Book p4)"},{"id":"ORTHO-C1-085","sec":"Bone growth","page":4,"q":"The correct order of growth-plate layers from epiphysis to metaphysis is:","opts":["Ossification, calcification, hypertrophic, proliferative, germinal","Germinal, proliferative, hypertrophic, calcification, ossification","Proliferative, germinal, calcification, ossification, hypertrophic","Hypertrophic, germinal, proliferative, ossification, calcification"],"ans":1,"exp":"Germinal → proliferative → hypertrophic → calcification → ossification. (Book p4)"},{"id":"ORTHO-C1-086","sec":"Bone growth","page":4,"q":"The most important layer of the growth plate is the:","opts":["Hypertrophic layer","Germinal layer","Layer of ossification","Proliferative layer"],"ans":1,"exp":"Germinal layer is the most important. (Book p4)"},{"id":"ORTHO-C1-087","sec":"Bone growth","page":4,"q":"The weakest layer of the growth plate is the:","opts":["Proliferative layer","Hypertrophic layer","Layer of calcification","Germinal layer"],"ans":1,"exp":"Hypertrophic layer is the weakest. (Book p4)"},{"id":"ORTHO-C1-088","sec":"Bone growth","page":4,"q":"The direction of growth at the growth plate is:","opts":["From epiphysis toward metaphysis","Circumferential around diaphysis","From periosteum inward","From metaphysis toward epiphysis"],"ans":0,"exp":"Growth proceeds from epiphysis toward metaphysis. (Book p4)"},{"id":"ORTHO-C1-089","sec":"Bone growth","page":4,"q":"Complete injury to the germinal layer of the growth plate causes:","opts":["Overgrowth of both sides","Isolated joint stiffness","Asymmetrical growth with varus deformity","Same-side arrest with continued opposite-side growth → limb length discrepancy"],"ans":3,"exp":"Complete: I/L side stops, C/L continues → limb length discrepancy. (Book p4)"},{"id":"ORTHO-C1-090","sec":"Bone growth","page":4,"q":"Partial injury to the germinal layer of the growth plate causes:","opts":["Increased thickness only","Limb length discrepancy","Symmetrical arrest","Asymmetrical growth → varus / valgus deformity"],"ans":3,"exp":"Partial: asymmetrical growth → deformity (varus/valgus). (Book p4)"},{"id":"ORTHO-C1-091","sec":"Bone growth","page":4,"q":"Appositional growth, which increases bone thickness, occurs by the:","opts":["Marrow and fat","Vessels and nerves","Physis and articular cartilage","Endosteum and periosteum"],"ans":3,"exp":"Appositional (thickness) growth is by endosteum and periosteum. (Book p4)"},{"id":"ORTHO-C1-092","sec":"Bone growth","page":4,"q":"Length of bone increases by the physis, while thickness increases by:","opts":["Endosteum and periosteum","The nutrient artery","The germinal layer alone","The hypertrophic layer"],"ans":0,"exp":"Length = physis; thickness = appositional growth via endosteum + periosteum. (Book p4)"},{"id":"ORTHO-C2-001","sec":"Fracture definition","page":5,"q":"A fracture is defined as:","opts":["Break in continuity of bone cortex","Bruise of the periosteum","Tear of a ligament","Dislocation of a joint"],"ans":0,"exp":"Fracture = break in continuity of bone cortex. (Book p5)"},{"id":"ORTHO-C2-002","sec":"Fracture definition","page":5,"q":"'Break in continuity of bone cortex' defines:","opts":["Contusion","Sprain","Fracture","Subluxation"],"ans":2,"exp":"That phrase is the definition of a fracture. (Book p5)"},{"id":"ORTHO-C2-003","sec":"General features","page":5,"q":"The pathognomonic clinical sign of a fracture is:","opts":["Swelling","Tenderness","Abnormal mobility at fracture site more than crepitus","Redness"],"ans":2,"exp":"Abnormal mobility > crepitus is pathognomonic. (Book p5)"},{"id":"ORTHO-C2-004","sec":"General features","page":5,"q":"The most consistent clinical sign of a fracture is:","opts":["Tenderness","Crepitus","Abnormal mobility","Swelling"],"ans":0,"exp":"Tenderness is the most consistent sign. (Book p5)"},{"id":"ORTHO-C2-005","sec":"General features","page":5,"q":"Which of these is a clinical sign of fracture?","opts":["Discontinuity of bone","Swelling","Callus","Osteoporosis"],"ans":1,"exp":"Clinical signs = abnormal mobility/crepitus, tenderness, swelling. (Book p5)"},{"id":"ORTHO-C2-006","sec":"General features","page":5,"q":"The radiological sign of a fracture on X-ray is:","opts":["Discontinuity of bone","Soft tissue edema","Periosteal reaction","Loose bodies"],"ans":0,"exp":"Radiological: X-ray shows discontinuity of bone. (Book p5)"},{"id":"ORTHO-C2-007","sec":"General features","page":5,"q":"Which one is the odd one out?","opts":["Tenderness","Swelling","Crepitus","Discontinuity of bone"],"ans":3,"exp":"Discontinuity is radiological; the rest are clinical signs. (Book p5)"},{"id":"ORTHO-C2-008","sec":"General features","page":5,"q":"Pathognomonic versus most consistent signs of fracture are:","opts":["Tenderness versus swelling","Swelling versus crepitus","Abnormal mobility/crepitus versus tenderness","Crepitus versus swelling"],"ans":2,"exp":"Pathognomonic = abnormal mobility > crepitus; most consistent = tenderness. (Book p5)"},{"id":"ORTHO-C2-009","sec":"Fracture types","page":5,"q":"The five fracture types with significant trauma, in diagram order, are:","opts":["Comminuted, segmental, spiral, oblique, transverse","Transverse, oblique, spiral, comminuted, segmental","Spiral, transverse, segmental, oblique, comminuted","Oblique, spiral, transverse, segmental, comminuted"],"ans":1,"exp":"1 Transverse, 2 Oblique, 3 Spiral, 4 Comminuted, 5 Segmental. (Book p5)"},{"id":"ORTHO-C2-010","sec":"Fracture types","page":5,"q":"Which pair complete the five-type diagram along with transverse, oblique and spiral?","opts":["Pathological and march","Avulsion and stress","Comminuted and segmental","Greenstick and torus"],"ans":2,"exp":"The five types include comminuted (4) and segmental (5). (Book p5)"},{"id":"ORTHO-C2-011","sec":"Mechanism of injury","page":5,"q":"Tension (pulling) force produces which fracture?","opts":["Oblique","Spiral","Transverse","Butterfly"],"ans":2,"exp":"Tension force → transverse fracture. (Book p5)"},{"id":"ORTHO-C2-012","sec":"Mechanism of injury","page":5,"q":"Bending force produces which fracture?","opts":["Oblique","Spiral","Butterfly","Transverse"],"ans":2,"exp":"Bending force → butterfly fracture. (Book p5)"},{"id":"ORTHO-C2-013","sec":"Mechanism of injury","page":5,"q":"Compression force produces which fracture?","opts":["Oblique","Spiral","Butterfly","Transverse"],"ans":0,"exp":"Compression force → oblique fracture. (Book p5)"},{"id":"ORTHO-C2-014","sec":"Mechanism of injury","page":5,"q":"Twisting force produces which fracture?","opts":["Butterfly","Spiral","Transverse","Oblique"],"ans":1,"exp":"Twisting force → spiral fracture. (Book p5)"},{"id":"ORTHO-C2-015","sec":"Mechanism of injury","page":5,"q":"A butterfly fracture is caused by:","opts":["Twisting force","Compression force","Bending force","Pulling force"],"ans":2,"exp":"Bending force causes the butterfly pattern. (Book p5)"},{"id":"ORTHO-C2-016","sec":"Mechanism of injury","page":5,"q":"Match the mechanism: transverse and spiral fractures arise from:","opts":["Twisting and tension","Bending and compression","Compression and bending","Tension and twisting"],"ans":3,"exp":"Transverse = tension; spiral = twisting. (Book p5)"},{"id":"ORTHO-C2-017","sec":"Avulsion fractures","page":6,"q":"An avulsion fracture occurs by:","opts":["Tumour weakening bone","Direct blow on bone","Violent pull of tendons avulsing bone","Slow repetitive loading"],"ans":2,"exp":"Violent pull of tendons → avulsion of bone. (Book p6)"},{"id":"ORTHO-C2-018","sec":"Avulsion fractures","page":6,"q":"The two examples of avulsion fractures given are:","opts":["Radius and ulna","Patella and olecranon","Clavicle and scaphoid","Femur and tibia"],"ans":1,"exp":"E.g. patella, olecranon. (Book p6)"},{"id":"ORTHO-C2-019","sec":"Avulsion fractures","page":6,"q":"In the patella diagram, the pulled tendon belongs to:","opts":["Quadriceps","Gastrocnemius","Hamstrings","Triceps"],"ans":0,"exp":"Quadriceps pulled tendon → transverse fracture of patella. (Book p6)"},{"id":"ORTHO-C2-020","sec":"Avulsion fractures","page":6,"q":"The patellar avulsion shown is what pattern of fracture?","opts":["Transverse","Spiral","Oblique","Comminuted"],"ans":0,"exp":"Labelled 'transverse fracture of patella'. (Book p6)"},{"id":"ORTHO-C2-021","sec":"Avulsion fractures","page":6,"q":"Which mechanism is the odd one out?","opts":["Violent tendon pull","Twisting","Tension","Bending"],"ans":0,"exp":"Violent tendon pull = avulsion; rest are p5 mechanisms. (Book p5, p6)"},{"id":"ORTHO-C2-022","sec":"Pathological fractures","page":6,"q":"Fractures without significant trauma are called:","opts":["Stress fractures","Pathological fractures","Avulsion fractures","Greenstick fractures"],"ans":1,"exp":"Fractures without significant trauma = pathological fractures. (Book p6)"},{"id":"ORTHO-C2-023","sec":"Pathological fractures","page":6,"q":"Which is NOT a localized cause of pathological fracture?","opts":["Infection","Ischemia","Osteoporosis","Cysts"],"ans":2,"exp":"Localized = infection, ischemia, lesions, cysts, radiation. Osteoporosis is generalized. (Book p6)"},{"id":"ORTHO-C2-024","sec":"Pathological fractures","page":6,"q":"The five localized causes include:","opts":["Infection, ischemia, lesions, cysts, radiation","Paget's and osteomalacia","Osteoporosis and metastasis","Rickets and scurvy"],"ans":0,"exp":"Localized: infection, ischemia, lesions, cysts, radiation. (Book p6)"},{"id":"ORTHO-C2-025","sec":"Pathological fractures","page":6,"q":"The most common cause of pathological fracture is:","opts":["Metastasis","Paget's disease","Osteoporosis","Scurvy"],"ans":2,"exp":"Osteoporosis is the m/c cause. (Book p6)"},{"id":"ORTHO-C2-026","sec":"Pathological fractures","page":6,"q":"The most common osteoporotic fracture sites, in order, are:","opts":["Spine, hip, wrist (Colle's)","Wrist, spine, hip","Spine, wrist, hip","Hip, wrist, spine"],"ans":0,"exp":"M/c sites: spine > hip > wrist (Colle's). (Book p6)"},{"id":"ORTHO-C2-027","sec":"Pathological fractures","page":6,"q":"A Colle's fracture involves the:","opts":["Spine","Hip","Wrist","Ankle"],"ans":2,"exp":"Wrist (Colle's) is third after spine and hip. (Book p6)"},{"id":"ORTHO-C2-028","sec":"Pathological fractures","page":6,"q":"The most common site of pathological fracture due to metastasis is:","opts":["Humerus","Rib","Vertebra","Proximal femur"],"ans":3,"exp":"Metastasis m/c site = proximal femur. (Book p6)"},{"id":"ORTHO-C2-029","sec":"Pathological fractures","page":6,"q":"The investigation listed for metastatic bone disease is:","opts":["MRI","FDG-PET","CT chest","Bone scan"],"ans":1,"exp":"Ix for metastasis = FDG-PET. (Book p6)"},{"id":"ORTHO-C2-030","sec":"Pathological fractures","page":6,"q":"Which of these is a generalized cause of pathological fracture?","opts":["Cyst","Radiation","Osteogenesis imperfecta","Ischemia"],"ans":2,"exp":"Generalized includes OI, ion"],"ans":1,"exp":"Open fracture = fracture + skin/soft-tissue break. (Book p15)"},{"id":"ORTHO-C3-002","sec":"Open fracture","page":15,"q":"The most commonly involved bones in open fracture are:","opts":["Skull and ribs","Tibia and phalanges","Spine and pelvis","Femur and humerus"],"ans":1,"exp":"M/c involved: tibia and phalanges. (Book p15)"},{"id":"ORTHO-C3-003","sec":"Open fracture","page":15,"q":"The open wound creates communication with:","opts":["Nothing outside","Sterile air","Environmental pathogens","Muscle only"],"ans":2,"exp":"Communication with environmental pathogens. (Book p15)"},{"id":"ORTHO-C3-004","sec":"Open fracture","page":15,"q":"The most common pathogen in open fractures is:","opts":["Staphylococcus aureus","E. coli","Pseudomonas","Streptococcus"],"ans":0,"exp":"M/c: staphylococcus aureus. (Book p15)"},{"id":"ORTHO-C3-005","sec":"Open fracture","page":15,"q":"In open fractures, the fracture hematoma escapes outside and:","opts":["Speeds healing","Affects healing","Forms callus","Stops bleeding"],"ans":1,"exp":"Hematoma escapes outside → affects healing. (Book p15)"},{"id":"ORTHO-C3-006","sec":"Gustilo I","page":15,"q":"A Gustilo Type I wound is:","opts":["Less than 1 cm long","Always infected","1–10 cm long","More than 10 cm"],"ans":0,"exp":"Type I: wound <1 cm long. (Book p15)"},{"id":"ORTHO-C3-007","sec":"Gustilo I","page":15,"q":"Type I open fracture is caused by:","opts":["Impingement of fracture fragments on skin","Gunshot","Vascular tear","Farm injury"],"ans":0,"exp":"Cause: d/t impingement of fragments on skin. (Book p15)"},{"id":"ORTHO-C3-008","sec":"Gustilo I","page":15,"q":"Type I open fracture is also known as:","opts":["Blast injury","Outside-in injury","Inside-out injury","Crush injury"],"ans":2,"exp":"AKA inside-out injury. (Book p15)"},{"id":"ORTHO-C3-009","sec":"Gustilo II","page":15,"q":"A Gustilo Type II wound measures:","opts":["Less than 1 cm","1–10 cm","More than 10 cm","Exactly 5 cm"],"ans":1,"exp":"Type II: wound 1–10 nagement is:","opts":["Healing","Splinting","Closure","Antibiotics"],"ans":3,"exp":"1. Antibiotics. (Book p16)"},{"id":"ORTHO-C3-019","sec":"Wound management","page":16,"q":"Wound wash uses:","opts":["Acid and base","Oil and cream","Spirit and water","Povidone iodine & sterile NS"],"ans":3,"exp":"Povidone iodine & sterile NS. (Book p16)"},{"id":"ORTHO-C3-020","sec":"Wound management","page":16,"q":"Wound toilette includes wash plus:","opts":["Stitching","Wound debridement","Bandage","Massage"],"ans":1,"exp":"Wound wash + debridement. (Book p16)"},{"id":"ORTHO-C3-021","sec":"Wound closure","page":16,"q":"Primary closure is done:","opts":["Never","In all wounds","Only in clean wounds where edges approximate, with satisfactory debridement","After 2 weeks"],"ans":2,"exp":"Primary: clean + approximating + satisfactory debridement. (Book p16)"},{"id":"ORTHO-C3-022","sec":"Wound closure","page":16,"q":"The golden period for delayed closure is:","opts":["After 1 month","After 1 year","Within 1 hour","More than 6–12 hours"],"ans":3,"exp":"If > 6–12 hrs (golden period). (Book p16)"},{"id":"ORTHO-C3-023","sec":"Wound closure","page":16,"q":"Secondary closure is chosen when there is:","opts":["No swelling","Small cut","Clean wound","Associated neurovascular injury"],"ans":3,"exp":"Associated neurovascular injury → secondary closure. (Book p16)"},{"id":"ORTHO-C3-024","sec":"Wound closure","page":16,"q":"Which pair favours secondary/delayed closure?","opts":["Approximating edges + satisfied debridement","Edges cannot approximate + unsatisfied debridement","Clean + small","Early + clean"],"ans":1,"exp":"Cannot approximate + not satisfied with debridement. (Book p16)"},{"id":"ORTHO-C3-025","sec":"Wound healing","page":16,"q":"After closure, the wound is managed:","opts":["Without dressing","With daily surgery","Like an open wound forever","Like a closed fracture"],"ans":3,"exp":"Wound healing: manage like a closed fracture. (Book p16)"},{"id":"ORTHO-C3-026","sec":"Fracture grades",  Ilizarov ring fixator is:","opts":["Uniplanar","Multiplanar","Non-planar","Flat"],"ans":1,"exp":"Multiplanar. (Book p17)"},{"id":"ORTHO-C3-043","sec":"Ilizarov","page":17,"q":"The most stable external fixator is:","opts":["Thomas splint","Rail fixator","Spanning fixator","Ilizarov ring fixator"],"ans":3,"exp":"Most stable external fixator. (Book p17)"},{"id":"ORTHO-C3-044","sec":"Ilizarov","page":17,"q":"Ilizarov allows at the fracture site:","opts":["Only rest","Compression and distraction","Only cutting","Only heat"],"ans":1,"exp":"Compression and distraction of fracture site. (Book p17)"},{"id":"ORTHO-C3-045","sec":"Ilizarov","page":17,"q":"Ilizarov pins can be put:","opts":["Only vertically","Never obliquely","In one direction only","In any direction"],"ans":3,"exp":"Pins can be put in any direction. (Book p17)"},{"id":"ORTHO-C3-046","sec":"Distraction","page":17,"q":"Distraction osteogenesis is done in:","opts":["Open fractures with bone loss","Simple sprains","Skin cuts","Closed fractures"],"ans":0,"exp":"Done in open fractures with bone loss. (Book p17)"},{"id":"ORTHO-C3-047","sec":"Ex-fix indications","page":17,"q":"Which is an indication for external fixation?","opts":["Simple closed fracture","Infected non union","Common cold","Headache"],"ans":1,"exp":"Indications include infected non union. (Book p17)"},{"id":"ORTHO-C3-048","sec":"Ex-fix indications","page":17,"q":"The six indications include open fractures, non union, infected non union, deformity/malunion, bone loss and:","opts":["Weight loss","Fever","Limb lengthening","Hair growth"],"ans":2,"exp":"Plus limb lengthening. (Book p17)"},{"id":"ORTHO-C3-049","sec":"Corticotomy","page":18,"q":"Corticotomy means:","opts":["Cut the rod","Cut the nerve","Cut the bone","Cut the skin"],"ans":2,"exp":"Corticotomy: cut the bone. (Book p18)"},{"id":"ORTHO-C3-050","sec":"Callotasis","page":18,"q":"Rods are distracted at:","opts":["10 mm/day","1 inch/day","1 cm/day","1 mm/day (physiological limit)"],"ans":3,"exp":"  infraspinatus and teres minor (external rotation). (Book p93)"},{"id":"ORTHO-C12-057","sec":"Rotator cuff tear","page":93,"q":"Subscapularis produces:","opts":["Internal rotation","External rotation","Abduction","Extension"],"ans":0,"exp":"Subscapularis = internal rotation. (Book p93)"},{"id":"ORTHO-C12-058","sec":"Rotator cuff tear","page":93,"q":"Lift off test, belly press test and bear hug test assess:","opts":["Subscapularis","Supraspinatus","Infraspinatus","Teres minor"],"ans":0,"exp":"These are subscapularis tests. (Book p93)"},{"id":"ORTHO-C12-059","sec":"Rotator cuff tear","page":93,"q":"In the empty can test, the arm is positioned at:","opts":["90° abduction, 30° flexion and complete internal rotation","90° abduction and full external rotation","30° abduction only","Full elevation in scapular plane"],"ans":0,"exp":"Empty can: 90° abduction, 30° flexion, complete internal rotation, resisting downward force. (Book p93)"},{"id":"ORTHO-C12-060","sec":"Rotator cuff tear","page":93,"q":"In Jobe's test the arms are elevated in the scapular plane with:","opts":["Elbows extended and thumbs pointing downwards","Elbows flexed and thumbs up","Elbows extended and thumbs up","Elbows flexed 90°"],"ans":0,"exp":"Jobe's: elbows extended, thumbs pointing downwards, examiner applies downward pressure. (Book p93)"},{"id":"ORTHO-C12-061","sec":"Rotator cuff tear","page":94,"q":"Which is part of treatment of rotator cuff tear?","opts":["Arthroscopic tendon repair","Shoulder amputation","Arthrodesis of shoulder","Long arm cast"],"ans":0,"exp":"Treatment includes arthroscopic tendon repair along with avoiding painful/overhead activities, physiotherapy, NSAIDs and steroid injections. (Book p94)"},{"id":"ORTHO-C12-062","sec":"Rotator cuff tear","page":94,"q":"Chronic rotator cuff tear causes rupture of long head of biceps because:","opts":["Excess stress shifts to the other stabilisers of shoulder","The biceps is directly torn","Infection of the tendon","Steroid injection into biceps"],"ans":0,"exp":"Chronic RCT → instability → excess stress on other stabilizers → degeneration and rupture of long head of biceps. (Book p94)"},{"id":"ORTHO-C12-063","sec":"Rotator cuff tear","page":94,"q":"After rupture of long head of biceps, the muscle belly retracts into:","opts":["Distal arm","Proximal arm","Shoulder","Forearm"],"ans":0,"exp":"Muscle belly retracts into distal arm. (Book p94)"},{"id":"ORTHO-C12-064","sec":"Rotator cuff tear","page":94,"q":"Popeye sign is:","opts":["Bulge in the distal arm from the retracted biceps belly","Bulge over the acromion","Swelling at the elbow","Clavicular step deformity"],"ans":0,"exp":"Popeye sign = bulge in the distal arm. (Book p94)"},{"id":"ORTHO-C12-065","sec":"Thoracic outlet syndrome","page":94,"q":"Thoracic outlet syndrome is:","opts":["Entrapment of neurovascular structures passing through the thoracic outlet","Compression of the spinal cord","A carpal tunnel variant","A scalene muscle tumour"],"ans":0,"exp":"Entrapment of neurovascular structures as they pass through the thoracic outlet. (Book p94)"},{"id":"ORTHO-C12-066","sec":"Thoracic outlet syndrome","page":94,"q":"Boundaries of the thoracic outlet include all EXCEPT:","opts":["Second rib","Anterior scalene muscle","Posterior scalene muscle","Clavicle and first rib"],"ans":0,"exp":"Boundaries: anterior scalene, posterior scalene, clavicle, first rib — not the second rib. (Book p94)"},{"id":"ORTHO-C12-067","sec":"Thoracic outlet syndrome","page":94,"q":"Contents of the thoracic outlet are:","opts":["Brachial plexus and subclavian vessels","Vagus nerve and aorta","Sympathetic chain only","Axillary nerve only"],"ans":0,"exp":"Contents: brachial plexus and subclavian vessels. (Book p94)"},{"id":"ORTHO-C12-068","sec":"Thoracic outlet syndrome","page":94,"q":"Which rib anomaly causes thoracic outlet syndrome?","opts":["Cervical rib (adventitious rib at C7)","Lumbar rib","Forked second rib","Calcified costal cartilage"],"ans":0,"exp":"Cervical rib, an adventitious rib at C7. (Book p94)"},{"id":"ORTHO-C12-069","sec":"Thoracic outlet syndrome","page":94,"q":"Which lung tumour position can compress the thoracic outlet?","opts":["Upper lobe tumour","Lower lobe tumour","Middle lobe tumour only","Pleural mesothelioma"],"ans":0,"exp":"Lung tumor (upper lobe) causing compression. (Book p94)"},{"id":"ORTHO-C12-070","sec":"Thoracic outlet syndrome","page":95,"q":"Pain in thoracic outlet syndrome is felt around the shoulder and radiates to:","opts":["Arm","Neck only","Chest","Back"],"ans":0,"exp":"Pain around shoulder, radiating to arm. (Book p95)"},{"id":"ORTHO-C12-071","sec":"Thoracic outlet syndrome","page":95,"q":"In thoracic outlet syndrome the hand turns pale because of:","opts":["Vascular compromise","Neurological deficit","Local infection","Dependent oedema"],"ans":0,"exp":"Hand turns pale — a vascular feature. (Book p95)"},{"id":"ORTHO-C12-072","sec":"Thoracic outlet syndrome","page":95,"q":"In thoracic outlet syndrome, which symptom type progresses to which?","opts":["Neurological progresses to vascular (symptoms of claudication)","Vascular progresses to neurological","Neither ever progresses","Both always appear simultaneously"],"ans":0,"exp":"Neurological progresses to vascular symptoms of claudication. (Book p95)"},{"id":"ORTHO-C12-073","sec":"Thoracic outlet syndrome","page":95,"q":"Klumpke's palsy in thoracic outlet syndrome results from compression of the brachial plexus at:","opts":["C8, T1","C5, C6","C3, C4","L1, L2"],"ans":0,"exp":"Compression of brachial plexus at C8, T1 causes Klumpke's palsy. (Book p95)"},{"id":"ORTHO-C12-074","sec":"Thoracic outlet syndrome","page":95,"q":"Risk of compression in thoracic outlet syndrome follows which order?","opts":["Brachial plexus > artery > vein","Vein > artery > plexus","Artery > vein > plexus","Plexus > vein > artery"],"ans":0,"exp":"Brachial plexus > artery > vein. (Book p95)"},{"id":"ORTHO-C12-075","sec":"Thoracic outlet syndrome","page":95,"q":"In Adson's test the head is turned:","opts":["Towards the affected side with neck extended","Towards the opposite side","Forward with neck flexed","Kept neutral"],"ans":0,"exp":"Adson's: head towards affected side, neck extended. (Book p95)"},{"id":"ORTHO-C12-076","sec":"Thoracic outlet syndrome","page":95,"q":"Which manoeuvre is part of Adson's test at the arm?","opts":["Extend elbow, abduct and externally rotate shoulder","Flex elbow and adduct","Raise arm fully overhead","Cross arm over chest"],"ans":0,"exp":"Extend elbow; abduct + externally rotate shoulder. (Book p95)"},{"id":"ORTHO-C12-077","sec":"Thoracic outlet syndrome","page":95,"q":"Reverse Adson's test differs from Adson's test by:","opts":["Head turned to the opposite side","Head turned to the same side","No neck extension","Arm kept adducted"],"ans":0,"exp":"Reverse Adson's: head turned to opposite side; rest same as Adson's test. (Book p95)"},{"id":"ORTHO-C12-078","sec":"Thoracic outlet syndrome","page":95,"q":"Wright's test for thoracic outlet syndrome uses:","opts":["Hyperabduction of shoulders","Hyperadduction of shoulders","Neck flexion","Wrist extension"],"ans":0,"exp":"Wright's hyperabduction test. (Book p95)"},{"id":"ORTHO-C12-079","sec":"Thoracic outlet syndrome","page":95,"q":"Roo's test is performed by:","opts":["Abducting shoulder, flexing elbow and opening-closing hands for 3 minutes","Extending neck and elbow together","Hyperabducting the shoulder for 10 minutes","Resisted grip for 1 minute"],"ans":0,"exp":"Roo's: abduct shoulder + flex elbow, open and close hands for 3 mins. (Book p95)"},{"id":"ORTHO-C12-080","sec":"Thoracic outlet syndrome","page":95,"q":"A positive Roo's test reproduces:","opts":["Symptoms of vascular claudication","Klumpke's palsy","Shoulder dislocation","Neck pain"],"ans":0,"exp":"It reproduces symptoms of vascular claudication. (Book p95)"},{"id":"ORTHO-C12-081","sec":"Thoracic outlet syndrome","page":95,"q":"Investigation of choice in thoracic outlet syndrome:","opts":["MRI","X-ray","E -033","sec":"Management","page":107,"q":"The BEST parameter of nerve conduction study is:","opts":["Nerve conduction velocity — velocity of impulse through different nerve segments","Electromyography","Latency only","Amplitude only"],"ans":0,"exp":"Nerve conduction velocity (best) measures velocity of impulse transmitted through different segments of the nerve. (Book p107)"},{"id":"ORTHO-C13-034","sec":"Management","page":107,"q":"Compression of a nerve affects conduction velocity as:","opts":["Decreased velocity","Increased velocity","No change","Block then surge"],"ans":0,"exp":"Compression → ↓ velocity. (Book p107)"},{"id":"ORTHO-C13-035","sec":"Management","page":107,"q":"Besides nerve conduction velocity, the other parameter of NCS is:","opts":["Electromyography","Biopsy","Thermography","Doppler"],"ans":0,"exp":"Parameters: nerve conduction velocity and electromyography. (Book p107)"},{"id":"ORTHO-C13-036","sec":"Management","page":107,"q":"Treatment of neuropraxia is:","opts":["Conservative/wait and watch with splint to prevent contracture of non-functioning muscles","Immediate exploration","Nerve graft","Tendon transfer"],"ans":0,"exp":"Conservative/wait and watch; splint to prevent contracture of non functioning muscles. (Book p107)"},{"id":"ORTHO-C13-037","sec":"Management","page":107,"q":"A closed fracture with nerve injury is initially managed by:","opts":["Splint and observe","Immediate surgical exploration","Nerve graft","Amputation"],"ans":0,"exp":"Closed fracture: Rx splint → observe. (Book p107)"},{"id":"ORTHO-C13-038","sec":"Management","page":107,"q":"In a closed fracture with nerve injury, if there is no recovery after a few months, the next step is:","opts":["NCS, and if still no recovery, surgical exploration","Continue waiting indefinitely","Tendon transfer immediately","Steroids"],"ans":0,"exp":"No recovery after few months → NCS → still no recovery → surgical exploration. (Book p107)"},{"id":"ORTHO-C13-039","sec":"Management","page":107,"q":" f axonal confusion is:","opts":["Gustatory tears (tears while chewing)","Popeye sign","Movie sign","Donut sign"],"ans":0,"exp":"e.g. gustatory tears (tears while chewing); prognosis is poor. (Book p108)"},{"id":"ORTHO-C13-052","sec":"Specific nerve injuries","page":108,"q":"In mixed nerve injury, loss of sensory supply causes:","opts":["Anesthesia, tingling, numbness, paresthesia in area of supply","Paralysis","Deformity only","Muscle wasting only"],"ans":0,"exp":"Loss of sensory supply → anesthesia, tingling, numbness, paresthesia in area of supply. (Book p108)"},{"id":"ORTHO-C13-053","sec":"Specific nerve injuries","page":108,"q":"In mixed nerve injury, loss of motor supply causes weakness/paralysis and:","opts":["Exaggeration of antagonist muscle action leading to deformity","Sensory loss","Tinel sign","Muscle hypertrophy"],"ans":0,"exp":"Loss of motor supply → weakness/paralysis and exaggeration of antagonist muscle action → deformity. (Book p108)"},{"id":"ORTHO-C13-054","sec":"Specific nerve injuries","page":108,"q":"Axillary nerve arises from and has root value:","opts":["Brachial plexus; C5, C6","Brachial plexus; C8, T1","Lumbar plexus; L2, L3","Radial nerve; C7"],"ans":0,"exp":"Origin: brachial plexus; root value C5, C6; mixed nerve. (Book p108)"},{"id":"ORTHO-C13-055","sec":"Specific nerve injuries","page":109,"q":"Motor supply of axillary nerve includes:","opts":["Deltoid (abduction of shoulder) and teres minor (external rotation)","Supraspinatus and infraspinatus","Biceps and brachialis","Serratus anterior"],"ans":0,"exp":"Deltoid (abduction of shoulder), teres minor (external rotation of shoulder). (Book p109)"},{"id":"ORTHO-C13-056","sec":"Specific nerve injuries","page":109,"q":"Sensory supply of axillary nerve is:","opts":["Lateral aspect of proximal shoulder","Medial forearm","Dorsal hand","Lateral forearm"],"ans":0,"exp":"Lateral aspect of proximal shoulder. (Book p109)"},{"id":"ORTHO-C13-057","sec":"Specific nerve injuries","page":109,"q":"Deformit alis","Pronator teres","Palmaris longus"],"ans":0,"exp":"FCU (with medial half of FDP) is supplied by ulnar nerve. (Book p113)"},{"id":"ORTHO-C14-014","sec":"Median motor map","page":113,"q":"The LOAF muscles of hand supplied by median nerve are:","opts":["Lumbricals 1,2; opponens pollicis; abductor pollicis brevis; flexor pollicis brevis","Lumbricals 3,4; opponens; adductor pollicis","All interossei","Hypothenar muscles"],"ans":0,"exp":"LOAF: lumbricals 1,2, opponens pollicis, abductor pollicis brevis, flexor pollicis brevis. (Book p113)"},{"id":"ORTHO-C14-015","sec":"Median motor map","page":113,"q":"Which part of FDP does the median nerve supply?","opts":["Lateral half","Medial half","Whole FDP","None"],"ans":0,"exp":"Lateral half of flexor digitorum profundus. (Book p113)"},{"id":"ORTHO-C14-016","sec":"Median motor map","page":113,"q":"Median nerve supply to the arm is:","opts":["No supply","Biceps","Brachialis","Coracobrachialis only"],"ans":0,"exp":"Arm: no supply. (Book p113)"},{"id":"ORTHO-C14-017","sec":"Median motor map","page":113,"q":"In the forearm, median nerve supplies:","opts":["All anterior (flexor) compartment muscles except flexor carpi ulnaris and medial half of FDP","Only pronators","Only FDS","All flexors including FCU"],"ans":0,"exp":"All anterior compartment except FCU and medial half of FDP (ulnar nerve). (Book p113)"},{"id":"ORTHO-C14-018","sec":"Median motor map","page":113,"q":"In the hand, median nerve supplies:","opts":["All thenar muscles except adductor pollicis, plus lumbricals 1,2","All thenar including adductor pollicis","Hypothenar muscles","Lumbricals 3,4"],"ans":0,"exp":"All thenar muscles except adductor pollicis (ulnar nerve) + lumbricals 1,2. (Book p113)"},{"id":"ORTHO-C14-019","sec":"Median nerve injuries","page":113,"q":"Median nerve injury at wrist is classically caused by ___ and at elbow by ___:","opts":["Carpal tunnel syndrome; supracondylar humerus fracture","Guyon's canal; cubital tunnel","Cubital tunnel; Colles fract ty","Thick periosteum","Frequent trauma"],"ans":0,"exp":"In young children or elderly population d/t relatively low immunity. (Book p137)"},{"id":"ORTHO-C17-009","sec":"Osteomyelitis routes","page":137,"q":"Most common route/source of osteomyelitis:","opts":["Hematogenous - from pre-existing infection","Direct inoculation","Post-surgical","Open fracture"],"ans":0,"exp":"Hematogenous (m/c): from pre-existing infection. (Book p137)"},{"id":"ORTHO-C17-010","sec":"Osteomyelitis routes","page":137,"q":"Puncture wounds cause osteomyelitis by which route?","opts":["Direct - contaminated source in direct contact with bone","Hematogenous","Lymphatic","Contiguity from joint"],"ans":0,"exp":"Direct (eg puncture wounds) & post-surgical (iatrogenic): contaminated source in direct contact with bone. (Book p137)"},{"id":"ORTHO-C17-011","sec":"Osteomyelitis routes","page":137,"q":"Post-surgical (iatrogenic) osteomyelitis is classified under:","opts":["Direct route","Hematogenous route","Retrograde route","Nosocomial hematogenous route"],"ans":0,"exp":"Post surgical (iatrogenic): contaminated source in direct contact with bone - direct route. (Book p137)"},{"id":"ORTHO-C17-012","sec":"Osteomyelitis routes","page":137,"q":"In septic arthritis, osteomyelitis develops when infection spreads from:","opts":["Joint to bone","Bone to joint always first","Blood to joint only","Lymphatics to bone"],"ans":0,"exp":"Septic arthritis: joint → (infection) → bone. (Book p137)"},{"id":"ORTHO-C17-013","sec":"Osteomyelitis etiology","page":137,"q":"Most common organism infecting the musculoskeletal system:","opts":["Staphylococcus aureus","Streptococcus pyogenes","Salmonella","E. coli"],"ans":0,"exp":"Staphylococcus aureus: m/c organism infecting musculoskeletal system. (Book p137)"},{"id":"ORTHO-C17-014","sec":"Osteomyelitis etiology","page":137,"q":"Staphylococcus aureus is the m/c cause of:","opts":["Osteomyelitis overall, acute and chronic","Only septic arthritis","Only post-traumatic osteomyelit page":138,"q":"Prolonged parenteral therapy leads to osteomyelitis by:","opts":["Fungal organisms","Pseudomonas","Salmonella","Anaerobes"],"ans":0,"exp":"Prolonged parenteral therapy: fungal organisms. (Book p138)"},{"id":"ORTHO-C17-022","sec":"Site","page":138,"q":"Most common site of osteomyelitis in infants and children:","opts":["Femur (distal > proximal) > tibia","Vertebrae","Pelvis","Humerus"],"ans":0,"exp":"Overall/infant/children: femur (distal > proximal) > tibia. (Book p138)"},{"id":"ORTHO-C17-023","sec":"Site","page":138,"q":"Most common site of osteomyelitis in adults:","opts":["Vertebrae","Femur","Tibia","Small bones of hand"],"ans":0,"exp":"Adult: vertebrae. (Book p138)"},{"id":"ORTHO-C17-024","sec":"Metaphyseal involvement","page":138,"q":"Reasons for metaphyseal involvement in osteomyelitis include all except:","opts":["Thick periosteum of metaphysis","Most vascular region of bone (increased nutrition for organism)","Hair pin loop arrangement of blood vessels","Few monocytes & macrophages (decreased protection)"],"ans":0,"exp":"Reasons: most vascular region (↑nutrition), hair pin loop arrangement → sluggish blood flow (easy exit to bone), few monocytes & macrophages (↓protection). (Book p138)"},{"id":"ORTHO-C17-025","sec":"Metaphyseal involvement","page":138,"q":"Hair pin loop arrangement of metaphyseal blood vessels causes:","opts":["Sluggish blood flow - easy exit of organism to bone"," Increased immunity","Rapid drug delivery","Enhanced phagocytosis"],"ans":0,"exp":"Hair pin loop arrangement → sluggish blood flow (easy exit to bone). (Book p138)"},{"id":"ORTHO-C17-026","sec":"Pathophysiology","page":138,"q":"In acute osteomyelitis, the organism reaches the metaphysis within:","opts":["<24 hours","3 days","1 week","2 weeks"],"ans":0,"exp":"Organism reaches metaphysis <24 hours → systemic manifestations: fever, pain. (Book p138)"},{"id":"ORTHO-C17-027","sec":"Pathophysiology","page":138,"q":"Systemic manifestations of acute osteomyelitis appear along with:","opts":["Organism reaching metaphysis (<24 hours)","Abscess formation","Sequestrum formation","Sinus formation"],"ans":0,"exp":"Organism reaches metaphysis <24 hours: systemic manifestations - fever, pain. (Book p138)"},{"id":"ORTHO-C17-028","sec":"Pathophysiology","page":138,"q":"Abscess in acute osteomyelitis is formed:","opts":["After 24 hours","Within 6 hours","Immediately at onset","After 2 weeks"],"ans":0,"exp":"Abscess formed: after 24 hours. (Book p138)"},{"id":"ORTHO-C17-029","sec":"Pathophysiology","page":138,"q":"Sequestrum is:","opts":["Dead bone formed inside the abscess","New bone formed by periosteum","Break in the involucrum","Break in the skin"],"ans":0,"exp":"Sequestrum (dead bone) formed inside abscess. (Book p138)"},{"id":"ORTHO-C17-030","sec":"Pathophysiology","page":138,"q":"Involucrum is:","opts":["New bone formed due to periosteal reaction that contains the spread","Dead bone inside pus","A break in the cortex","A type of sinus"],"ans":0,"exp":"Involucrum: new bone that contains the spread (d/t periosteal reaction). (Book p138)"},{"id":"ORTHO-C17-031","sec":"Pathophysiology","page":138,"q":"Periosteal reaction (involucrum) on X-ray appears by about:","opts":["7-10 days","24 hours","48 hours","6 weeks"],"ans":0,"exp":"Periosteal reaction: ~10 days. (Book p138)"},{"id":"ORTHO-C17-032","sec":"Pathophysiology","page":138,"q":"Cloaca is defined as:","opts":["Break in the involucrum","Break in the skin","Dead bone","New bone rim"],"ans":0,"exp":"Cloaca: break in involucrum through which pus escapes. (Book p138)"},{"id":"ORTHO-C17-033","sec":"Pathophysiology","page":138,"q":"Sinus in chronic osteomyelitis is:","opts":["Break in the skin through which pus drains out","Break in the involucrum","Dead bone fragment","New bone shell"],"ans":0,"exp":"Sinus: break in skin; cloaca + sinus → pus drains out. (Book p138)"},{"id":"ORTHO-C17-034","sec":"Clinical features","page":139,"q":"A young child with acute osteomyelitis presents with:","opts":["High grade fever, pain & swelling, pseudoparalysis","Low grade fever with night sweats only","Painless swelling","Chronic discharging sinus from onset"],"ans":0,"exp":"Young child: high grade fever, pain & swelling, pseudoparalysis. (Book p139)"},{"id":"ORTHO-C17-035","sec":"Clinical features","page":139,"q":"Pseudoparalysis in acute osteomyelitis means:","opts":["Patient doesn't move the limb due to pain","True flaccid paralysis","Absent reflexes","Complete sensory loss"],"ans":0,"exp":"Pseudoparalysis: patient doesn't move limb d/t pain. (Book p139)"},{"id":"ORTHO-C17-036","sec":"Clinical features","page":139,"q":"Causes of pseudoparalysis in a child include:","opts":["Septic arthritis, osteomyelitis and scurvy","Polio and GBS","Cerebral palsy","Radial nerve injury only"],"ans":0,"exp":"Causes of pseudoparalysis: septic arthritis, osteomyelitis, scurvy. (Book p139)"},{"id":"ORTHO-C17-037","sec":"Clinical features","page":139,"q":"In scurvy, pseudoparalysis occurs due to:","opts":["Subperiosteal hemorrhage causing pain","Joint pus","Muscle infarction","Nerve compression"],"ans":0,"exp":"Scurvy (vit C deficiency): subperiosteal hemorrhage → pain → pseudoparalysis. (Book p139)"},{"id":"ORTHO-C17-038","sec":"Hallmarks","page":139,"q":"Clinical hallmark of acute osteomyelitis:","opts":["Not specific - fever & pain","Sinus","Bony swelling","Fusiform fingers"],"ans":0,"exp":"Acute: clinical hallmark not specific (fever & pain); chronic: sinus. (Book p139)"},{"id":"ORTHO-C17-039","sec":"Hallmarks","page":139,"q":"Clinical hallmark of chronic osteomyelitis:","opts":["Sinus","Abscess","High grade fever","Pseudoparalysis"],"ans":0,"exp":"Chronic osteomyelitis: clinical hallmark is sinus. (Book p139)"},{"id":"ORTHO-C17-040","sec":"Hallmarks","page":139,"q":"Pathological hallmark of acute osteomyelitis:","opts":["Abscess","Sequestrum","Involucrum","Amyloidosis"],"ans":0,"exp":"Acute: pathological hallmark abscess; chronic: sequestrum. (Book p139)"},{"id":"ORTHO-C17-041","sec":"Hallmarks","page":139,"q":"Pathological hallmark of chronic osteomyelitis:","opts":["Sequestrum","Abscess","Effusion","Bursitis"],"ans":0,"exp":"Chronic osteomyelitis: pathological hallmark sequestrum. (Book p139)"},{"id":"ORTHO-C17-042","sec":"Investigations","page":139,"q":"Blood culture in acute osteomyelitis is positive in:","opts":["50% of cases","95% of cases","10% of cases","100% of cases"],"ans":0,"exp":"Blood culture: 50% +ve. (Book p139)"},{"id":"ORTHO-C17-043","sec":"Investigations","page":139,"q":"WBC/neutrophil, ESR and CRP in acute osteomyelitis are:","opts":["High but not specific","Always normal","Specific for osteomyelitis","Useful only in chronic cases"],"ans":0,"exp":"WBC/neutrophil, ESR, CRP: high, not specific. (Book p139)"},{"id":"ORTHO-C17-044","sec":"Investigations","page":139,"q":"Sensitive & specific blood marker for acute osteomyelitis and septic arthritis:","opts":["Serum procalcitonin","Serum alkaline phosphatase","Serum uric acid","Blood culture"],"ans":0,"exp":"Serum procalcitonin: sensitive & specific marker for acute osteomyelitis and septic arthritis. (Book p139)"},{"id":"ORTHO-C17-045","sec":"Radiology","page":139,"q":"Investigation that picks up the earliest changes (within 24 hrs of onset) in osteomyelitis:","opts":["MRI - marrow edema","X-ray","CT scan","Ultrasound"],"ans":0,"exp":"MRI: picks up earliest changes within 24 hrs of disease onset - marrow edema. (Book p139)"},{"id":"ORTHO-C17-046","sec":"Radiology","page":139,"q":"Isotopes used in bone scan for osteomyelitis:","opts":["Technetium 99, Gallium 67, Indium 111 labelled WBC","Iodine 131 and Strontium 89","Fluorine 18 only","Thallium 201"],"ans":0,"exp":"Bone scan: technetium 99, gallium 67, indium 111 labelled WBC - accumulation in infection. (Book p139)"},{"id":"ORTHO-C17-047","sec":"Radiology","page":139,"q":"X-ray changes in acute osteomyelitis are detected:","opts":["After 24 hours of disease onset","Immediately at onset","Before clinical symptoms","Only after 3 months"],"ans":0,"exp":"X-ray: changes detected after 24 hours of disease onset. (Book p139)"},{"id":"ORTHO-C17-048","sec":"Radiology","page":139,"q":"Earliest X-ray change (within 48 hours) of acute osteomyelitis:","opts":["Soft tissue lucency/shadow around bone","Periosteal reaction","Sequestrum","Joint space narrowing"],"ans":0,"exp":"Earliest X-ray change (within 48 hours): soft tissue lucency/shadow around bone. (Book p139)"},{"id":"ORTHO-C17-049","sec":"Radiology","page":139,"q":"Earliest bony change on X-ray (7-10 days/2 weeks) in osteomyelitis:","opts":["Periosteal reaction","Sequestrum","Cloaca","Pathological fracture"],"ans":0,"exp":"Earliest bony changes on X-ray (7-10 days/2 weeks): periosteal reaction. (Book p139)"},{"id":"ORTHO-C17-050","sec":"Biopsy & treatment","page":140,"q":"Gold standard investigation of osteomyelitis:","opts":["Biopsy - tissue sample from site of infection","Blood culture","MRI","Bone scan"],"ans":0,"exp":"Biopsy: gold standard; tissue sample collected from site of infection. (Book p140)"},{"id":"ORTHO-C17-051","sec":"Biopsy & treatment","page":140,"q":"Definitive treatment of acute osteomyelitis presenting within 24 hours:","opts":["Antibiotics ± drain the abscess","Antibiotics + drain the abscess always","Immediate sequestrectomy","Amputation"],"ans":0,"exp":"Presents within 24 hours: antibiotics ± drain the abscess. (Book p140)"},{"id":"ORTHO-C17-052","sec":"Biopsy & treatment","page":140,"q":"Definitive treatment of acute osteomyelitis presenting after 24 hours:","opts":["Antibiotics + drain the abscess","Antibiotics alone always","Observation","Physiotherapy"],"ans":0,"exp":"Presents after 24 hours: antibiotics + drain the abscess. (Book p140)"},{"id":"ORTHO-C17-053","sec":"Biopsy & treatment","page":140,"q":"Supportive treatment of acute osteomyelitis includes:","opts":["Initial broad spectrum antibiotics, analgesics, antipyretics, rest & splint, icepack & elevation","Long-term steroids","Immediate excision of metaphysis","Hyperbaric oxygen only"],"ans":0,"exp":"Supportive: initial broad spectrum antibiotics, analgesics (pain), antipyretics (fever), rest & splint to prevent movement (↓pain), icepack & limb elevation (swelling). (Book p140)"},{"id":"ORTHO-C17-054","sec":"Biopsy & treatment","page":140,"q":"Total antibiotic duration in acute osteomyelitis:","opts":["6 weeks - 2 weeks IV followed by 4 weeks PO","2 weeks total","6 months IV always","3 days"],"ans":0,"exp":"6 weeks: 2 weeks IV → 4 weeks PO. (Book p140)"},{"id":"ORTHO-C17-055","sec":"Biopsy & treatment","page":140,"q":"Long antibiotic duration in osteomyelitis is required due to:","opts":["Low penetration of drug in bone","High relapse of salmonella","Slow growth of staph","Poor patient compliance only"],"ans":0,"exp":"Long duration d/t low penetration of drug in bone; response assessed using CRP measurements. (Book p140)"},{"id":"ORTHO-C17-056","sec":"Biopsy & treatment","page":140,"q":"Response to antibiotic therapy in osteomyelitis is assessed using:","opts":["CRP measurements","ESR only","X-ray healing","Wound size"],"ans":0,"exp":"Response assessed using CRP measurements. (Book p140)"},{"id":"ORTHO-C17-057","sec":"Complications","page":140,"q":"Most common complication of acute osteomyelitis:","opts":["Chronic osteomyelitis","Septicemia","Growth disturbance","Amyloidosis"],"ans":0,"exp":"Complications: chronic osteomyelitis (m/c). (Book p140)"},{"id":"ORTHO-C17-058","sec":"Complications","page":140,"q":"Spread of acute osteomyelitis to joint (septic arthritis) is prevented by:","opts":["Growth plate","Periosteum","Involucrum","Cortical bone"],"ans":0,"exp":"Septic arthritis: bone → joint; prevented by growth plate. (Book p140)"},{"id":"ORTHO-C17-059","sec":"Complications","page":140,"q":"Septic arthritis as a complication of osteomyelitis is common in:","opts":["<1 year - before growth plate formation; adults after growth plate fusion","5-10 years only","Teenagers only","Never in adults"],"ans":0,"exp":"Common in: <1 yr (before growth plate formation) and adults (after growth plate fusion). (Book p140)"},{"id":"ORTHO-C17-060","sec":"Complications","page":140,"q":"Other complications of acute osteomyelitis besides chronic osteomyelitis and septic arthritis:","opts":["Septicemia and growth disturbance","Malignant transformation","Tumor formation","Cyanotic heart disease"],"ans":0,"exp":"Complications: chronic OM (m/c), septic arthritis, septicemia, growth disturbance. (Book p140)"},{"id":"ORTHO-C17-061","sec":"Duration & chronic OM","page":140,"q":"Duration of acute osteomyelitis:","opts":["<2 weeks","2-4 weeks","4-8 weeks","6 months"],"ans":0,"exp":"Duration: acute <2 weeks; subacute 2-4 weeks; chronic >4 weeks. (Book p140)"},{"id":"ORTHO-C17-062","sec":"Duration & chronic OM","page":140,"q":"Subacute osteomyelitis lasts:","opts":["2-4 weeks","<2 weeks","8-12 weeks","1 year"],"ans":0,"exp":"Subacute: 2-4 weeks. (Book p140)"},{"id":"ORTHO-C17-063","sec":"Duration & chronic OM","page":140,"q":"Chronic osteomyelitis is defined as infection lasting:","opts":[">4 weeks","<2 weeks","2-4 weeks","exactly 6 days"],"ans":0,"exp":"Chronic: >4 weeks following infection. (Book p140)"},{"id":"ORTHO-C17-064","sec":"Duration & chronic OM","page":140,"q":"Chronic osteomyelitis is:","opts":["Sequelae/complication of acute osteomyelitis","A de novo infection without acute phase","Always blood borne from distant focus","A fungal infection"],"ans":0,"exp":"Chronic OM: sequelae/complication of acute osteomyelitis; >4 weeks following infection; clinical hallmark: sinus. (Book p140)"},{"id":"ORTHO-C17-065","sec":"Sequestrum","page":141,"q":"Sequestrum is defined as:","opts":["Dead, dense, devascularized bone inside abscess","New bone around infection","Fibrous tissue in medulla","Cartilage island in bone"],"ans":0,"exp":"Sequestrum: pathological hallmark of chronic osteomyelitis - dead, dense, devascularized bone inside abscess. (Book p141)"},{"id":"ORTHO-C17-066","sec":"Sequestrum","page":141,"q":"Sequestrum
