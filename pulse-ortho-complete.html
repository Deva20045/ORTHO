ps oddly, so holiday onto teriparatide. Denosumab, raloxifene and HRT back them up.","qs":["ORTHO-C4-156","ORTHO-C4-157","ORTHO-C4-158","ORTHO-C4-159","ORTHO-C4-160","ORTHO-C4-161"]},{"id":"ORTHO-U4-23","ch":4,"n":23,"title":"Anabolics, Strontium & Cement","sec":"Measuring & Mending · p34–35","guide":"Teriparatide's PTH whispers wake only builders — severe disease's champion, brief and watched; abaloparatide echoes it, romosumab frees builders via sclerostin. Strontium does both but harms; cement (vertebro-) or balloon-lift-plus-cement (kypho-) props vertebrae.","qs":["ORTHO-C4-162","ORTHO-C4-163","ORTHO-C4-164","ORTHO-C4-165","ORTHO-C4-166","ORTHO-C4-167","ORTHO-C4-168"]},{"id":"ORTHO-U4-24","ch":4,"n":24,"title":"Paget's Roots & Stages","sec":"Paget's · p35–36","guide":"Paget's: men's fifth-decade mystery — idiopathic mostly, SQSTM1 and paramyxovirus suspects, pelvis then tibia. Osteoclasts rage, builders overanswer, ALP soars through lytic, mixed, blastic acts.","qs":["ORTHO-C4-169","ORTHO-C4-170","ORTHO-C4-171","ORTHO-C4-172","ORTHO-C4-173","ORTHO-C4-174","ORTHO-C4-175"]},{"id":"ORTHO-U4-25","ch":4,"n":25,"title":"Paget's Face & Mosaic Proof","sec":"Paget's · p35–36","guide":"Pagetic bones ache (commonest), run warm and thick, snap like bananas, squeeze cranial nerves 2-7-8 (deafness), harden ears, outgrow hats. Mosaic biopsy proves.","qs":["ORTHO-C4-176","ORTHO-C4-177","ORTHO-C4-178","ORTHO-C4-179","ORTHO-C4-180","ORTHO-C4-181","ORTHO-C4-182","ORTHO-C4-183"]},{"id":"ORTHO-U4-26","ch":4,"n":26,"title":"Paget's Films, Drugs & Dangers","sec":"Paget's · p35–36","guide":"Lytic skulls flame (blade of grass), mixed frames pictures, ivories vertebrae, cottons wool; blastic skulls thicken (Tam O'Shanter). Zoledronate calms, calcitonin soothes; hearts fail high-output, bone can turn sarcoma.","qs":["ORTHO-C4-184","ORTHO-C4-185","ORTHO-C4-186","ORTHO-C4-187","ORTHO-C4-188","ORTHO-C4-189","ORTHO-C4-190","ORTHO-C4-191"]},{"id":"ORTHO-U4-27","ch":4,"n":27,"title":"Brittle Bones: OI Types","sec":"Brittle & Summary · p36–37","guide":"Brittle bones (OI): COL1A1 collagen curse. Dominant Type I limps through recurrent breaks; recessive Type II stillborns, shattered in the womb on antenatal scans. Labs stay normal.","qs":["ORTHO-C4-192","ORTHO-C4-193","ORTHO-C4-194","ORTHO-C4-195","ORTHO-C4-196","ORTHO-C4-197"]},{"id":"ORTHO-U4-28","ch":4,"n":28,"title":"Blue Sclera & Seekh Kabab","sec":"Brittle & Summary · p36–37","guide":"Same bone breaks again and again into deformity; thin sclerae blush blue with choroid; skin bruises easy. Braces guard, Seekh-Kabab rods realign.","qs":["ORTHO-C4-198","ORTHO-C4-199","ORTHO-C4-200","ORTHO-C4-201","ORTHO-C4-202"]},{"id":"ORTHO-U4-29","ch":4,"n":29,"title":"The Grand Lab Table","sec":"Brittle & Summary · p36–37","guide":"The reckoning table: secondary/rickets/osteomalacia (Ca lowish, PTH up, PO4 down, ALP up), renal (Ca down-down, PO4 up-up), osteoporosis (all normal), primary (Ca up-up-up), Paget's (ALP up-up-up alone).","qs":["ORTHO-C4-203","ORTHO-C4-204","ORTHO-C4-205","ORTHO-C4-206","ORTHO-C4-207"]},{"id":"ORTHO-U5-01","ch":5,"n":1,"title":"mechanism, X-ray & m/c Facts","sec":"Clavicle Basics · p38","guide":"Clavicle breaks from a fall on an outstretched hand. The AP shoulder film labels clavicle, acromion, proximal humerus and the lateral scapular border — and the clavicle is the most commonly fractured bone at birth, in newborns and overall.","qs":["ORTHO-C5-001","ORTHO-C5-002","ORTHO-C5-003","ORTHO-C5-004","ORTHO-C5-005","ORTHO-C5-006","ORTHO-C5-007","ORTHO-C5-008","ORTHO-C5-009","ORTHO-C5-010"]},{"id":"ORTHO-U5-02","ch":5,"n":2,"title":"Fracture Site & Pulls","sec":"Clavicle Basics · p38","guide":"The tube meets the flat plate at the medial-2/3–lateral-1/3 junction, so it snaps there. SCM yanks the medial piece up while pectoralis and the arm's weight drag the lateral piece down.","qs":["ORTHO-C5-011","ORTHO-C5-012","ORTHO-C5-013","ORTHO-C5-014","ORTHO-C5-015","ORTHO-C5-016","ORTHO-C5-017"]},{"id":"ORTHO-U5-03","ch":5,"n":3,"title":"Complications & Sling Care","sec":"Clavicle Care · p38–39","guide":"Displacement heals crooked (malunion, the commonest trouble), the plexus and subclavian vessels sit in harm's way, and true non-union is very rare. Most clavicles heal in a figure-of-8, a sling, or both.","qs":["ORTHO-C5-018","ORTHO-C5-019","ORTHO-C5-020","ORTHO-C5-021","ORTHO-C5-022","ORTHO-C5-023","ORTHO-C5-024"]},{"id":"ORTHO-U5-04","ch":5,"n":4,"title":"Velpeau & ORIF Calls","sec":"Clavicle Care · p39","guide":"Velpeau binds clavicle fractures, acromion injuries and shoulder dislocations. Surgery is for open fractures, tenting skin, AC joint involvement, neurovascular injury and the floating shoulder — fixed by ORIF.","qs":["ORTHO-C5-025","ORTHO-C5-026","ORTHO-C5-027","ORTHO-C5-028","ORTHO-C5-029","ORTHO-C5-030","ORTHO-C5-031","ORTHO-C5-032","ORTHO-C5-033"]},{"id":"ORTHO-U5-05","ch":5,"n":5,"title":"Fixation & Ball-Socket","sec":"Shoulder Design · p39","guide":"Plates-and-screws or an intramedullary implant fix the clavicle. Then meet the shoulder: a ball 4× its socket — hugely mobile, poorly stable, and the most commonly dislocated joint.","qs":["ORTHO-C5-034","ORTHO-C5-035","ORTHO-C5-036","ORTHO-C5-037","ORTHO-C5-038","ORTHO-C5-039","ORTHO-C5-040"]},{"id":"ORTHO-U5-06","ch":5,"n":6,"title":"Dynamic & Static Guards","sec":"Stabilizers · p40","guide":"The cuff plus the long head of biceps hug the head dynamically. Static backup is the three glenohumeral ligaments — inferior most important — and the capsular folds.","qs":["ORTHO-C5-041","ORTHO-C5-042","ORTHO-C5-043","ORTHO-C5-044","ORTHO-C5-045","ORTHO-C5-046","ORTHO-C5-047","ORTHO-C5-048"]},{"id":"ORTHO-U5-07","ch":5,"n":7,"title":"Labrum & Subtypes","sec":"Dislocation Map · p40","guide":"The labrum deepens the socket, but inferior stays the weakest point — so dislocations run anterior > posterior > inferior. Anterior subtypes run pre-glenoid to the rare intrathoracic, subcoracoid commonest.","qs":["ORTHO-C5-049","ORTHO-C5-050","ORTHO-C5-051","ORTHO-C5-052","ORTHO-C5-053","ORTHO-C5-054","ORTHO-C5-055","ORTHO-C5-056"]},{"id":"ORTHO-U5-08","ch":5,"n":8,"title":"Attitude & Emergency","sec":"Anterior Face · p40","guide":"The dislocated arm lies abducted and externally rotated, contour flattened, adduction lost — usually after trauma or a FOOSH. It is an emergency: reduce immediately.","qs":["ORTHO-C5-057","ORTHO-C5-058","ORTHO-C5-059","ORTHO-C5-060","ORTHO-C5-061","ORTHO-C5-062","ORTHO-C5-063","ORTHO-C5-064","ORTHO-C5-065"]},{"id":"ORTHO-U5-09","ch":5,"n":9,"title":"Four Classic Tests","sec":"Bedside Tests · p40–41","guide":"Hamilton's ruler bridges epicondyle to acromion, Dugas traps the hand from the far shoulder, Callaway's tape shows a fatter axilla, and Bryant's fold sags lower on the bad side.","qs":["ORTHO-C5-066","ORTHO-C5-067","ORTHO-C5-068","ORTHO-C5-069","ORTHO-C5-070","ORTHO-C5-071","ORTHO-C5-072","ORTHO-C5-073","ORTHO-C5-074"]},{"id":"ORTHO-U5-10","ch":5,"n":10,"title":"Axillary Nerve & TEAM","sec":"Nerve & Kocher · p41","guide":"The axillary nerve dies first — deltoid and teres minor go silent and the regimental badge patch tingles. Confirm on AP + lateral films, then reduce with Kocher's TEAM: Traction, External rotation, Adduction, medial rotation.","qs":["ORTHO-C5-075","ORTHO-C5-076","ORTHO-C5-077","ORTHO-C5-078","ORTHO-C5-079","ORTHO-C5-080","ORTHO-C5-081","ORTHO-C5-082","ORTHO-C5-083","ORTHO-C5-084"]},{"id":"ORTHO-U5-11","ch":5,"n":11,"title":"Analgesia to Stimson","sec":"Reduction Ladder · p42","guide":"Try closed reduction under analgesia, then under anaesthesia's relaxed muscles, and only then open up. Stimson lets a prone patient's hanging, weighted arm pull itself back in.","qs":["ORTHO-C5-085","ORTHO-C5-086","ORTHO-C5-087","ORTHO-C5-088","ORTHO-C5-089","ORTHO-C5-090","ORTHO-C5-091","ORTHO-C5-092","ORTHO-C5-093"]},{"id":"ORTHO-U5-12","ch":5,"n":12,"title":"Aftercare & Hippocrates","sec":"Reduction Ladder · p42","guide":"After reduction, pouch or Velpeau to heal soft tissues and stop recurrence. The Hippocratic method is older school: foot for countertraction, arm for traction.","qs":["ORTHO-C5-094","ORTHO-C5-095","ORTHO-C5-096","ORTHO-C5-097","ORTHO-C5-098","ORTHO-C5-099","ORTHO-C5-100"]},{"id":"ORTHO-U5-13","ch":5,"n":13,"title":"Bankart & Hill-Sachs","sec":"Recurrence Lesions · p42–43","guide":"Recurrence tears the labrum antero-inferiorly (Bankart, commonest) or avulses the glenoid rim (bony Bankart), slackening the inferior ligament. Each new dislocation dents the head's posterolateral corner — Hill-Sachs.","qs":["ORTHO-C5-101","ORTHO-C5-102","ORTHO-C5-103","ORTHO-C5-104","ORTHO-C5-105","ORTHO-C5-106","ORTHO-C5-107","ORTHO-C5-108","ORTHO-C5-109","ORTHO-C5-110"]},{"id":"ORTHO-U5-14","ch":5,"n":14,"title":"m/c Notes & Violence","sec":"Posterior Story · p43","guide":"Overall and late, recurrence rules; early, the axillary nerve suffers. Posterior dislocation is the violent-muscle one — seizures, high-voltage shocks, ECT — plus FOOSH and plain trauma.","qs":["ORTHO-C5-111","ORTHO-C5-112","ORTHO-C5-113","ORTHO-C5-114","ORTHO-C5-115","ORTHO-C5-116","ORTHO-C5-117","ORTHO-C5-118","ORTHO-C5-119","ORTHO-C5-120"]},{"id":"ORTHO-U5-15","ch":5,"n":15,"title":"Bulb Sign & Reverses","sec":"Posterior Story · p43–44","guide":"Posterior attitude is adducted and internally rotated with contour preserved and pain present. The head glows like a light bulb on X-ray; reverse Bankart and reverse Hill-Sachs mirror the anterior lesions.","qs":["ORTHO-C5-121","ORTHO-C5-122","ORTHO-C5-123","ORTHO-C5-124","ORTHO-C5-125","ORTHO-C5-126","ORTHO-C5-127","ORTHO-C5-128","ORTHO-C5-129"]},{"id":"ORTHO-U5-16","ch":5,"n":16,"title":"Luxatio Erecta & Surgery","sec":"Erecta & Repair · p44","guide":"Hyperabduction erects the arm into luxatio erecta. Instability tests: fulcrum/crank/apprehension anteriorly, jerk posteriorly, sulcus inferiorly — and the unstable shoulder today gets arthroscopic Bankart/Hill-Sachs repair, not Bristow or Putti-Platt.","qs":["ORTHO-C5-130","ORTHO-C5-131","ORTHO-C5-132","ORTHO-C5-133","ORTHO-C5-134","ORTHO-C5-135","ORTHO-C5-136","ORTHO-C5-137","ORTHO-C5-138"]},{"id":"ORTHO-U6-01","ch":6,"n":1,"title":"Surgical Neck Basics","sec":"Top of Humerus · p45","guide":"Osteoporotic postmenopausal women snap the surgical neck — the fracture line threading both tuberosities — and the axillary nerve is the casualty. Neeb's system then counts how many of the four parts have fled.","qs":["ORTHO-C6-001","ORTHO-C6-002","ORTHO-C6-003","ORTHO-C6-004","ORTHO-C6-005","ORTHO-C6-006","ORTHO-C6-007","ORTHO-C6-008"]},{"id":"ORTHO-U6-02","ch":6,"n":2,"title":"Neeb I–IV & Plating","sec":"Top of Humerus · p45","guide":"Neeb I–IV means 0, 2, 3 or 4 displaced parts among head, tuberosities and shaft — more parts, more AVN risk. Definitive care is open reduction with plates and screws.","qs":["ORTHO-C6-009","ORTHO-C6-010","ORTHO-C6-011","ORTHO-C6-012","ORTHO-C6-013","ORTHO-C6-014","ORTHO-C6-015","ORTHO-C6-016","ORTHO-C6-017","ORTHO-C6-018"]},{"id":"ORTHO-U6-03","ch":6,"n":3,"title":"Groove, Slabs & Gravity","sec":"Shaft · p46","guide":"The shaft runs from surgical neck to supracondylar ridges with the radial nerve spiralling in its groove. Closed care is a U-slab or hanging cast; open plating is best — and a hanging cast only works on an upright patient.","qs":["ORTHO-C6-019","ORTHO-C6-020","ORTHO-C6-021","ORTHO-C6-022","ORTHO-C6-023","ORTHO-C6-024","ORTHO-C6-025","ORTHO-C6-026","ORTHO-C6-027"]},{"id":"ORTHO-U6-04","ch":6,"n":4,"title":"Holstein-Lewis & Watch","sec":"Shaft Nerve · p46–47","guide":"At the upper-2/3–lower-1/3 junction the nerve pierces the septum and gets snared — Holstein-Lewis wrist drop in a cock-up splint. Any radial palsy starts closed with a 3-month watch; failed recovery earns a conduction study, then exploration.","qs":["ORTHO-C6-028","ORTHO-C6-029","ORTHO-C6-030","ORTHO-C6-031","ORTHO-C6-032","ORTHO-C6-033","ORTHO-C6-034","ORTHO-C6-035","ORTHO-C6-036","ORTHO-C6-037","ORTHO-C6-038","ORTHO-C6-039"]},{"id":"ORTHO-U6-05","ch":6,"n":5,"title":"Six Fractures, One Triangle","sec":"Elbow Map · p47","guide":"Around the elbow, supracondylar leads and lateral condyle follows. The elbow is a hinge — an ulnohumeral joint — whose 3-point bony triangle survives supracondylar fractures but breaks in every other elbow fracture.","qs":["ORTHO-C6-040","ORTHO-C6-041","ORTHO-C6-042","ORTHO-C6-043","ORTHO-C6-044","ORTHO-C6-045","ORTHO-C6-046","ORTHO-C6-047","ORTHO-C6-048","ORTHO-C6-049"]},{"id":"ORTHO-U6-06","ch":6,"n":6,"title":"Child Bone & FOOSH","sec":"Supracondylar Why · p48","guide":"Kids' thin, flat supracondylar bone makes this the childhood elbow fracture — a Salter-Harris II that is extraarticular. A FOOSH hyperextends it into posterior displacement.","qs":["ORTHO-C6-050","ORTHO-C6-051","ORTHO-C6-052","ORTHO-C6-053","ORTHO-C6-054","ORTHO-C6-055","ORTHO-C6-056"]},{"id":"ORTHO-U6-07","ch":6,"n":7,"title":"Extension vs Flexion","sec":"Displacement · p48","guide":"Extension types push the fragment back; flexion types push it forwards. The extended-elbow fall plus triceps drag produces proximal migration, medial tilt-shift, internal rotation and the classic dorsal tilt.","qs":["ORTHO-C6-057","ORTHO-C6-058","ORTHO-C6-059","ORTHO-C6-060","ORTHO-C6-061","ORTHO-C6-062","ORTHO-C6-063"]},{"id":"ORTHO-U6-08","ch":6,"n":8,"title":"Gartland I–II–III","sec":"Gartland · p48","guide":"Gartland I is undisplaced (POP at 90°), II cracks only the anterior cortex (POP if it reduces, wires if not), and III is fully displaced with a fish-tail — reduced and K-wired.","qs":["ORTHO-C6-064","ORTHO-C6-065","ORTHO-C6-066","ORTHO-C6-067","ORTHO-C6-068","ORTHO-C6-069","ORTHO-C6-070","ORTHO-C6-071"]},{"id":"ORTHO-U6-09","ch":6,"n":9,"title":"Sails, Tails & Angles","sec":"Signs & Holds · p49","guide":"Blood lifts the fat pad into a sail; the swollen elbow fans into a fish-tail. Dunlop traction holds things temporarily while Baumann's angle judges the final reduction before ORIF.","qs":["ORTHO-C6-072","ORTHO-C6-073","ORTHO-C6-074","ORTHO-C6-075","ORTHO-C6-076","ORTHO-C6-077"]},{"id":"ORTHO-U6-10","ch":6,"n":10,"title":"Vessels & AIN First","sec":"Early Dangers · p49","guide":"Early disaster is neurovascular: brachial artery first, then compartment syndrome and Volkmann's, with nerves falling AIN > median > radial. AIN fibres ride the median nerve's exposed periphery — like CPN fibres in the sciatic nerve.","qs":["ORTHO-C6-078","ORTHO-C6-079","ORTHO-C6-080","ORTHO-C6-081","ORTHO-C6-082","ORTHO-C6-083","ORTHO-C6-084","ORTHO-C6-085","ORTHO-C6-086","ORTHO-C6-087"]},{"id":"ORTHO-U6-11","ch":6,"n":11,"title":"Varus & the Cascade","sec":"Late & Cascade · p49–50","guide":"Late, malunion into gunstock varus leads, with myositis ossificans behind. Meanwhile the classic compartment cascade runs: arterial injury → FDP ischemia → hypoxia → swelling → self-strangulation.","qs":["ORTHO-C6-088","ORTHO-C6-089","ORTHO-C6-090","ORTHO-C6-091","ORTHO-C6-092","ORTHO-C6-093","ORTHO-C6-094","ORTHO-C6-095","ORTHO-C6-096"]},{"id":"ORTHO-U6-12","ch":6,"n":12,"title":"Posture & Six Signs","sec":"Six P's · p50","guide":"The ischemic limb curls into Volkmann's posture — flexed elbow, pronated forearm, flexed wrist, clawed fingers. Pain on passive stretch screams first; pallor, paraesthesia, then late paralysis and very-late pulselessness follow.","qs":["ORTHO-C6-097","ORTHO-C6-098","ORTHO-C6-099","ORTHO-C6-100","ORTHO-C6-101","ORTHO-C6-102","ORTHO-C6-103","ORTHO-C6-104","ORTHO-C6-105"]},{"id":"ORTHO-U6-13","ch":6,"n":13,"title":"Manometer & Fasciotomy","sec":"Pressure & Knife · p50","guide":"The manometer rules: under 10 is normal, over 30 is compartment syndrome (use differential pressure in hypotension). Slit superficial and deep fascia everywhere, leave the wound open, then graft or vacuum-close.","qs":["ORTHO-C6-106","ORTHO-C6-107","ORTHO-C6-108","ORTHO-C6-109","ORTHO-C6-110","ORTHO-C6-111","ORTHO-C6-112","ORTHO-C6-113"]},{"id":"ORTHO-U6-14","ch":6,"n":14,"title":"Splint, Slide, Shorten","sec":"Volkmann Care · p51","guide":"Fixed Volkmann's deformity plus dead hand function earns a turnbuckle splint when mild, a Max Page slide when moderate, and bone shortening when severe. Overall the tibia causes compartment syndromes; in children, blame the supracondylar fracture.","qs":["ORTHO-C6-114","ORTHO-C6-115","ORTHO-C6-116","ORTHO-C6-117","ORTHO-C6-118","ORTHO-C6-119","ORTHO-C6-120","ORTHO-C6-121"]},{"id":"ORTHO-U6-15","ch":6,"n":15,"title":"Pulseless Hand & Gunstock","sec":"Pink & Crooked · p51","guide":"Pink but pulseless: collaterals paint the hand while the compressed brachial kills the radial pulse — reduce the fracture. Malunion's medial tilt plus twist gunstocks the elbow but spares function; the French osteotomy straightens it.","qs":["ORTHO-C6-122","ORTHO-C6-123","ORTHO-C6-124","ORTHO-C6-125","ORTHO-C6-126","ORTHO-C6-127","ORTHO-C6-128","ORTHO-C6-129"]},{"id":"ORTHO-U6-16","ch":6,"n":16,"title":"Carrying Angle & Myositis","sec":"Angles & Bone in Muscle · p51","guide":"Carrying angles run 0–15° in males, 10–15° in females. Massaging the fracture squeezes hematoma into muscle, where it turns to bone and freezes movement.","qs":["ORTHO-C6-130","ORTHO-C6-131","ORTHO-C6-132","ORTHO-C6-133","ORTHO-C6-134","ORTHO-C6-135"]},{"id":"ORTHO-U6-17","ch":6,"n":17,"title":"Brachialis & Embolism","sec":"Myositis & Fat · p52","guide":"Myositis loves the brachialis and the elbow, and it alone freezes elbow motion after these fractures: NSAIDs and rest while angry, physio when quiet, excision if stuck. Elsewhere, long-bone trauma can fog the lungs with fat at 24–48 hours.","qs":["ORTHO-C6-136","ORTHO-C6-137","ORTHO-C6-138","ORTHO-C6-139","ORTHO-C6-140","ORTHO-C6-141","ORTHO-C6-142","ORTHO-C6-143","ORTHO-C6-144"]},{"id":"ORTHO-U6-18","ch":6,"n":18,"title":"Varus Crack & Necessity","sec":"Lateral Condyle · p52","guide":"A varus-tinged FOOSH cracks the lateral condyle — intraarticular, Salter-Harris IV, triangle disturbed — the mirror of supracondylar. It joins intraarticular fractures, Monteggia/Galeazzi and femoral neck as must-fix fractures of necessity.","qs":["ORTHO-C6-145","ORTHO-C6-146","ORTHO-C6-147","ORTHO-C6-148","ORTHO-C6-149","ORTHO-C6-150","ORTHO-C6-151","ORTHO-C6-152","ORTHO-C6-153"]},{"id":"ORTHO-U6-19","ch":6,"n":19,"title":"Non-union to Tardy Palsy","sec":"Valgus & Tardy · p52","guide":"The extensor mass tugs the fragment into non-union while the dead lateral physis lets the medial side outgrow it — cubitus valgus stretching medial structures until the ulnar nerve tardily fails with tingling and a partial claw.","qs":["ORTHO-C6-154","ORTHO-C6-155","ORTHO-C6-156","ORTHO-C6-157","ORTHO-C6-158","ORTHO-C6-159","ORTHO-C6-160","ORTHO-C6-161","ORTHO-C6-162"]},{"id":"ORTHO-U6-20","ch":6,"n":20,"title":"Wiring & Reversed Triangle","sec":"Olecranon & Dislocation · p53","guide":"Lateral condyles get ORIF; the olecranon gets tension-band wiring that turns pull-apart into squeeze-together. Elbow dislocation — the childhood dislocation, usually posterior — reverses the 3-point triangle and flexes the arm.","qs":["ORTHO-C6-163","ORTHO-C6-164","ORTHO-C6-165","ORTHO-C6-166","ORTHO-C6-167","ORTHO-C6-168","ORTHO-C6-169","ORTHO-C6-170","ORTHO-C6-171"]},{"id":"ORTHO-U6-21","ch":6,"n":21,"title":"Terrible Triad & Slips","sec":"Triad & Toddlers · p53–54","guide":"Posterior dislocation plus coronoid plus radial head is Hotchkiss's terrible triad; its bowstring is a slack triceps. In toddlers the small radial head slips from its loose annular noose — nursemaid's elbow.","qs":["ORTHO-C6-172","ORTHO-C6-173","ORTHO-C6-174","ORTHO-C6-175","ORTHO-C6-176","ORTHO-C6-177","ORTHO-C6-178","ORTHO-C6-179","ORTHO-C6-180","ORTHO-C6-181"]},{"id":"ORTHO-U6-22","ch":6,"n":22,"title":"Click It Back","sec":"Nursemaid's · p54","guide":"The nursemaid's arm hangs extended and pronated with a normal triangle and normal X-ray, and usually fixes itself — or one firm flex-and-supinate (or extend-and-pronate) click cures it.","qs":["ORTHO-C6-182","ORTHO-C6-183","ORTHO-C6-184","ORTHO-C6-185","ORTHO-C6-186","ORTHO-C6-187"]},{"id":"ORTHO-U7-01","ch":7,"n":1,"title":"Spin, TFCC & POP Spots","sec":"Forearm Rules · p55","guide":"The radius spins around a static ulna to pronate and supinate, with the TFCC guarding the DRUJ. Both-bone breaks are cast in supination up top, mid-prone in the middle, pronation down low — but plating both bones is best.","qs":["ORTHO-C7-001","ORTHO-C7-002","ORTHO-C7-003","ORTHO-C7-004","ORTHO-C7-005","ORTHO-C7-006","ORTHO-C7-007","ORTHO-C7-008","ORTHO-C7-009","ORTHO-C7-010"]},{"id":"ORTHO-U7-02","ch":7,"n":2,"title":"Ulna Plus Bado I–IV","sec":"Monteggia · p55–56","guide":"Monteggia pairs an upper-third ulna break (a must-fix necessity) with a dislocated radial head. Bado reads the head's escape: anterior (commonest), posterior, lateral, or anterior plus a radius fracture.","qs":["ORTHO-C7-011","ORTHO-C7-012","ORTHO-C7-013","ORTHO-C7-014","ORTHO-C7-015","ORTHO-C7-016","ORTHO-C7-017","ORTHO-C7-018","ORTHO-C7-019"]},{"id":"ORTHO-U7-03","ch":7,"n":3,"title":"Plates & PIN Drop","sec":"Monteggia Nerve · p56","guide":"Plate the ulna, pin the PRUJ if needed, and watch the posterior interosseous nerve — fingers and thumb drop with feeling intact. Revision: shoulder loses axillary, supracondylar loses AIN first.","qs":["ORTHO-C7-020","ORTHO-C7-021","ORTHO-C7-022","ORTHO-C7-023","ORTHO-C7-024","ORTHO-C7-025","ORTHO-C7-026"]},{"id":"ORTHO-U7-04","ch":7,"n":4,"title":"Reverse Pair & Nightstick","sec":"Galeazzi & Ulna · p56–57","guide":"Galeazzi mirrors Monteggia: radius breaks, DRUJ/TFCC lets go — plate it. The lone ulna 'nightstick' from a defensive block takes either a cast or plates and screws.","qs":["ORTHO-C7-027","ORTHO-C7-028","ORTHO-C7-029","ORTHO-C7-030","ORTHO-C7-031","ORTHO-C7-032","ORTHO-C7-033"]},{"id":"ORTHO-U7-05","ch":7,"n":5,"title":"Notes & Eight Labels","sec":"Wrist Views · p57","guide":"A type-I Monteggia film and the ulnar nerve of posterior elbow dislocation close the notes. Then learn the wrist: volar-pointing lateral view, ulnar-pointing AP view, and all eight carpal labels.","qs":["ORTHO-C7-034","ORTHO-C7-035","ORTHO-C7-036","ORTHO-C7-037","ORTHO-C7-038","ORTHO-C7-039","ORTHO-C7-040","ORTHO-C7-041"]},{"id":"ORTHO-U7-06","ch":7,"n":6,"title":"Four Fractures, One m/c","sec":"Wrist Table · p57–58","guide":"The wrist table splits clean: extraarticular Colle's (dorsal) and Smith (volar) versus intraarticular Barton (rim plus sliding carpus) and Chauffeur (lone styloid). Colle's itself loves osteoporotic wrists snapping at the cortico-cancellous line in extension.","qs":["ORTHO-C7-042","ORTHO-C7-043","ORTHO-C7-044","ORTHO-C7-045","ORTHO-C7-046","ORTHO-C7-047","ORTHO-C7-048","ORTHO-C7-049","ORTHO-C7-050"]},{"id":"ORTHO-U7-07","ch":7,"n":7,"title":"Fork & Handshake Cast","sec":"Colles Care · p58","guide":"Dorsal plus lateral tilt forks the wrist like a dinner fork. Reduce with traction, palmar flexion, ulnar deviation into a hand-shaking, below-elbow cast — stiffness is the enemy — or plate it definitively.","qs":["ORTHO-C7-051","ORTHO-C7-052","ORTHO-C7-053","ORTHO-C7-054","ORTHO-C7-055","ORTHO-C7-056","ORTHO-C7-057"]},{"id":"ORTHO-U7-08","ch":7,"n":8,"title":"Stiffness to Non-union","sec":"Colles Troubles · p58","guide":"Stiff fingers lead the trouble list, a forked malunion follows, then Sudeck's burning dystrophy, a snapped EPL, a squeezed median nerve in the carpal tunnel, and rarely non-union.","qs":["ORTHO-C7-058","ORTHO-C7-059","ORTHO-C7-060","ORTHO-C7-061","ORTHO-C7-062","ORTHO-C7-063","ORTHO-C7-064","ORTHO-C7-065"]},{"id":"ORTHO-U7-09","ch":7,"n":9,"title":"Smith, Barton, Chauffeur","sec":"Other Rims · p59","guide":"Smith is the flipped Colle's — volar slip, garden-spade dip, flexion fall. Barton drags the joint plus carpus and needs plates; Chauffeur chips just the radial styloid inside the joint.","qs":["ORTHO-C7-066","ORTHO-C7-067","ORTHO-C7-068","ORTHO-C7-069","ORTHO-C7-070","ORTHO-C7-071","ORTHO-C7-072"]},{"id":"ORTHO-U7-10","ch":7,"n":10,"title":"Mnemonic & Firsts","sec":"Carpal Roll · p59","guide":"She Looks Too Pretty Try To Catch Her: eight carpals with pea-small pisiform and big capitate. Capitate ossifies first at 2 months, pisiform last; fractures pick scaphoid, dislocations pick lunate and threaten the median nerve.","qs":["ORTHO-C7-073","ORTHO-C7-074","ORTHO-C7-075","ORTHO-C7-076","ORTHO-C7-077","ORTHO-C7-078","ORTHO-C7-079","ORTHO-C7-080","ORTHO-C7-081","ORTHO-C7-082"]},{"id":"ORTHO-U7-11","ch":7,"n":11,"title":"Waist, Snuffbox, MRI","sec":"Scaphoid Hunt · p60","guide":"Young adults FOOSH onto the scaphoid waist until the snuffbox aches. Shoot an oblique view first — the line often hides — and call MRI for the invisible ones.","qs":["ORTHO-C7-083","ORTHO-C7-084","ORTHO-C7-085","ORTHO-C7-086","ORTHO-C7-087","ORTHO-C7-088","ORTHO-C7-089","ORTHO-C7-090"]},{"id":"ORTHO-U7-12","ch":7,"n":12,"title":"Non-union & Herbert","sec":"Scaphoid Fate · p60","guide":"Scaphoid blood runs retrograde, so non-union rules and the proximal pole dies first. Waist breaks are commonest, proximal-pole breaks riskiest; undisplaced sips in a glass-holding cast, displaced earns a Herbert screw.","qs":["ORTHO-C7-091","ORTHO-C7-092","ORTHO-C7-093","ORTHO-C7-094","ORTHO-C7-095","ORTHO-C7-096","ORTHO-C7-097"]},{"id":"ORTHO-U7-13","ch":7,"n":13,"title":"Grins & Spilled Cups","sec":"Lunate Chaos · p61","guide":"A torn scapho-lunate ligament gapes past 3–4 mm into a Terry Thomas grin (normal 2–3). Keinbock's rots the lunate; the lunate itself either spills like a coffee cup or sits tight while everything dislocates around it — Tavernier reduces it.","qs":["ORTHO-C7-098","ORTHO-C7-099","ORTHO-C7-100","ORTHO-C7-101","ORTHO-C7-102","ORTHO-C7-103","ORTHO-C7-104","ORTHO-C7-105","ORTHO-C7-106"]},{"id":"ORTHO-U7-14","ch":7,"n":14,"title":"Bennett, Rolando, Boxer","sec":"Metacarpals · p61–62","guide":"APL yanks thumb-base breaks: Bennett's partial piece slips out, Rolando's T/Y shatters in place. At the other end, the boxer's 5th metacarpal neck rests in a Jame's-position cast.","qs":["ORTHO-C7-107","ORTHO-C7-108","ORTHO-C7-109","ORTHO-C7-110","ORTHO-C7-111","ORTHO-C7-112","ORTHO-C7-113","ORTHO-C7-114"]},{"id":"ORTHO-U7-15","ch":7,"n":15,"title":"Ball vs Jersey Pull","sec":"Tendon Avulsions · p62","guide":"A ball jams the finger into hyperflexion and the extensor avulses — mallet. Jersey yanks the flexor in hyperextension instead. Both lose active DIP motion while passive survives, dropping dorsal or volar flecks.","qs":["ORTHO-C7-115","ORTHO-C7-116","ORTHO-C7-117","ORTHO-C7-118","ORTHO-C7-119","ORTHO-C7-120","ORTHO-C7-121"]},{"id":"ORTHO-U7-16","ch":7,"n":16,"title":"Flecks & Frog Splints","sec":"Tendon Avulsions · p62","guide":"Mallet's fleck rides dorsal, jersey's volar — FDP torn with FDS watching. Mallet splints with a stax or frog; the table leaves jersey's treatment blank.","qs":["ORTHO-C7-122","ORTHO-C7-123","ORTHO-C7-124","ORTHO-C7-125","ORTHO-C7-126","ORTHO-C7-127","ORTHO-C7-128"]},{"id":"ORTHO-U8-01","ch":8,"n":1,"title":"Cup, Labels & Shenton","sec":"Hip Map · p63","guide":"The hip marries the femoral head to the acetabular cup. Learn every label — SI joint to obturator foramen on the pelvis, head to lesser trochanter on the femur — then trace Shenton's smooth arc, the first line to break in any hip disease.","qs":["ORTHO-C8-001","ORTHO-C8-002","ORTHO-C8-003","ORTHO-C8-004","ORTHO-C8-005","ORTHO-C8-006","ORTHO-C8-007","ORTHO-C8-008","ORTHO-C8-009","ORTHO-C8-010","ORTHO-C8-011","ORTHO-C8-012"]},{"id":"ORTHO-U8-02","ch":8,"n":2,"title":"NSA & Trochanter Tips","sec":"Angles · p64","guide":"The neck meets the shaft at 120–135°; smaller is vara, bigger is valga. The greater trochanter tip floats at the cup's centre — high means short leg, low means long — while the lesser trochanter winks in and out with rotation.","qs":["ORTHO-C8-013","ORTHO-C8-014","ORTHO-C8-015","ORTHO-C8-016","ORTHO-C8-017","ORTHO-C8-018","ORTHO-C8-019","ORTHO-C8-020","ORTHO-C8-021"]},{"id":"ORTHO-U8-03","ch":8,"n":3,"title":"Shattered Arcs & Jumpers","sec":"Breaks & Jumps · p64","guide":"Dislocation and neck fracture both shatter Shenton's arc. Feel rotation: the leg swings out while the hip turns in, and vice versa. Pelvic breaks are high-energy — jumpers from heights snap U or H patterns.","qs":["ORTHO-C8-022","ORTHO-C8-023","ORTHO-C8-024","ORTHO-C8-025","ORTHO-C8-026","ORTHO-C8-027","ORTHO-C8-028"]},{"id":"ORTHO-U8-04","ch":8,"n":4,"title":"Tiles: Ring Intact?","sec":"Pelvic Rings · p65","guide":"Tiles asks one question: is the ring broken? Chips of ilium, ischium or the iliac spines stay stable — Duverney's wing included. A cracked ring is unstable, and Young-Burgess then reads the crashing force.","qs":["ORTHO-C8-029","ORTHO-C8-030","ORTHO-C8-031","ORTHO-C8-032","ORTHO-C8-033","ORTHO-C8-034","ORTHO-C8-035","ORTHO-C8-036","ORTHO-C8-037","ORTHO-C8-038"]},{"id":"ORTHO-U8-05","ch":8,"n":5,"title":"Open Books & Crushes","sec":"Force Patterns · p65","guide":"A head-on smash springs the pelvis open like a book — horizontally unstable. A side slam crushes it vertically into Malgaigne's same-side double break; the bucket handle mixes sides.","qs":["ORTHO-C8-039","ORTHO-C8-040","ORTHO-C8-041","ORTHO-C8-042","ORTHO-C8-043","ORTHO-C8-044"]},{"id":"ORTHO-U8-06","ch":8,"n":6,"title":"Straddle & the Bleed","sec":"Bleeders · p65–66","guide":"Bucket handle pairs one SI disruption with opposite rami breaks; complex force snaps all four rami into a straddle. All of them can bleed half to two litres from veins, spongy bone, soft tissue and the urethra — so run ATLS.","qs":["ORTHO-C8-045","ORTHO-C8-046","ORTHO-C8-047","ORTHO-C8-048","ORTHO-C8-049","ORTHO-C8-050","ORTHO-C8-051","ORTHO-C8-052"]},{"id":"ORTHO-U8-07","ch":8,"n":7,"title":"Binders & Judet Walls","sec":"Tamponade & Cup · p66","guide":"Squeeze outside bleeds, tamponade inside ones with binders or bed-sheets, pour in RL/NS, and fix the ring externally in compression. The acetabulum itself has two walls and two columns — Judet views catch the posterior wall most, and a spur flags both columns.","qs":["ORTHO-C8-053","ORTHO-C8-054","ORTHO-C8-055","ORTHO-C8-056","ORTHO-C8-057","ORTHO-C8-058","ORTHO-C8-059","ORTHO-C8-060","ORTHO-C8-061"]},{"id":"ORTHO-U8-08","ch":8,"n":8,"title":"Sound Side Sinks","sec":"Trendelenburg · p67","guide":"Gluteus medius and minimus, wired by the superior gluteal nerve, hold your pelvis level each step. If they fail, the sound side sinks after 30 seconds — SSS — and the ASIS of the good side drops.","qs":["ORTHO-C8-062","ORTHO-C8-063","ORTHO-C8-064","ORTHO-C8-065","ORTHO-C8-066","ORTHO-C8-067","ORTHO-C8-068","ORTHO-C8-069","ORTHO-C8-070","ORTHO-C8-071","ORTHO-C8-072"]},{"id":"ORTHO-U8-09","ch":8,"n":9,"title":"Leans & Well Legs","sec":"Gaits · p67","guide":"Trendelenburg walkers lean their spine over the bad hip; polio-weak quads force a hand-to-knee push. Thomas then hunts hidden hip flexion — the well-leg raise test named for Hugh Owen Thomas.","qs":["ORTHO-C8-073","ORTHO-C8-074","ORTHO-C8-075","ORTHO-C8-076","ORTHO-C8-077"]},{"id":"ORTHO-U8-10","ch":8,"n":10,"title":"Hidden Flexion & Calf Squeeze","sec":"Thomas & Thompson · p68","guide":"Lie flat, watch the lordosis vanish as the good hip flexes, and the bad hip's secret flexion pops up — measure it with a goniometer. Then squeeze the calf: no plantar flick means the tendoachilles (Simmonds-Thompson) is torn.","qs":["ORTHO-C8-078","ORTHO-C8-079","ORTHO-C8-080","ORTHO-C8-081","ORTHO-C8-082","ORTHO-C8-083","ORTHO-C8-084","ORTHO-C8-085","ORTHO-C8-086","ORTHO-C8-087","ORTHO-C8-088"]},{"id":"ORTHO-U9-01","ch":9,"n":1,"title":"Deep Socket, Two Ways Out","sec":"Hip Pops · p69","guide":"The hip is a deep, faithful socket — concave cup plus the body's strongest ligament — so once reduced it rarely pops again. Pure means no accompanying break: dashboards drive the head backwards (commonest), deceleration or falls fling it forwards.","qs":["ORTHO-C9-001","ORTHO-C9-002","ORTHO-C9-003","ORTHO-C9-004","ORTHO-C9-005","ORTHO-C9-006","ORTHO-C9-007"]},{"id":"ORTHO-U9-02","ch":9,"n":2,"title":"Curl In vs Sprawl Out","sec":"Attitudes · p69","guide":"Posterior hips curl into F-AD-IR — internally rotated, knee kissing the other leg, medial foot on the bed. Anterior hips sprawl into F-ABD-ER — flexed, abducted, externally rotated, lateral foot down.","qs":["ORTHO-C9-008","ORTHO-C9-009","ORTHO-C9-010","ORTHO-C9-011","ORTHO-C9-012","ORTHO-C9-013"]},{"id":"ORTHO-U9-03","ch":9,"n":3,"title":"Short, Long & Central","sec":"Length & Feel · p70","guide":"Posterior shortens, anterior lengthens. Both break Shenton's arc with the head sitting outside — but posterior hides the lesser trochanter in internal rotation while anterior flaunts abduction. Feel the head: buttock behind, groin in front, rectum if central — the head punched through into the pelvis, usually with a fracture.","qs":["ORTHO-C9-014","ORTHO-C9-015","ORTHO-C9-016","ORTHO-C9-017","ORTHO-C9-018","ORTHO-C9-019","ORTHO-C9-020","ORTHO-C9-021"]},{"id":"ORTHO-U9-04","ch":9,"n":4,"title":"Reduce Before It Dies","sec":"Hip Rescue · p70","guide":"A dislocated hip is an emergency racing AVN: reduce closed, repeat under anaesthesia if spasm wins, open if it still resists, then skeletal traction. Allis, Bigelow, Stimson and the East Baltimore lift are the moves — shoulders keep Kocher's.","qs":["ORTHO-C9-022","ORTHO-C9-023","ORTHO-C9-024","ORTHO-C9-025"]},{"id":"ORTHO-U9-05","ch":9,"n":5,"title":"Dead Bone, Dropped Foot","sec":"Aftermath · p71","guide":"Vessels die first (6–12 hours), the sciatic nerve drops the foot in posterior pops, and anterior pops threaten femoral vessels over nerve. Narath's warning: femoral pulse unfelt against a missing head while foot pulses survive — in dislocation, dysplasia or after head excision.","qs":["ORTHO-C9-026","ORTHO-C9-027","ORTHO-C9-028","ORTHO-C9-029","ORTHO-C9-030","ORTHO-C9-031","ORTHO-C9-032"]},{"id":"ORTHO-U9-06","ch":9,"n":6,"title":"Capsule Line & Backflow","sec":"Neck Plumbing · p71","guide":"The capsule grips the intertrochanteric line between the trochanters — that line decides everything. Head blood climbs backwards, distal to proximal, led by the medial circumflex femoral artery with obturator and lateral circumflex help.","qs":["ORTHO-C9-033","ORTHO-C9-034","ORTHO-C9-035","ORTHO-C9-036","ORTHO-C9-037","ORTHO-C9-038","ORTHO-C9-039","ORTHO-C9-040"]},{"id":"ORTHO-U9-07","ch":9,"n":7,"title":"Above vs Below the Line","sec":"Two Fractures · p72","guide":"Above the line is intracapsular neck (50–60s women, trivial fall, mild Scarpa's ache); below it is extracapsular trochanteric (harder fall, angrier trochanteric pain). Age matches, everything else diverges.","qs":["ORTHO-C9-041","ORTHO-C9-042","ORTHO-C9-043","ORTHO-C9-044","ORTHO-C9-045","ORTHO-C9-046","ORTHO-C9-047"]},{"id":"ORTHO-U9-08","ch":9,"n":8,"title":"Leashed vs Flopped","sec":"Two Fractures · p72","guide":"The capsule leashes neck rotation under 45° with under an inch of shortening; trochanteric breaks flop past 45° with the foot's edge on the bed and over an inch lost. Neck starves into 45% AVN and 30% non-union; trochanteric bone, well-fed, merely heals crooked into vara.","qs":["ORTHO-C9-048","ORTHO-C9-049","ORTHO-C9-050","ORTHO-C9-051","ORTHO-C9-052","ORTHO-C9-053","ORTHO-C9-054"]},{"id":"ORTHO-U9-09","ch":9,"n":9,"title":"Three Excuses, Three Addresses","sec":"Why Necks Fail · p72","guide":"Neck non-union has three excuses: synovial fluid rinses the clot, blood barely arrives, and no cambium brings baby osteoblasts. By address: sub-capital at the head's foot, transcervical through the neck, basicervical at the neck's foot.","qs":["ORTHO-C9-055","ORTHO-C9-056","ORTHO-C9-057","ORTHO-C9-058","ORTHO-C9-059","ORTHO-C9-060","ORTHO-C9-061","ORTHO-C9-062"]},{"id":"ORTHO-U9-10","ch":9,"n":10,"title":"Pauwels' Steep Slide","sec":"Angles of Doom · p73","guide":"Sub-capital tops the death list. Pauwels' then grades the neck's tilt: under 30°, 30–50°, over 50° — the steeper the slide, the bigger the slip and the bleaker the future, I beating II beating III.","qs":["ORTHO-C9-063","ORTHO-C9-064","ORTHO-C9-065","ORTHO-C9-066","ORTHO-C9-067","ORTHO-C9-068","ORTHO-C9-069","ORTHO-C9-070"]},{"id":"ORTHO-U9-11","ch":9,"n":11,"title":"Four Failing Scripts","sec":"Garden Stages · p73","guide":"Garden reads the trabecular handwriting: bending only (valgus-impacted), head-neck script broken, all three lines scrambled, then total divorce. Incomplete and undisplaced at stage I, completely displaced by IV — prognosis falls I to IV.","qs":["ORTHO-C9-071","ORTHO-C9-072","ORTHO-C9-073","ORTHO-C9-074","ORTHO-C9-075","ORTHO-C9-076","ORTHO-C9-077","ORTHO-C9-078"]},{"id":"ORTHO-U9-12","ch":9,"n":12,"title":"Screw, Graft or Cut","sec":"Young Neck Plan · p73","guide":"Under 65 and fresh (3 weeks): screw it closed with cannulated cancellous screws. Older breaks get an MRI verdict — dead heads earn muscle grafts (Meyers' quadratus femoris, Baksi's TFL, fibula), living ones earn an osteotomy, Pauwels's beating Mcmurray's.","qs":["ORTHO-C9-079","ORTHO-C9-080","ORTHO-C9-081","ORTHO-C9-082","ORTHO-C9-083","ORTHO-C9-084","ORTHO-C9-085","ORTHO-C9-086"]},{"id":"ORTHO-U9-13","ch":9,"n":13,"title":"Half or Whole Hip","sec":"Old Neck Plan · p73–74","guide":"Past 65, replace: half (Austin Moore, Thompson, best-of-breed bipolar) for virgin hips, total for arthritic ones. Hemi swaps head-and-neck alone; total adds the cup — and the CRIF film shows those cannulated screws at work.","qs":["ORTHO-C9-087","ORTHO-C9-088","ORTHO-C9-089","ORTHO-C9-090","ORTHO-C9-091","ORTHO-C9-092","ORTHO-C9-093","ORTHO-C9-094"]},{"id":"ORTHO-U9-14","ch":9,"n":14,"title":"Feed, Slide, Flatten","sec":"Salvage Cuts · p74","guide":"Meyer's muscle pedicle feeds the dying head; Mcmurray's sliding cut medialises the shaft so weight vaults over the crack; Pauwels's wedge flattens the slide so standing hammers it shut. Fall plus hip pain with a clean X-ray still earns an MRI — occult necks hide.","qs":["ORTHO-C9-095","ORTHO-C9-096","ORTHO-C9-097","ORTHO-C9-098","ORTHO-C9-099","ORTHO-C9-100","ORTHO-C9-101","ORTHO-C9-102"]},{"id":"ORTHO-U9-15","ch":9,"n":15,"title":"Nails, Screws & Boots","sec":"Trochanteric Fix · p75","guide":"Trochanteric breaks just need their angle bodyguarded: a proximal femoral nail with locking screws or a dynamic hip screw's lag-blade-plate quartet holds 120–135° against vara. The frail get Russel's traction and a derotation boot instead.","qs":["ORTHO-C9-103","ORTHO-C9-104","ORTHO-C9-105","ORTHO-C9-106","ORTHO-C9-107","ORTHO-C9-108"]},{"id":"ORTHO-U10-01","ch":10,"n":1,"title":"Tug-of-War & Thomas","sec":"Thigh Shaft · p76","guide":"The thigh's tug-of-war: psoas and abductors flex and splay the top piece while adductors drag the bottom inward. RTA-grade violence (Winquist-Hansen) earns a Thomas splint first — ring roomy by 2 inches, length generous by 6 — then a locked nail.","qs":["ORTHO-C10-001","ORTHO-C10-002","ORTHO-C10-003","ORTHO-C10-004","ORTHO-C10-005","ORTHO-C10-006","ORTHO-C10-007","ORTHO-C10-008","ORTHO-C10-009"]},{"id":"ORTHO-U10-02","ch":10,"n":2,"title":"Bleed, Clog & Gasp","sec":"Fat Storm · p76–77","guide":"A femur break stiffens the knee, may refuse to unite, can drain 1.5 litres into shock, and leaks marrow fat into the lungs. Fat embolism announces itself at 24–48 hours: speckled skin, gasping chest, clouded brain.","qs":["ORTHO-C10-010","ORTHO-C10-011","ORTHO-C10-012","ORTHO-C10-013","ORTHO-C10-014","ORTHO-C10-015","ORTHO-C10-016","ORTHO-C10-017","ORTHO-C10-018"]},{"id":"ORTHO-U10-03","ch":10,"n":3,"title":"One Major, Four Minors","sec":"GURDS Rules · p77","guide":"Not ARDS — GURDS: one major (axillary specks, PaO2 under 60, sinking consciousness, wet lungs) plus four minors (fever, fast pulse, thin blood, fat in spit and urine, jumping ESR, retinal flecks). Fix fractures early to prevent it; ex-fix, ICU, then finish.","qs":["ORTHO-C10-019","ORTHO-C10-020","ORTHO-C10-021","ORTHO-C10-022","ORTHO-C10-023","ORTHO-C10-024","ORTHO-C10-025","ORTHO-C10-026","ORTHO-C10-027"]},{"id":"ORTHO-U10-04","ch":10,"n":4,"title":"Pavlik to Nails","sec":"Little Femurs · p77","guide":"Babies ride in a Pavlik, toddlers set in a spica, schoolkids flex on Enders/TENS wires, teens take adult nails. Under-2s can hang in gallows traction, and the clover-leaf Kuntscher grips the isthmus where straight nail meets curved bone.","qs":["ORTHO-C10-028","ORTHO-C10-029","ORTHO-C10-030","ORTHO-C10-031","ORTHO-C10-032","ORTHO-C10-033","ORTHO-C10-034"]},{"id":"ORTHO-U10-05","ch":10,"n":5,"title":"Smashed Patella Twins","sec":"Kneecap · p78","guide":"A direct smash cracks the kneecap across and the quads yank the top half skyward — wire it like an olecranon (tension band, best) or tube it in plaster. Don't be fooled by the bipartite twin, usually bilateral and innocent.","qs":["ORTHO-C10-035","ORTHO-C10-036","ORTHO-C10-037","ORTHO-C10-038","ORTHO-C10-039","ORTHO-C10-040","ORTHO-C10-041","ORTHO-C10-042"]},{"id":"ORTHO-U10-06","ch":10,"n":6,"title":"Bumper & Bearing Cast","sec":"Plateau & Shin · p78–79","guide":"A car bumper valgus-loads the standing knee into the lateral tibial plateau — plate it open. The tibial shaft below either hides in a patellar-tendon cast or gets the definitive locked nail.","qs":["ORTHO-C10-043","ORTHO-C10-044","ORTHO-C10-045","ORTHO-C10-046","ORTHO-C10-047","ORTHO-C10-048"]},{"id":"ORTHO-U10-07","ch":10,"n":7,"title":"Three Views, Three Counts","sec":"Ankle Map · p79","guide":"Read the ankle three ways: AP (both malleoli, tibia, talus), lateral (talus on calcaneus) and mortise. One malleolus is lonely, two is Pott's, three is Cotton's.","qs":["ORTHO-C10-049","ORTHO-C10-050","ORTHO-C10-051","ORTHO-C10-052","ORTHO-C10-053"]},{"id":"ORTHO-U10-08","ch":10,"n":8,"title":"Sprains, Pilon, Angles","sec":"Ankle & Heel · p80","guide":"Check nerves and vessels, reduce, recheck, then slab. Inversion-plus-toes-down snaps the body's most-sprained ligament (ATFL); rare eversion strains the deltoid. The pilon shatters the tibial ceiling, and a heel-drop fall flattens Bohler's angle while Gissane's gapes.","qs":["ORTHO-C10-054","ORTHO-C10-055","ORTHO-C10-056","ORTHO-C10-057","ORTHO-C10-058","ORTHO-C10-059","ORTHO-C10-060","ORTHO-C10-061"]},{"id":"ORTHO-U10-09","ch":10,"n":9,"title":"Lovers, Pilots, Hawkins","sec":"Talus Tales · p81","guide":"Jump for love and both heels plus the spine pay (lover's). Pilots crack the talar neck (aviator's) and gamble the body's blood — Hawkins I stays put, IV dislocates three joints, and a Hawkins stripe proves the bone still breathes.","qs":["ORTHO-C10-062","ORTHO-C10-063","ORTHO-C10-064","ORTHO-C10-065","ORTHO-C10-066"]},{"id":"ORTHO-U10-10","ch":10,"n":10,"title":"Chopart, Lisfranc, Jones","sec":"Midfoot · p81","guide":"Chopart splits the midfoot's intertarsal line; Lisfranc unkeys the tarso-metatarsal arch — the second metatarsal flees its cuneiform, the first gap widens, a fleck betrays the ligament. The 5th base zones out: pseudo-Jones avulses, true-Jones starves at the watershed, plain Jones sits beyond.","qs":["ORTHO-C10-067","ORTHO-C10-068","ORTHO-C10-069","ORTHO-C10-070","ORTHO-C10-071","ORTHO-C10-072","ORTHO-C10-073","ORTHO-C10-074"]},{"id":"ORTHO-U11-01","ch":11,"n":1,"title":"Strains, Sprains & Layers","sec":"Knee Map · p82","guide":"Fast crashes fracture; slow sport strains tendons (supraspinatus leads) and sprains ligaments (ankle's ATFL leads). Around the knee: collaterals guard outside the capsule, menisci float inside the synovium, cruciates hide inside the capsule but outside the synovium.","qs":["ORTHO-C11-001","ORTHO-C11-002","ORTHO-C11-003","ORTHO-C11-004","ORTHO-C11-005","ORTHO-C11-006","ORTHO-C11-007"]},{"id":"ORTHO-U11-02","ch":11,"n":2,"title":"Clinging MCL, Free LCL","sec":"Knee Map · p82–83","guide":"Walk the front of the knee bone by bone, then look down from above: the medial collateral clings to the medial meniscus (dooming it to tear together) while the lateral collateral floats free of its meniscus. Scopes diagnose best, MRIs investigate first.","qs":["ORTHO-C11-008","ORTHO-C11-009","ORTHO-C11-010","ORTHO-C11-011","ORTHO-C11-012","ORTHO-C11-013"]},{"id":"ORTHO-U11-03","ch":11,"n":3,"title":"Varus vs Valgus","sec":"Side Braces · p83","guide":"Collaterals brace the coronal plane: bow-leg varus snaps the LCL, knock-knee valgus snaps the MCL — the knee's commonest ligament victim. Pain points to its side, and a 30°-bent stress test pries the guilty joint open.","qs":["ORTHO-C11-014","ORTHO-C11-015","ORTHO-C11-016","ORTHO-C11-017","ORTHO-C11-018","ORTHO-C11-019"]},{"id":"ORTHO-U11-04","ch":11,"n":4,"title":"Braces & Bucket Handles","sec":"Crescents · p84","guide":"Nine in ten collaterals heal in a brace; MRI's coronal blush confirms it. Then meet the twin shock-absorbing, rotation-taming crescents of type-I collagen — twisted most often into bucket handles, medial before lateral.","qs":["ORTHO-C11-020","ORTHO-C11-021","ORTHO-C11-022","ORTHO-C11-023","ORTHO-C11-024","ORTHO-C11-025","ORTHO-C11-026"]},{"id":"ORTHO-U11-05","ch":11,"n":5,"title":"Locks, Clicks & Grinds","sec":"Crescent Tests · p84–85","guide":"Meniscal misery arrives late: aching, puffy, and locking mid-stride when a flap jams the hinge. McMurray hyperflexes, twists and extends; Apley grinds the prone knee at 90° — inward grind accuses lateral, outward accuses medial.","qs":["ORTHO-C11-027","ORTHO-C11-028","ORTHO-C11-029","ORTHO-C11-030","ORTHO-C11-031"]},{"id":"ORTHO-U11-06","ch":11,"n":6,"title":"Six Points, Three Zones","sec":"Maps & Blood · p85","guide":"Fingertips beat all: six joint-line points map each horn and body, front to back, medial then lateral. Sagittal MRI stages it — normal horns versus a heterogenous tear — but the scope has the last word. Only the red rim drinks blood; the white heart sips joint fluid.","qs":["ORTHO-C11-032","ORTHO-C11-033","ORTHO-C11-034","ORTHO-C11-035","ORTHO-C11-036","ORTHO-C11-037","ORTHO-C11-038","ORTHO-C11-039"]},{"id":"ORTHO-U11-07","ch":11,"n":7,"title":"Red Sewn, White Cut","sec":"Stitch or Trim · p86","guide":"Bloody red tears get stitched (meniscorrhaphy/meniscopexy); bloodless white tears get trimmed (menisectomy). Deeper inside, the cruciates police the sagittal plane — ACL leashing the tibia's forward slide and hyperextension, PCL its backward slide and hyperflexion.","qs":["ORTHO-C11-040","ORTHO-C11-041","ORTHO-C11-042","ORTHO-C11-043","ORTHO-C11-044","ORTHO-C11-045","ORTHO-C11-046"]},{"id":"ORTHO-U11-08","ch":11,"n":8,"title":"Pops, Drawers & Shifts","sec":"Cruciate Exams · p86–87","guide":"Hyperextension hurls the ACL, dashboard hyperflexion snaps the PCL — one twist, one pop, a joint full of blood and a leg that gives way. Drawer at 90° (3 mm of slide), Lachmann at 15–20° (the best), pivot shift (the most specific).","qs":["ORTHO-C11-047","ORTHO-C11-048","ORTHO-C11-049","ORTHO-C11-050","ORTHO-C11-051","ORTHO-C11-052","ORTHO-C11-053"]},{"id":"ORTHO-U11-09","ch":11,"n":9,"title":"Sags & New Ropes","sec":"PCL & Grafts · p87","guide":"The PCL sags backwards on the drawer and droops with gravity in Godfrey's hold. MRI investigates, arthroscopy confirms and then rebuilds — hamstring twins or patellar tendon as the new rope.","qs":["ORTHO-C11-054","ORTHO-C11-055","ORTHO-C11-056","ORTHO-C11-057","ORTHO-C11-058","ORTHO-C11-059"]},{"id":"ORTHO-U11-10","ch":11,"n":10,"title":"Portals & Two Ropes","sec":"Scope & Bundles · p88","guide":"Scopes love knees most: instruments enter medially, the 4mm 30° eye laterally. The ACL itself is two ropes — posterolateral guarding extension, interrogated by Lachmann; anteromedial guarding flexion, caught by the drawer.","qs":["ORTHO-C11-060","ORTHO-C11-061","ORTHO-C11-062","ORTHO-C11-063","ORTHO-C11-064","ORTHO-C11-065","ORTHO-C11-066"]},{"id":"ORTHO-U11-11","ch":11,"n":11,"title":"Segond & Unhappy Three","sec":"Triad Recipe · p88","guide":"A Segond flake off the lateral tibia screams ACL. Twist the full recipe — femur in, knee bent, foot planted, tibia flung out — and the unhappy triad falls: MCL, ACL and medial meniscus together.","qs":["ORTHO-C11-067","ORTHO-C11-068","ORTHO-C11-069","ORTHO-C11-070","ORTHO-C11-071"]},{"id":"ORTHO-U11-12","ch":11,"n":12,"title":"Alta, Baja & Dial Tests","sec":"Ratios & Spins · p89","guide":"MRI frames the triad plane by plane. The Insall-Salvati ratio (tendon over patella, 0.8–1.2) names alta floaters that redislocate and baja sinkers. Finally: pivot shift for anterolateral spin-outs, dial test for posterolateral ones.","qs":["ORTHO-C11-072","ORTHO-C11-073","ORTHO-C11-074","ORTHO-C11-075","ORTHO-C11-076","ORTHO-C11-077","ORTHO-C11-078","ORTHO-C11-079","ORTHO-C11-080"]},{"id":"ORTHO-U12-1","ch":12,"n":1,"title":"Microtrauma & Clinical Diagnosis","sec":"Intro · p90","qs":["ORTHO-C12-001","ORTHO-C12-002","ORTHO-C12-003"],"guide":"Painful regional conditions stand alone: repetitive microtrauma begets pain, and diagnosis is clinical — provoke the very movement that hurts. Shoulders arrive painful with no trauma history at all."},{"id":"ORTHO-U12-2","ch":12,"n":2,"title":"Frozen Shoulder: The Basics","sec":"Shoulder · p90","qs":["ORTHO-C12-004","ORTHO-C12-005","ORTHO-C12-006","ORTHO-C12-007","ORTHO-C12-008","ORTHO-C12-009"],"guide":"Frozen shoulder (adhesive capsulitis) is periarthritis of the shoulder — self limiting, bilateral in 30%. Watch for it in uncontrolled diabetics and thyroid disorders."},{"id":"ORTHO-U12-3","ch":12,"n":3,"title":"Frozen Shoulder: Cascade & Stages","sec":"Shoulder · p90","qs":["ORTHO-C12-010","ORTHO-C12-011","ORTHO-C12-012","ORTHO-C12-013","ORTHO-C12-014","ORTHO-C12-015","ORTHO-C12-016","ORTHO-C12-017"],"guide":"Capsulitis causes pain, then thickening and fibrosis, then contracture — blocking active AND passive movement. Freezing = capsulitis (pain+, no stiffness); frozen = adhesions (pain down, stiffness up); thawing = resolution (both down)."},{"id":"ORTHO-U12-4","ch":12,"n":4,"title":"Frozen Shoulder: Workup & Treatment","sec":"Shoulder · p91","qs":["ORTHO-C12-018","ORTHO-C12-019","ORTHO-C12-020","ORTHO-C12-021","ORTHO-C12-022","ORTHO-C12-023","ORTHO-C12-024","ORTHO-C12-025"],"guide":"Globally restricted ROM, rotation lost first (external > internal); X-ray normal, MRI shows capsulitis. General care — glycemic control (it may resolve spontaneously), physio, NSAIDs, steroids; specific care is adhesiolysis: manipulation under anesthesia or arthroscopic."},{"id":"ORTHO-U12-5","ch":12,"n":5,"title":"Impingement: Stabilisers & Space","sec":"Impingement · p91","qs":["ORTHO-C12-026","ORTHO-C12-027","ORTHO-C12-028","ORTHO-C12-029","ORTHO-C12-030","ORTHO-C12-031","ORTHO-C12-032","ORTHO-C12-033","ORTHO-C12-034"],"guide":"Impingement = painful arc syndrome in a ball-and-socket joint held by soft tissue more than bone: long head of biceps plus rotator cuff (supraspinatus above, subscapularis in front, infraspinatus and teres minor behind). The subacromial space between acromion and humeral head holds the bursa and supraspinatus tendon."},{"id":"ORTHO-U12-6","ch":12,"n":6,"title":"Impingement: Painful Arc & Tests","sec":"Impingement · p92","qs":["ORTHO-C12-035","ORTHO-C12-036","ORTHO-C12-037","ORTHO-C12-038","ORTHO-C12-039","ORTHO-C12-040","ORTHO-C12-041","ORTHO-C12-042","ORTHO-C12-043","ORTHO-C12-044"],"guide":"In a narrow space, abduction inflames the subacromial bursa, then the supraspinatus tendon; pain peaks at mid-abduction — the painful arc. Neer's raises the arm passively with a stable scapula; Hawkins-Kennedy elevates 90° in scapular plane and internally rotates. Conservative first; subacromial decompression if needed."},{"id":"ORTHO-U12-7","ch":12,"n":7,"title":"Rotator Cuff Tear: Core Concepts","sec":"RCT · p93","qs":["ORTHO-C12-045","ORTHO-C12-046","ORTHO-C12-047","ORTHO-C12-048","ORTHO-C12-049","ORTHO-C12-050","ORTHO-C12-051","ORTHO-C12-052"],"guide":"Supraspinatus tears most (then tendo Achilles); subscapularis is the forgotten tendon. Any tear drops stability and ends in arthropathy — degeneration in the old, trauma in the young. Pain rises against resistance; X-ray normal, MRI is IOC."},{"id":"ORTHO-U12-8","ch":12,"n":8,"title":"Rotator Cuff: Actions & Special Tests","sec":"RCT · p93","qs":["ORTHO-C12-053","ORTHO-C12-054","ORTHO-C12-055","ORTHO-C12-056","ORTHO-C12-057","ORTHO-C12-058","ORTHO-C12-059","ORTHO-C12-060"],"guide":"Abduction = supraspinatus (beer can, empty can, Jobe's); external rotation = infraspinatus and teres minor (horn blower's); internal rotation = subscapularis (lift off, belly press, bear hug). Empty can: 90° abduction, 30° flexion, full internal rotation; Jobe's: thumbs down in scapular plane."},{"id":"ORTHO-U12-9","ch":12,"n":9,"title":"RCT Treatment & Popeye Sign","sec":"RCT · p94","qs":["ORTHO-C12-061","ORTHO-C12-062","ORTHO-C12-063","ORTHO-C12-064"],"guide":"Treat tears with rest from overhead work, physio, NSAIDs, steroids, arthroscopic repair. A chronic tear overloads the other stabilisers until the long head of biceps ruptures — its belly balls up distally as the Popeye sign."},{"id":"ORTHO-U12-10","ch":12,"n":10,"title":"Thoracic Outlet: Anatomy & Causes","sec":"TOS · p94","qs":["ORTHO-C12-065","ORTHO-C12-066","ORTHO-C12-067","ORTHO-C12-068","ORTHO-C12-069"],"guide":"TOS entraps the neurovascular bundle in the outlet bounded by both scalenes, clavicle and first rib — contents: brachial plexus and subclavian vessels. Culprits: odd neck posture, upper-lobe lung tumour, cervical rib at C7."},{"id":"ORTHO-U12-11","ch":12,"n":11,"title":"TOS: Symptoms, Tests & Treatment","sec":"TOS · p95","qs":["ORTHO-C12-070","ORTHO-C12-071","ORTHO-C12-072","ORTHO-C12-073","ORTHO-C12-074","ORTHO-C12-075","ORTHO-C12-076","ORTHO-C12-077","ORTHO-C12-078","ORTHO-C12-079","ORTHO-C12-080","ORTHO-C12-081","ORTHO-C12-082","ORTHO-C12-083"],"guide":"Shoulder pain radiating down the arm, pale hand; neurological signs mature into vascular claudication, and C8-T1 compression gives Klumpke's palsy. Plexus compresses before artery, artery before vein. Adson's (head to affected side), reverse Adson's (opposite), Wright's hyperabduction, Roo's 3-minute hand opening-closing; MRI is IOC; surgery excises first rib, cervical rib or the tumour."},{"id":"ORTHO-U12-12","ch":12,"n":12,"title":"Tennis vs Golfer's Elbow","sec":"Elbow · p96","qs":["ORTHO-C12-084","ORTHO-C12-085","ORTHO-C12-086","ORTHO-C12-087","ORTHO-C12-088","ORTHO-C12-089"],"guide":"Tennis = lateral epicondylitis of the common extensor origin (ECRB before longus), proved by Cozen's resisted wrist extension. Golfer's = medial epicondylitis of the common flexor origin (flexor carpi radialis), proved by reverse Cozen's resisted flexion."},{"id":"ORTHO-U12-13","ch":12,"n":13,"title":"Epicondylitis Treatment & Ortho-biologics","sec":"Elbow · p96","qs":["ORTHO-C12-090","ORTHO-C12-091","ORTHO-C12-092","ORTHO-C12-093","ORTHO-C12-094"],"guide":"Activity modification, NSAIDs, ortho-biologics and a counterforce brace that stops motion reaching the muscle origin. Blood boosts healing AND inflammation; PRP (WBCs removed) boosts healing only; stem cells come from fat, marrow and periosteum."},{"id":"ORTHO-U12-14","ch":12,"n":14,"title":"De Quervain's Disease","sec":"Wrist & Hand · p96","qs":["ORTHO-C12-095","ORTHO-C12-096","ORTHO-C12-097","ORTHO-C12-098","ORTHO-C12-099","ORTHO-C12-100","ORTHO-C12-101"],"guide":"Stenosing tenosynovitis of APL and EPB in the first dorsal compartment, from overuse or rheumatoid arthritis. Women, radial styloid pain, Finkelstein's and Eichhoff's tests; rest, splint, steroid injections."},{"id":"ORTHO-U12-15","ch":12,"n":15,"title":"Dupuytren's Contracture & Ectopics","sec":"Wrist & Hand · p97","qs":["ORTHO-C12-102","ORTHO-C12-103","ORTHO-C12-104","ORTHO-C12-105","ORTHO-C12-106","ORTHO-C12-107","ORTHO-C12-108","ORTHO-C12-109","ORTHO-C12-110"],"guide":"Cord-like fibrosis of palmar fascia contracts the finger — idiopathic mostly, also diabetes and alcohol; men, bilateral, ring finger at the MCP joint. Ectopic cousins: Peyronie's (penis) and Ledderhose (soles). Treat: conservative, collagenase, fasciectomy."},{"id":"ORTHO-U12-16","ch":12,"n":16,"title":"Trigger Finger","sec":"Wrist & Hand · p98","qs":["ORTHO-C12-111","ORTHO-C12-112","ORTHO-C12-113","ORTHO-C12-114","ORTHO-C12-115","ORTHO-C12-116"],"guide":"Trauma stenoses the A-1 pulley at the MCP, blocking the FDP tendon: the finger sticks shut, then snaps open on forceful extension. Women, ring finger, rheumatoid association."},{"id":"ORTHO-U12-17","ch":12,"n":17,"title":"Gamekeeper's, Skier's & Bowler's Thumb","sec":"Wrist & Hand · p98","qs":["ORTHO-C12-117","ORTHO-C12-118","ORTHO-C12-119","ORTHO-C12-120","ORTHO-C12-121"],"guide":"Hyperabduction tears the thumb's ulnar collateral ligament (gamekeeper's/skier's thumb) — thumb spica, or surgery when a Stener lesion traps the adductor pollicis tendon in the gap. Bowler's thumb is a neuroma of the ulnar digital nerve from perineural fibrosis."},{"id":"ORTHO-U12-18","ch":12,"n":18,"title":"Ganglion & Compound Palmar Ganglion","sec":"Wrist & Hand · p99","qs":["ORTHO-C12-122","ORTHO-C12-123","ORTHO-C12-124","ORTHO-C12-125","ORTHO-C12-126","ORTHO-C12-127","ORTHO-C12-128","ORTHO-C12-129"],"guide":"Ganglion — the commonest wrist swelling, dorsal over ventral, a unilocular synovial cyst full of mucinous fluid; aspirate, sclerose or excise. Compound palmar ganglion is a misnomer: TB or rheumatoid flexor-sheath inflammation bulging forearms and hand into an hourglass, pinched at the retinaculum."},{"id":"ORTHO-U12-19","ch":12,"n":19,"title":"Osteochondritis Dissecans & Wilson's Test","sec":"Knee · p99","qs":["ORTHO-C12-130","ORTHO-C12-131","ORTHO-C12-132","ORTHO-C12-133","ORTHO-C12-134","ORTHO-C12-135"],"guide":"A bone fragment parts at the bone-cartilage interface and locks the knee — knee over elbow, lateral part of the medial femoral condyle. Wilson's test: pain extending the internally rotated leg, eased by external rotation."},{"id":"ORTHO-U12-20","ch":12,"n":20,"title":"Loose Bodies & Synovial Chondromatosis","sec":"Knee · p100","qs":["ORTHO-C12-136","ORTHO-C12-137","ORTHO-C12-138","ORTHO-C12-139","ORTHO-C12-140","ORTHO-C12-141"],"guide":"Loose bodies: osteoarthritic osteophytes overall and in the elderly, osteochondritis dissecans in the young. Many bodies at once means synovial chondromatosis — synovial metaplasia sprinkling cartilaginous bodies, a snowstorm on X-ray."},{"id":"ORTHO-U12-21","ch":12,"n":21,"title":"Chondromalacia Patellae & Baker's Cyst","sec":"Knee · p100","qs":["ORTHO-C12-142","ORTHO-C12-143","ORTHO-C12-144","ORTHO-C12-145","ORTHO-C12-146","ORTHO-C12-147","ORTHO-C12-148","ORTHO-C12-149","ORTHO-C12-150","ORTHO-C12-151","ORTHO-C12-152"],"guide":"Chondromalacia patellae softens cartilage — idiopathic, female, the top cause of anterior knee pain, worse rising after long sitting (movie sign). Baker's cyst is a pulsion diverticulum of synovium behind the knee from OA or RA: prominent in extension, gone in flexion, USG diagnoses, excision treats."},{"id":"ORTHO-U12-22","ch":12,"n":22,"title":"Bursitis Gallery","sec":"Bursa · p101","qs":["ORTHO-C12-153","ORTHO-C12-154","ORTHO-C12-155","ORTHO-C12-156","ORTHO-C12-157","ORTHO-C12-158","ORTHO-C12-159","ORTHO-C12-160","ORTHO-C12-161"],"guide":"Synovial sacs cut friction and let tendons glide; repetitive loading inflames them. Housemaid's knee = prepatellar, clergyman's knee = infrapatellar, student's elbow = olecranon, Haglund = retrocalcaneal (calcified bump), tailor's bunion = 5th metatarsal lateral, weaver's bottom = ischial."},{"id":"ORTHO-U12-23","ch":12,"n":23,"title":"Hallux Valgus vs Gout","sec":"Foot · p101","qs":["ORTHO-C12-162","ORTHO-C12-163","ORTHO-C12-164","ORTHO-C12-165","ORTHO-C12-166"],"guide":"Hallux valgus deviates the great toe laterally, swelling and hurting the first MTP — osteotomy fixes it. Gout mimics the pain but brings inflammation without deformity and needle-shaped monosodium urate crystals on aspiration."},{"id":"ORTHO-U12-24","ch":12,"n":24,"title":"AVN: Bones, Etiology & Steroids","sec":"AVN · p102","qs":["ORTHO-C12-167","ORTHO-C12-168","ORTHO-C12-169","ORTHO-C12-170","ORTHO-C12-171","ORTHO-C12-172","ORTHO-C12-173","ORTHO-C12-174"],"guide":"AVN favours femoral head (Chandler's), proximal scaphoid pole (Preiser's) and talar body. Non-traumatic is idiopathic — sickle cell, Gaucher's, Caisson's, Perthes', alcohol; traumatic follows vascular disruption. Steroids raise femoral head pressure, choke its blood supply and infarct it."},{"id":"ORTHO-U12-25","ch":12,"n":25,"title":"AVN: Clinical Features & X-ray","sec":"AVN · p102","qs":["ORTHO-C12-175","ORTHO-C12-176","ORTHO-C12-177","ORTHO-C12-178","ORTHO-C12-179","ORTHO-C12-180","ORTHO-C12-181","ORTHO-C12-182"],"guide":"Young men, bilateral in half (80% with steroid history). Antalgic limp, hip pain radiating to the knee, internal rotation and abduction restricted first — the sectoral sign. X-ray density changes lag weeks to months; the crescent sign marks early subchondral collapse."},{"id":"ORTHO-U12-26","ch":12,"n":26,"title":"AVN: MRI, Bone Scan & Treatment","sec":"AVN · p103","qs":["ORTHO-C12-183","ORTHO-C12-184","ORTHO-C12-185","ORTHO-C12-186","ORTHO-C12-187"],"guide":"MRI is IOC; bone scan shows the donut sign — a cold head ringed by normal uptake. Core decompression lowers pressure and revives flow, vascularised fibular grafts bring new vessels, and a destroyed head takes total hip replacement."},{"id":"ORTHO-U12-27","ch":12,"n":27,"title":"Traumatic AVN Trio","sec":"AVN · p103","qs":["ORTHO-C12-188","ORTHO-C12-189","ORTHO-C12-190"],"guide":"Three vascular watersheds: prolonged hip dislocation or femoral neck fracture kills the femoral head; scaphoid waist fracture kills the proximal pole; talar neck fracture kills the talar body."},{"id":"ORTHO-U12-28","ch":12,"n":28,"title":"Hawkin's Sign, Snowcap & Notes","sec":"AVN · p104","qs":["ORTHO-C12-191","ORTHO-C12-192","ORTHO-C12-193","ORTHO-C12-194","ORTHO-C12-195"],"guide":"Hawkin's sign — subchondral lucency on X-ray — reassures of viable, well-perfused bone; the snowcap sign caps a humeral head with AVN. Remember: intertrochanteric fractures malunite, and Hawkin's classification belongs to talus fractures."},{"id":"ORTHO-U13-1","ch":13,"n":1,"title":"Nerve Coverings & Fascicle","sec":"Structure · p105","qs":["ORTHO-C13-001","ORTHO-C13-002","ORTHO-C13-003","ORTHO-C13-004"],"guide":"Three tubes nest inside each other: epineurium wraps the nerve, perineurium wraps each fascicle, endoneurium wraps each axon. Blood vessels ride along the layers."},{"id":"ORTHO-U13-2","ch":13,"n":2,"title":"Complete vs Partial Transection","sec":"Pathology · p105","qs":["ORTHO-C13-005","ORTHO-C13-006","ORTHO-C13-007","ORTHO-C13-008","ORTHO-C13-009","ORTHO-C13-010"],"guide":"Cut completely and the distal segment undergoes Wallerian degeneration while the proximal stump balls into an end neuroma of naked sprouts — no further regeneration. Cut partially (sheath intact) and a neuroma in continuity bridges across, regenerating proximal-to-distal at 1 mm/day."},{"id":"ORTHO-U13-3","ch":13,"n":3,"title":"Tinel's Sign, Level & Motor March","sec":"Tinel · p106","qs":["ORTHO-C13-011","ORTHO-C13-012","ORTHO-C13-013","ORTHO-C13-014","ORTHO-C13-015","ORTHO-C13-016","ORTHO-C13-017"],"guide":"Percuss distal-to-proximal: a shock-like twang at the neuroma is Tinel positive. Non-progressive means end neuroma; progressive means neuroma in continuity regenerating. Higher injuries cripple more; recovering muscles march proximal to distal."},{"id":"ORTHO-U13-4","ch":13,"n":4,"title":"Seddon's Three Columns","sec":"Classification · p106","qs":["ORTHO-C13-018","ORTHO-C13-019","ORTHO-C13-020","ORTHO-C13-021","ORTHO-C13-022","ORTHO-C13-023","ORTHO-C13-024","ORTHO-C13-025"],"guide":"Neuropraxia = compression block, no neuroma, 100% recovery (tourniquet, Saturday night, crutch). Axonotmesis = axon down but a sheath intact, neuroma in continuity, <100% recovery, progressive Tinel and motor march (fractures, dislocations). Neurotmesis = complete transection, end neuroma, no recovery (lacerations, incised wounds)."},{"id":"ORTHO-U13-5","ch":13,"n":5,"title":"Sunderland's Five Types","sec":"Classification · p106","qs":["ORTHO-C13-026","ORTHO-C13-027","ORTHO-C13-028","ORTHO-C13-029","ORTHO-C13-030"],"guide":"Sunderland splits Seddon finely: Type I = neuropraxia; II = axon only; III = axon + endoneurium; IV = axon + endoneurium + perineurium; V = neurotmesis."},{"id":"ORTHO-U13-6","ch":13,"n":6,"title":"Diagnosis: Tinel & NCS","sec":"Management · p107","qs":["ORTHO-C13-031","ORTHO-C13-032","ORTHO-C13-033","ORTHO-C13-034","ORTHO-C13-035"],"guide":"Tinel's tracks recovery; nerve conduction study is IOC for the injury type. Its best parameter, nerve conduction velocity, times the impulse down each segment — compression slows it — with electromyography alongside."},{"id":"ORTHO-U13-7","ch":13,"n":7,"title":"When to Observe, When to Explore","sec":"Management · p107","qs":["ORTHO-C13-036","ORTHO-C13-037","ORTHO-C13-038","ORTHO-C13-039"],"guide":"Neuropraxia: wait and watch with a splint against contracture. Closed fracture: splint, observe, NCS if months pass without recovery, then explore. Open fracture or an obvious sharp nerve injury: straight to surgical exploration."},{"id":"ORTHO-U13-8","ch":13,"n":8,"title":"Nerve Repair & Grafts","sec":"Management · p107","qs":["ORTHO-C13-040","ORTHO-C13-041","ORTHO-C13-042","ORTHO-C13-043","ORTHO-C13-044"],"guide":"Primary repair inside 6 hours, delayed primary at 7-18 days, end-to-end or end-to-side. When the ends won't meet, graft — sural nerve most commonly, saphenous as alternate."},{"id":"ORTHO-U13-9","ch":13,"n":9,"title":"Tendon Transfer, Prognosis & Axonal Confusion","sec":"Tendon transfer · p108","qs":["ORTHO-C13-045","ORTHO-C13-046","ORTHO-C13-047","ORTHO-C13-048","ORTHO-C13-049","ORTHO-C13-050","ORTHO-C13-051"],"guide":"After a year unrepaired the motor end plates die and tendon transfer borrows working muscle-tendon units. NERVE-GROW lists the good omens — neuropraxia, early repair, radial nerve, vascularity, end-to-end, growing children. Axonal confusion wires motor into sensory (gustatory tears) and spoils prognosis."},{"id":"ORTHO-U13-10","ch":13,"n":10,"title":"Mixed Injury & Axillary Nerve","sec":"Specific injuries · p108","qs":["ORTHO-C13-052","ORTHO-C13-053","ORTHO-C13-054","ORTHO-C13-055","ORTHO-C13-056","ORTHO-C13-057"],"guide":"Mixed injury: sensory loss brings anesthesia and tingling; motor loss brings weakness plus antagonist overpull and deformity. Axillary nerve (C5, C6, mixed) drives deltoid and teres minor, feels the regimental badge area, and leaves the arm adducted, internally rotated."},{"id":"ORTHO-U13-11","ch":13,"n":11,"title":"Axillary Mechanisms & Limb Innervation Map","sec":"Specific injuries · p109","qs":["ORTHO-C13-058","ORTHO-C13-059","ORTHO-C13-060","ORTHO-C13-061","ORTHO-C13-062","ORTHO-C13-063","ORTHO-C13-064","ORTHO-C13-065","ORTHO-C13-066","ORTHO-C13-067","ORTHO-C13-068"],"guide":"Shoulder dislocation tops the causes, with surgical neck and glenoid fractures behind. Abduction runs supraspinatus 0-15°, deltoid 15-90°, serratus anterior and trapezius overhead. The map: arm anterior musculocutaneous / posterior radial; forearm anterior median / posterior interosseous; hand thenar median, hypothenar and intrinsics ulnar. Musculocutaneous loss leaves an extended, pronated forearm and numb lateral forearm."},{"id":"ORTHO-U13-12","ch":13,"n":12,"title":"Plexus Anatomy & Branch Nerves","sec":"Plexus · p109","qs":["ORTHO-C13-069","ORTHO-C13-070","ORTHO-C13-071","ORTHO-C13-072","ORTHO-C13-073","ORTHO-C13-074","ORTHO-C13-075","ORTHO-C13-076","ORTHO-C13-077","ORTHO-C13-078","ORTHO-C13-079","ORTHO-C13-080","ORTHO-C13-081"],"guide":"Roots C5-T1 build trunks, divisions, cords; Erb's point conflates C5, C6 and the suprascapular nerve. Supraclavicular traction (birth dystocia, neck stretch) gives Erb's — best prognosis; infraclavicular (hyperabduction fall, presenting-arm traction) gives Klumpke's; combined is worst. Long thoracic (C5-7) wings the scapula; suprascapular loss adducts and internally rotates."},{"id":"ORTHO-U13-13","ch":13,"n":13,"title":"Erb's & Klumpke's Palsy","sec":"Plexus · p111","qs":["ORTHO-C13-082","ORTHO-C13-083","ORTHO-C13-084","ORTHO-C13-085","ORTHO-C13-086","ORTHO-C13-087","ORTHO-C13-088","ORTHO-C13-089"],"guide":"Erb's hits suprascapular, axillary and musculocutaneous — the adducted, internally rotated, extended and pronated policeman's/waiter's/porter's tip. Klumpke's (C8, T1) merges ulnar and median palsy into a fully clawed hand, and T1 sympathetic loss unmasks Horner's: ptosis, miosis, anhydrosis, lost ciliospinal reflex. Splint it in the aeroplane splint."},{"id":"ORTHO-U14-1","ch":14,"n":1,"title":"Median Nerve: Labourer's Nerve","sec":"Median · p112","qs":["ORTHO-C14-001","ORTHO-C14-002","ORTHO-C14-003","ORTHO-C14-004","ORTHO-C14-005","ORTHO-C14-006","ORTHO-C14-007","ORTHO-C14-008"],"guide":"The labourer's nerve is mixed: motor to forearm flexors and thenar muscles, sensory to lateral 3½ palm and only the tips dorsally. At the retinaculum it splits — deep branch (thenar motor + tip sensation) and superficial (palmar sensation). CTS squeezes the deep branch, sparing palmar feeling."},{"id":"ORTHO-U14-2","ch":14,"n":2,"title":"Autonomous Zones","sec":"Median · p113","qs":["ORTHO-C14-009","ORTHO-C14-010","ORTHO-C14-011","ORTHO-C14-012"],"guide":"An autonomous zone is one nerve's private patch: index tip (median), little finger tip (ulnar), first web space dorsum (radial)."},{"id":"ORTHO-U14-3","ch":14,"n":3,"title":"Median Motor Map & LOAF","sec":"Median · p113","qs":["ORTHO-C14-013","ORTHO-C14-014","ORTHO-C14-015","ORTHO-C14-016","ORTHO-C14-017","ORTHO-C14-018"],"guide":"Arm: nothing. Forearm: every flexor except FCU and medial FDP (ulnar's share). Hand: the LOAF — lumbricals 1,2, opponens, abductor and flexor pollicis brevis — all thenar but adductor pollicis, which is ulnar."},{"id":"ORTHO-U14-4","ch":14,"n":4,"title":"Median Injuries: Wrist & Elbow","sec":"Median · p113","qs":["ORTHO-C14-019","ORTHO-C14-020","ORTHO-C14-021","ORTHO-C14-022","ORTHO-C14-023","ORTHO-C14-024"],"guide":"Wrist lesions come from carpal tunnel, elbow lesions from supracondylar fractures — where AIN tops the injury order ahead of median, radial, ulnar. Wrist injury: numb lateral 3½, wasted thenar, ape thumb; add FPL/FDS/FDP loss at elbow. Opponens splint treats."},{"id":"ORTHO-U14-5","ch":14,"n":5,"title":"Median Tests & AIN","sec":"Median · p114","qs":["ORTHO-C14-025","ORTHO-C14-026","ORTHO-C14-027","ORTHO-C14-028","ORTHO-C14-029","ORTHO-C14-030","ORTHO-C14-031","ORTHO-C14-032","ORTHO-C14-033","ORTHO-C14-034"],"guide":"Pen test lifts the thumb (APB); pointing index/benediction exposes FDS+FDP failure with the unflexed index; AIN — purely motor to FPL and lateral FDP — shows a weak OK (Miloh-Nevin) sign with no sensory loss and an easy fist. Lunate dislocation can squeeze the median."},{"id":"ORTHO-U14-6","ch":14,"n":6,"title":"Ulnar: Musician's Nerve","sec":"Ulnar · p115","qs":["ORTHO-C14-035","ORTHO-C14-036","ORTHO-C14-037","ORTHO-C14-038","ORTHO-C14-039","ORTHO-C14-040","ORTHO-C14-041","ORTHO-C14-042","ORTHO-C14-043"],"guide":"C8-T1 musician's nerve: forearm FCU and medial FDP; hand hypothenar, adductor pollicis, interossei (palmar adduct, dorsal abduct), lumbricals 3,4; senses medial 1½ all round. Cubital tunnel and Guyon's canal trap it; wrist lesions claw partially — complete clawing needs median too."},{"id":"ORTHO-U14-7","ch":14,"n":7,"title":"Ulnar Tests & the Paradox","sec":"Ulnar · p116","qs":["ORTHO-C14-044","ORTHO-C14-045","ORTHO-C14-046","ORTHO-C14-047","ORTHO-C14-048","ORTHO-C14-049","ORTHO-C14-050","ORTHO-C14-051","ORTHO-C14-052","ORTHO-C14-053","ORTHO-C14-054"],"guide":"Knuckle bender splint supports the claw. Card test = palmar interossei (card slips), Egawa and fanning = dorsal interossei, book test = adductor pollicis with Froment's thumb-flexion cheat. Elbow lesions spare clawing because FDP's medial half dies too — the ulnar paradox: higher injury, lesser claw."},{"id":"ORTHO-U14-8","ch":14,"n":8,"title":"Radial Nerve: Levels of Palsy","sec":"Radial · p117","qs":["ORTHO-C14-055","ORTHO-C14-056","ORTHO-C14-057","ORTHO-C14-058","ORTHO-C14-059","ORTHO-C14-060","ORTHO-C14-061","ORTHO-C14-062","ORTHO-C14-063","ORTHO-C14-064","ORTHO-C14-065","ORTHO-C14-066"],"guide":"Most injured yet best prognosis — purely motor, extending elbow, wrist, fingers from the posterior cord. Long-head triceps branch fires first; ECRL is the first wrist extensor; PIN takes supinator, ECRB and finger extensors. Levels: radial head (PIN: finger+thumb drop), lateral condyle (+sensory), spiral groove (+wrist drop, m/c), axilla (+elbow extension lost). Below ECRL, no wrist drop."},{"id":"ORTHO-U14-9","ch":14,"n":9,"title":"Holstein-Lewis, Splints & Test Tables","sec":"Radial · p118","qs":["ORTHO-C14-067","ORTHO-C14-068","ORTHO-C14-069","ORTHO-C14-070","ORTHO-C14-071","ORTHO-C14-072","ORTHO-C14-073"],"guide":"Holstein-Lewis — humeral shaft fracture at the upper/lower third junction — entraps radial nerve, the m/c cause. Cock-up splint answers wrist drop: static extends wrist, dynamic also lets fingers flex. The summary tables pair every sign with its muscle, Froment to pincer grasp."},{"id":"ORTHO-U14-10","ch":14,"n":10,"title":"Sciatic & Common Peroneal","sec":"Lower limb · p119","qs":["ORTHO-C14-074","ORTHO-C14-075","ORTHO-C14-076","ORTHO-C14-077","ORTHO-C14-078","ORTHO-C14-079","ORTHO-C14-080","ORTHO-C14-081","ORTHO-C14-082"],"guide":"Sciatic injury behaves like CPN injury — peroneal fibres ride peripherally around the tibial core; hip surgeries top the causes. At the fibular neck the CPN splits: superficial everts and feels the dorsum, deep dorsiflexes and feels the first web. Fibular neck fracture drops the foot into equinovarus and a steppage gait; AFO splints it."},{"id":"ORTHO-U14-11","ch":14,"n":11,"title":"Carpal Tunnel Syndrome","sec":"Entrapment · p120","qs":["ORTHO-C14-083","ORTHO-C14-084","ORTHO-C14-085","ORTHO-C14-086","ORTHO-C14-087","ORTHO-C14-088","ORTHO-C14-089","ORTHO-C14-090","ORTHO-C14-091","ORTHO-C14-092","ORTHO-C14-093","ORTHO-C14-094","ORTHO-C14-095","ORTHO-C14-096"],"guide":"Trapped under the flexor retinaculum, the median — m/c entrapped nerve in the m/c entrapment neuropathy — burns at night along lateral 3½ fingers in middle-aged women, eased by shaking or hanging the hand. Idiopathic leads causes; myxedema, pregnancy, acromegaly, Colles' hematoma, gout, amyloid, diabetes follow. Durkan's 30-second compression is the best clinical test, NCS the IOC; rest-steroid-splint first, then release the ligament. Allen's test clears the hand's vessels before arterial lines."},{"id":"ORTHO-U14-12","ch":14,"n":12,"title":"Opposition & Meralgia","sec":"Entrapment · p122","qs":["ORTHO-C14-097","ORTHO-C14-098","ORTHO-C14-099","ORTHO-C14-100"],"guide":"Opponens pollicis, deep median branch, performs opposition — the single function CTS destroys completely. Meralgia paraesthetica burns the lateral thigh where the lateral cutaneous nerve ducks under the inguinal ligament, pinched by overweight and tight clothing."},{"id":"ORTHO-U14-13","ch":14,"n":13,"title":"The Entrapment Table","sec":"Entrapment · p122","qs":["ORTHO-C14-101","ORTHO-C14-102","ORTHO-C14-103","ORTHO-C14-104","ORTHO-C14-105","ORTHO-C14-106","ORTHO-C14-107","ORTHO-C14-108"],"guide":"Memorise the grid: cubital tunnel — ulnar behind medial condyle; Guyon's — ulnar under piso-hamate; pronator syndrome — median at pronator teres heads; Kiloh-Nevin — AIN in supracondylar fracture; cheiralgia — superficial radial at the styloid (watch, cuffs, bangles); meralgia — lateral femoral cutaneous under inguinal ligament; pyriformis — sciatic; tarsal tunnel — posterior tibial behind medial malleolus; Morton — interdigital nerve, 3rd-4th toe."},{"id":"ORTHO-U15-1","ch":15,"n":1,"title":"Enneking's Grid","sec":"Classification · p123","qs":["ORTHO-C15-001","ORTHO-C15-002","ORTHO-C15-003","ORTHO-C15-004","ORTHO-C15-005","ORTHO-C15-006"],"guide":"William Enneking, father of orthopaedic oncology, grades benign lesions by capsule — latent thick, active thin, aggressive breached (NOF, ABC, GCT) — and malignant ones by grade and compartment: low or high, intra (A) or extra (B), stage III metastasis."},{"id":"ORTHO-U15-2","ch":15,"n":2,"title":"Cell Types & X-ray Look","sec":"Classification · p123","qs":["ORTHO-C15-007","ORTHO-C15-008","ORTHO-C15-009","ORTHO-C15-010","ORTHO-C15-011","ORTHO-C15-012"],"guide":"Chondrocytes (cartilage formers: osteochondroma, enchondroma, chondroblastoma → chondrosarcoma) look lucent/hazy with calcification; osteoblasts (osteoid osteoma, osteoblastoma → osteosarcoma) look dense/sclerosed; osteoclasts (giant cell tumor) destroy bone."},{"id":"ORTHO-U15-3","ch":15,"n":3,"title":"Miscellaneous Bone Tumors","sec":"Classification · p123","qs":["ORTHO-C15-013","ORTHO-C15-014","ORTHO-C15-015","ORTHO-C15-016"],"guide":"Haemangioma — benign vascular, spinal; simple bone cyst and fibrous dysplasia — mesenchymal, the latter swapping bone for fibrous tissue; Ewing's — malignant small round blue cell family rising from the medullary cavity."},{"id":"ORTHO-U15-4","ch":15,"n":4,"title":"Where in the Bone","sec":"Location · p124","qs":["ORTHO-C15-017","ORTHO-C15-018","ORTHO-C15-019","ORTHO-C15-020"],"guide":"Epiphysis: chondroblastoma while the growth plate shows (child), GCT once it closes (adult). Diaphysis: Ewing's, osteoid osteoma with aspirin-responsive night pains, adamantinoma. Metaphysis: osteosarcoma, osteochondroma, ABC, UBC, NOF, chondromyxoid fibroma. Osteoid osteoma lays the most matrix."},{"id":"ORTHO-U15-5","ch":15,"n":5,"title":"Nature of the Tumour","sec":"Nature · p124","qs":["ORTHO-C15-021","ORTHO-C15-022","ORTHO-C15-023"],"guide":"Truly benign: osteoid osteoma, simple bone cyst. Benign but with malignant potential: GCT, osteoblastoma, osteochondroma. Frankly malignant: chondrosarcoma, osteosarcoma, Ewing's, adamantinoma, chordoma."},{"id":"ORTHO-U15-6","ch":15,"n":6,"title":"Age Bands","sec":"Age · p124","qs":["ORTHO-C15-024","ORTHO-C15-025","ORTHO-C15-026","ORTHO-C15-027","ORTHO-C15-028","ORTHO-C15-029"],"guide":"Ewing's rules the first decade (peaks in the second); primary osteosarcoma is the commonest malignant bone tumour of children at 10-20; GCT/osteoclastoma at 30-40; secondary osteosarcoma (Paget's, radiation) and chondrosarcoma at 40-60; metastasis, myeloma, adamantinoma and chordoma after 60."},{"id":"ORTHO-U15-7","ch":15,"n":7,"title":"Periosteal Reactions","sec":"Misc topics · p125","qs":["ORTHO-C15-030","ORTHO-C15-031","ORTHO-C15-032","ORTHO-C15-033","ORTHO-C15-034","ORTHO-C15-035","ORTHO-C15-036","ORTHO-C15-037"],"guide":"Insulted periosteum builds new bone to wall off pathology: thick and solid when indolent, thin and lamellated when aggressive. Onion peel = Ewing's, sunburst (calcified Sharpey's fibres) and Codman's triangle = osteosarcoma, solid = osteomyelitis."},{"id":"ORTHO-U15-8","ch":15,"n":8,"title":"Pulsatile Bone Tumors","sec":"Misc topics · p125","qs":["ORTHO-C15-038","ORTHO-C15-039","ORTHO-C15-040"],"guide":"Vascular tumours pulsate with a bruit — osteosarcoma most of all, then ABC, GCT and metastases from kidney and thyroid."},{"id":"ORTHO-U15-9","ch":15,"n":9,"title":"Polyostotic, NOF & Fibrous Dysplasia","sec":"FD · p126","qs":["ORTHO-C15-041","ORTHO-C15-042","ORTHO-C15-043","ORTHO-C15-044","ORTHO-C15-045","ORTHO-C15-046","ORTHO-C15-047"],"guide":"Polyostotic means multicentric — same bone or many, never metastatic: FD, GCT, enchondroma, osteochondroma. Non-ossifying fibroma is a cortical, eccentric, self-resolving metaphyseal defect of the first decade. Fibrous dysplasia replaces bone with fibrous tissue, loves the femur, and is usually monostotic."},{"id":"ORTHO-U15-10","ch":15,"n":10,"title":"FD Workup & Syndromes","sec":"FD · p126","qs":["ORTHO-C15-048","ORTHO-C15-049","ORTHO-C15-050","ORTHO-C15-051"],"guide":"Biopsy (best ix) reads Chinese letters; X-ray shows ground glass, RIND sign and shepherd crook deformity. McCune-Albright adds café au lait spots and precocious puberty; Mazabraud a
